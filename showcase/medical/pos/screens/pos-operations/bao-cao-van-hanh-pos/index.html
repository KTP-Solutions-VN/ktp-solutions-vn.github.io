<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POS Operational Reports — CareJourney POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../assets/css/global.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="pos-mat">
  <div class="pos-device">

    <header class="device-bar">
      <div class="device-bar__left">
        <div class="device-brand"><span class="device-brand__mark">CJ</span> CareJourney POS</div>
        <span class="device-bar__meta" data-device-outlet>Meridian Health — Central Pharmacy</span>
      </div>
      <div class="device-bar__right">
        <span class="session-pill" data-session-pill><span class="session-pill__dot"></span><span data-session-label>Session Open</span></span>
        <span class="device-clock" data-device-clock></span>
        <div class="device-controls">
          <a class="dc-btn" href="../man-hinh-ban-hang-pos/index.html" title="Back to Sales Screen">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M9 22V12h6v10"/></svg>
            Home
          </a>
        </div>
      </div>
    </header>

    <div class="device-body">
      <main class="device-main scroll-area report-main">

        <div class="report-header">
          <div>
            <h2>POS Operational Reports</h2>
            <p class="text-muted text-caption mt-2">Cashier session closing, sales, patient/medication trends and NEHR submission compliance — sourced from POS App data.</p>
          </div>
          <button class="btn btn-outline" id="exportBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
            Export
          </button>
        </div>

        <div class="filter-row">
          <div class="field" style="margin-bottom:0;min-width:220px;">
            <label>Outlet</label>
            <select class="input" id="outletFilter">
              <option>Meridian Health — Central Pharmacy</option>
              <option>Meridian Health — Westside Pharmacy</option>
            </select>
          </div>
          <div class="field" style="margin-bottom:0;">
            <label>From</label>
            <input type="date" class="input" id="dateFrom" value="2026-09-01">
          </div>
          <div class="field" style="margin-bottom:0;">
            <label>To</label>
            <input type="date" class="input" id="dateTo" value="2026-09-17">
          </div>
        </div>

        <div class="tabs mt-3" id="reportTabs">
          <button class="tab-btn is-active" data-tab="summary">Daily Sales Summary</button>
          <button class="tab-btn" data-tab="session">Session Closing Reports</button>
          <button class="tab-btn" data-tab="transactions">Detailed Transactions</button>
          <button class="tab-btn" data-tab="patients">Patient & Medication Trends</button>
          <button class="tab-btn" data-tab="nehr">NEHR Submission Log</button>
        </div>

        <div class="tab-panel" id="panel-summary"></div>
        <div class="tab-panel" id="panel-session" style="display:none;"></div>
        <div class="tab-panel" id="panel-transactions" style="display:none;"></div>
        <div class="tab-panel" id="panel-patients" style="display:none;"></div>
        <div class="tab-panel" id="panel-nehr" style="display:none;"></div>

      </main>
    </div>

    <button class="reset-demo-btn">Reset demo data</button>
  </div>
</div>

<script src="../../../assets/data/product.js"></script>
<script src="../../../assets/data/prescription.js"></script>
<script src="../../../assets/data/transaction.js"></script>
<script src="../../../assets/js/global.js"></script>
<script src="script.js"></script>
</body>
</html>
