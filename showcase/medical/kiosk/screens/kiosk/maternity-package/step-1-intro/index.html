<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Select a Maternity Package — CareJourney Kiosk</title>
<meta name="theme-color" content="#4C5FFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="data:image/png;base64,iVBORw0KGgo=">
<link rel="stylesheet" href="../../../../assets/css/global.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="kiosk-device" id="kioskDevice">

    <div class="kiosk-topbar">
      <div class="kiosk-brand">
        <div class="kiosk-brand-mark" aria-hidden="true">CJ</div>
        <div>
          <div class="kiosk-brand-name">CareJourney</div>
          <div class="kiosk-brand-sub">Maternity Package Sign-up</div>
        </div>
      </div>
      <div class="kiosk-topbar-right">
        <div class="kiosk-idle-ring" id="idleRing" title="Session activity"></div>
        <button type="button" class="kiosk-home-btn" id="homeBtn" aria-label="Cancel to Home" title="Cancel to Home">
          <svg class="icon" viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-5h2v5h4a1 1 0 0 0 1-1v-9"/></svg>
        </button>
      </div>
    </div>

    <div class="kiosk-progress" data-step="1">
      <div class="kiosk-progress-step is-active">
        <div class="kiosk-progress-bar"><span></span></div>
        <div class="kiosk-progress-label">1 · Select a package</div>
      </div>
      <div class="kiosk-progress-step">
        <div class="kiosk-progress-bar"><span></span></div>
        <div class="kiosk-progress-label">2 · Mother&#39;s details</div>
      </div>
      <div class="kiosk-progress-step">
        <div class="kiosk-progress-bar"><span></span></div>
        <div class="kiosk-progress-label">3 · Pregnancy info</div>
      </div>
      <div class="kiosk-progress-step">
        <div class="kiosk-progress-bar"><span></span></div>
        <div class="kiosk-progress-label">4 · Complete</div>
      </div>
    </div>

    <div class="kiosk-content">
      <div class="content-col">
        <div>
          <h1 style="font-size:24px;">Which maternity package interests you?</h1>
          <p style="margin-top:6px;color:var(--gray-600);font-size:14px;line-height:1.5;">Pick the package you&#39;d like to register interest in — you can add the other one later.</p>
        </div>

        <div class="option-card-group" id="optionGroup">
          <label class="option-card" data-value="Antenatal Care Plan">
            <input type="radio" name="serviceType" value="Antenatal Care Plan">
            <div class="option-card-icon"><svg class="icon" viewBox="0 0 24 24"><path d="M12.5 20s-7-4.3-9-8.7C1.9 8 3.3 4.8 6.4 4.2c2-.4 3.7.5 4.7 1.9.9-1.4 2.6-2.3 4.6-1.9 3.1.6 4.5 3.8 2.9 7.1-2 4.4-6.1 8.7-6.1 8.7Z"/><path d="M4 11h2l1.2-2.4L9 12l1-2h2.2"/></svg></div>
            <div class="option-card-body">
              <div class="option-card-title">Antenatal Care Plan</div>
              <div class="option-card-desc">Regular check-ups with a Meridian Specialists obstetrician throughout your pregnancy — scans, tests and monitoring in one plan.</div>
            </div>
            <div class="option-card-check"><svg viewBox="0 0 24 24"><path d="M5 12.5 9.5 17 19 7"/></svg></div>
          </label>

          <label class="option-card" data-value="Birthing Suite Reservation">
            <input type="radio" name="serviceType" value="Birthing Suite Reservation">
            <div class="option-card-icon"><svg class="icon" viewBox="0 0 24 24"><path d="M3 18v-8a2 2 0 0 1 2-2h5v5"/><path d="M3 13h18v5"/><path d="M3 21v-3"/><path d="M21 21v-3"/><circle cx="7" cy="9.5" r="1.4"/></svg></div>
            <div class="option-card-body">
              <div class="option-card-title">Birthing Suite Reservation</div>
              <div class="option-card-desc">Reserve your preferred birthing suite ahead of your due date; our team confirms the room type and rate.</div>
            </div>
            <div class="option-card-check"><svg viewBox="0 0 24 24"><path d="M5 12.5 9.5 17 19 7"/></svg></div>
          </label>
        </div>
      </div>
    </div>

    <div class="kiosk-footer footer-single">
      <button type="button" class="btn btn-primary btn-huge" id="continueBtn" disabled>
        Continue
        <svg class="icon" viewBox="0 0 24 24"><path d="M4.5 12h15"/><path d="m13.5 5.5 6.5 6.5-6.5 6.5"/></svg>
      </button>
    </div>

    <button type="button" class="faq-fab" id="faqFab">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.5 9.3a2.6 2.6 0 0 1 5 .9c0 1.7-2.4 2-2.4 3.6"/><circle cx="12" cy="17" r=".2" fill="currentColor"/></svg>
      Need Help?
    </button>
    <div class="faq-overlay" id="faqOverlay">
      <div class="faq-panel">
        <div class="faq-panel-head">
          <h2>Frequently asked questions</h2>
          <button type="button" class="faq-close-btn" id="faqCloseBtn" aria-label="Close">
            <svg class="icon" viewBox="0 0 24 24"><path d="m6 6 12 12"/><path d="m18 6-12 12"/></svg>
          </button>
        </div>
        <div class="faq-panel-body"></div>
      </div>
    </div>

  </div>

  <script src="../../../../assets/data/maternity-inquiries.js"></script>
  <script src="../../../../assets/js/global.js"></script>
  <script src="script.js"></script>
</body>
</html>
