<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Update Profile — CareJourney</title>
<link rel="stylesheet" href="../../../assets/css/global.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="modal-backdrop-screen">
  <div class="modal-card">
    <div class="modal-card__header">
      <h3 style="margin:0;">Update Profile</h3>
      <a class="modal-close" href="../../../screens/khach-hang/tai-khoan-cua-toi/index.html" aria-label="Close"><svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></a>
    </div>
    <div class="tabs" style="padding:0 var(--sp-5);margin-bottom:0;">
      <button class="tab-item is-active" data-tab="details">Personal Details</button>
      <button class="tab-item" data-tab="password">Change Password</button>
    </div>
    <div class="modal-card__body">
      <div class="tab-panel is-active" id="tab-details">
        <div class="form-group"><label>Full Name</label><input class="input" id="f-name" value="Charlotte Nguyen"></div>
        <div class="form-row">
          <div class="form-group"><label>Email</label><input class="input" type="email" id="f-email" value="charlotte.nguyen@example.com"></div>
          <div class="form-group"><label>Phone</label><input class="input" id="f-phone" value="+61 491 234 567"></div>
        </div>
        <div class="form-group"><label>Address</label><input class="input" id="f-address" value="Unit 8, 12 Avoca Street, Randwick"></div>
        <div class="form-row">
          <div class="form-group"><label>City</label><input class="input" value="Sydney"></div>
          <div class="form-group"><label>Postcode</label><input class="input" value="2031"></div>
        </div>
      </div>
      <div class="tab-panel" id="tab-password">
        <div class="form-group"><label>Current Password</label><input class="input" type="password" placeholder="••••••••"></div>
        <div class="form-group"><label>New Password</label><input class="input" type="password" placeholder="At least 8 characters"></div>
        <div class="form-group"><label>Confirm New Password</label><input class="input" type="password" placeholder="Re-enter new password"></div>
        <p class="field-hint">Changes here also sync back to your One Meridian Pass account.</p>
      </div>
    </div>
    <div class="modal-card__footer">
      <a href="../../../screens/khach-hang/tai-khoan-cua-toi/index.html" class="btn btn-ghost">Cancel</a>
      <button class="btn btn-primary" id="btn-save-profile">Save Changes</button>
    </div>
  </div>
</div>
<div id="toast-region"></div>
<script src="../../../assets/js/global.js"></script>
<script src="script.js"></script>
</body>
</html>
