<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Account Closure Request — CareJourney</title>
<link rel="stylesheet" href="../../../assets/css/global.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="modal-backdrop-screen">
  <div class="modal-card">
    <div class="modal-card__header">
      <h3 style="margin:0;">Account Closure Request</h3>
      <a class="modal-close" href="../../../screens/khach-hang/tai-khoan-cua-toi/index.html" aria-label="Close"><svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></a>
    </div>
    <div class="modal-card__body">
      <div class="card" style="background:var(--warning-bg);border-color:#f0dca6;margin-bottom:var(--sp-4);">
        <div class="flex-gap-3">
          <svg class="icon" viewBox="0 0 24 24" style="color:var(--warning);flex-shrink:0;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <p class="mb-0 text-sm">This action is permanent. Once processed, your profile, order history and loyalty points will be anonymised or deleted per the Privacy Act 1988 (Australian Privacy Principles), and you will lose access to your CareJourney account.</p>
        </div>
      </div>
      <div class="form-group">
        <label>Reason for deletion *</label>
        <select class="input" id="delete-reason" required>
          <option value="">Select a reason…</option>
          <option>I no longer use Meridian Health services</option>
          <option>Privacy concerns</option>
          <option>Duplicate account</option>
          <option>Other</option>
        </select>
      </div>
      <div class="form-group"><label>Additional comments (optional)</label><textarea class="input" rows="3" placeholder="Tell us more, if you'd like"></textarea></div>
      <label class="flex-gap-2" style="align-items:flex-start;">
        <input type="checkbox" id="ack-checkbox" style="margin-top:4px;accent-color:var(--error);">
        <span class="text-sm">I understand this action cannot be undone and confirm I want to permanently delete my account and data.</span>
      </label>
    </div>
    <div class="modal-card__footer">
      <a href="../../../screens/khach-hang/tai-khoan-cua-toi/index.html" class="btn btn-ghost">Cancel</a>
      <button class="btn btn-danger-ghost" style="background:var(--error);color:#fff;" id="btn-confirm-delete" disabled>Submit Deletion Request</button>
    </div>
  </div>
</div>
<div id="toast-region"></div>
<script src="../../../assets/js/global.js"></script>
<script src="script.js"></script>
</body>
</html>
