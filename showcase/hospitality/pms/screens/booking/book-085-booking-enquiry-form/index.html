<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booking Enquiry — Azura Manager</title>
<link rel="icon" href="../../../assets/img/azura-logo.svg">
<link rel="stylesheet" href="../../../assets/css/global.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="public-body">

<header class="public-topbar">
  <img src="../../../assets/img/azura-logo.svg" alt="Azura Stays logo">
  <span class="public-topbar__text">Azura Manager</span>
</header>

<main class="public-main">
  <div class="enquiry-hero" id="villa-hero">
    <div class="enquiry-hero__overlay">
      <h1 id="villa-name">Villa</h1>
      <p id="villa-tagline"></p>
    </div>
  </div>

  <div class="enquiry-card">
    <p class="enquiry-greeting" id="greeting-text"></p>
    <div class="alert alert-danger" id="overlap-warning" hidden>These dates are already booked for this villa. Please choose different dates.</div>

    <form id="enquiry-form" class="form-grid" data-validate>
      <div class="form-group">
        <label for="ef-first">First Name</label>
        <input type="text" id="ef-first" required>
        <span class="form-error"></span>
      </div>
      <div class="form-group">
        <label for="ef-last">Last Name</label>
        <input type="text" id="ef-last" required>
        <span class="form-error"></span>
      </div>
      <div class="form-group">
        <label for="ef-phone">Phone Number</label>
        <input type="text" id="ef-phone" required>
        <span class="form-error"></span>
      </div>
      <div class="form-group">
        <label for="ef-email">Email</label>
        <input type="email" id="ef-email" required>
        <span class="form-error"></span>
      </div>
      <div class="form-group">
        <label for="ef-adults">Number of Adults</label>
        <input type="number" id="ef-adults" min="1" value="2" required>
        <span class="form-error"></span>
      </div>
      <div class="form-group">
        <label for="ef-children">Number of Children</label>
        <input type="number" id="ef-children" min="0" value="0" required>
        <span class="form-error"></span>
      </div>
      <div class="form-group">
        <label for="ef-checkin">Check-in Date</label>
        <input type="date" id="ef-checkin" required>
        <span class="form-error"></span>
      </div>
      <div class="form-group">
        <label for="ef-checkout">Check-out Date</label>
        <input type="date" id="ef-checkout" required>
        <span class="form-error"></span>
      </div>
    </form>
    <p class="text-xs text-muted" id="min-stay-note"></p>
    <div class="form-actions"><button type="button" class="btn btn-primary" id="submit-enquiry-btn">Submit Enquiry</button></div>
  </div>
</main>

<footer class="public-footer">Azura Stays PMS &middot; Prototype v0.1</footer>

<script src="../../../assets/js/global.js"></script>
<script src="../_shared/booking-data.js"></script>
<script src="script.js"></script>
</body>
</html>
