<div class="owp-content">
  <div class="page-header"><div><h1>Block Dates</h1><p class="subtitle">Block dates on one of your properties for personal use.</p></div></div>
  <div class="card" style="max-width:600px;"><div class="card__body">
    <form id="booking-form" novalidate>
      <div class="form-grid">
        <div class="form-group full"><label>Property<span class="req">*</span></label><select id="f-property" required></select><span class="form-error"></span></div>
        <div class="form-group"><label>Check-in<span class="req">*</span></label><input type="date" id="f-checkin" required><span class="form-error"></span></div>
        <div class="form-group"><label>Check-out<span class="req">*</span></label><input type="date" id="f-checkout" required><span class="form-error"></span></div>
        <div class="form-group full"><label>Notes</label><textarea id="f-notes" placeholder="e.g. Family visit"></textarea></div>
      </div>
      <div class="flex-gap-8" style="margin-top:20px;"><button type="submit" class="btn btn-primary" id="save-btn">Block Dates</button><a href="../owp-010-booking-list/index.html" class="btn btn-ghost">Cancel</a></div>
    </form>
  </div></div>
