<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Password — Azura Manager Owner Hub</title>
<link rel="icon" href="../../../assets/img/azura-logo.svg">
<link rel="stylesheet" href="../../../assets/css/global.css">
<link rel="stylesheet" href="../owp-001-login/style.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
<div class="auth-shell">
  <aside class="auth-hero">
    <div class="auth-hero__blob auth-hero__blob--1"></div>
    <div class="auth-hero__blob auth-hero__blob--2"></div>
    <div class="auth-hero__content">
      <div class="auth-hero__brand"><img src="../../../assets/img/azura-logo.svg" alt="Azura Stays logo"><span>Azura Manager <small>Owner Hub</small></span></div>
      <h1>Set a new password for your account.</h1>
      <p class="auth-hero__tagline">Choose a strong password to keep your property and payout information secure.</p>
    </div>
  </aside>
  <main class="auth-form-panel">
    <div class="auth-form-wrap">
      <div class="auth-form-header"><h2>Reset your password</h2><p>Enter a new password for your Owner Hub account.</p></div>
      <form id="reset-form" novalidate>
        <div class="form-group"><label>New Password<span class="req">*</span></label><input type="password" id="f-password" required minlength="8"><span class="form-error"></span></div>
        <div class="form-group"><label>Confirm Password<span class="req">*</span></label><input type="password" id="f-confirm" required minlength="8"><span class="form-error"></span></div>
        <button type="submit" class="btn btn-primary btn-block" id="save-btn">Set New Password</button>
      </form>
      <p class="auth-footnote"><a href="../owp-001-login/index.html" class="auth-link">Back to sign in</a></p>
    </div>
  </main>
</div>
<script src="../../../assets/js/global.js"></script>
<script src="script.js"></script>
</body>
</html>
