    <span>Azura Manager<small>Owner Portal</small></span>
  </a>
  <nav class="owp-topnav__links">
    <a href="../owp-002-dashboard/index.html" data-nav="dashboard">Dashboard</a>
    <a href="../owp-005-property-list/index.html" data-nav="properties">My Properties</a>

    <a href="../owp-017-direct-booking-request-list/index.html" data-nav="requests" class="active">Direct Requests</a>

  <div class="topbar__user-wrap">

      <div class="topbar__user-meta"><div class="topbar__user-name">Richard Halstead</div><div class="topbar__user-role">Property Owner</div></div>
    </div>
    <div class="user-dropdown" data-user-dropdown>
      <a href="../owp-004-personal-profile/index.html"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg> My Profile</a>

    </div>

</header>

<div class="owp-content">
  <div class="page-header"><div><h1>Direct Booking Requests</h1><p class="subtitle">Request personal use dates for your own properties.</p></div><div class="page-header__actions"><button class="btn btn-primary" id="add-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Request New Booking</button></div></div>
  <div class="card"><div class="card__body"><div class="table-wrap"><table class="data-table"><thead><tr><th>Property</th><th>Dates</th><th>Status</th><th style="text-align:right;">Actions</th></tr></thead><tbody id="list-tbody"></tbody></table></div></div></div>
</div>
<button class="reset-demo-btn" data-reset-demo="mm_owp_direct_requests">Reset demo data</button>
<div class="modal-overlay" id="request-modal">
  <div class="modal modal-sm">
    <div class="modal__header"><div><h2>Request New Booking</h2></div><button class="modal__close" data-close-modal>&times;</button></div>
    <div class="modal__body">
      <form id="request-form" novalidate>
        <div class="form-group"><label>Property<span class="req">*</span></label><select id="f-property" required></select></div>
        <div class="form-group"><label>Check-in<span class="req">*</span></label><input type="date" id="f-checkin" required><span class="form-error"></span></div>
        <div class="form-group"><label>Check-out<span class="req">*</span></label><input type="date" id="f-checkout" required><span class="form-error"></span></div>
      </form>
    </div>
    <div class="modal__footer"><button class="btn btn-ghost" data-close-modal>Cancel</button><button class="btn btn-primary" id="save-btn">Submit Request</button></div>
  </div>
</div>
<script src="../../../assets/js/global.js"></script>
<script src="script.js"></script>
</body>
</html>
