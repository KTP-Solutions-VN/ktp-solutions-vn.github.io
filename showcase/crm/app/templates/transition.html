<!-- Hộp chuyển trạng thái theo blueprint. Dữ liệu: action, to, fields[{api,label}], needNote, bp -->
<div class="box">
  <div class="card-h"><h3>{{action}} → {{to}}</h3></div>
  <div class="card-b">
    {{#each fields}}<label class="fl">{{label}} *<input class="inp" id="mf-{{api}}"></label>{{/each}}
    {{#if needNote}}<label class="fl">{{t "det.noteReq"}} *<textarea class="inp" id="mnote"></textarea></label>{{/if}}
    <div class="faint sm">{{t "det.bpNote" bp=bp}}</div>
  </div>
  <div class="foot"><button class="btn" onclick="closeModal()">{{t "act.cancel"}}</button><button class="btn pri" id="mok">{{t "act.confirm"}}</button></div>
</div>
