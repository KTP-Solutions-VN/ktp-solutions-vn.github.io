<style>
  /* Sub-nav Cài đặt (giống hệt ở FM_38–41) */

  .set-nav a { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 8px; color: var(--fg); font: 500 13.5px var(--font-body); text-decoration: none !important; white-space: nowrap; transition: background-color var(--d-1) var(--ease-std), color var(--d-1) var(--ease-std); }
  .set-nav a .icon { color: var(--fg-muted); flex: none; }
  .set-nav a:hover { background: var(--surface-muted); }
  .set-nav a[aria-current] { background: var(--primary-soft); color: var(--side-active); font-weight: 600; }
  .set-nav a[aria-current] .icon { color: var(--side-active); }
  .set-main { display: flex; flex-direction: column; gap: var(--s-4); min-width: 0; }
  @media (max-width: 1100px) { .set-layout { grid-template-columns: 1fr; } .set-nav { position: static; flex-direction: row; flex-wrap: wrap; } .set-nav .set-g { display: none; } }

  .card-foot { padding: 8px 18px 16px; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--fg-muted); }
  .card-foot .icon { width: 15px; height: 15px; flex: none; }
  .tbl-wrap { border-radius: 0 0 var(--r-lg) var(--r-lg); overflow-x: auto; }

  .rt b { display: block; font-weight: 600; color: var(--fg-strong); font-size: 14px; }
  .rt small { display: block; font-size: 12.5px; color: var(--fg-muted); line-height: 18px; }
  .rt .val { display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
  .rt .val .input { width: 140px; }
  .locked { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: var(--r-md); background: var(--surface-muted); color: var(--fg); font-weight: 600; font-size: 13.5px; width: 140px; box-sizing: border-box; }
  .locked .icon { color: var(--fg-muted); width: 15px; height: 15px; }
  .rt.changed { background: var(--warning-soft); }
  .side { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: var(--s-4); align-items: stretch; }
  .facts { display: flex; flex-direction: column; gap: 4px; padding: 0 18px 8px; }
  .fact { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; font-size: 13.5px; }
  .fact span { color: var(--fg-muted); }
  .fact b { font-weight: 600; color: var(--fg-strong); text-align: right; font-variant-numeric: tabular-nums; }
  .savebar { display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 16px; margin: 4px 18px 16px; background: var(--fg-strong); color: #fff; border-radius: var(--r-lg); font-size: 13.5px; }
  .savebar .btn-secondary { background: transparent; color: #fff; border-color: rgba(255,255,255,.35); }
  /* Consent */

  .cs.main b { color: var(--side-active); }
  .cs span { font-size: 12.5px; color: var(--fg-muted); }
  .modal-head { display: flex; align-items: center; gap: 8px; }
  .modal-head h2 { font-size: 17px; }
  .modal-foot { display: flex; gap: 8px; justify-content: flex-end; }
  .chk { display: flex; align-items: flex-start; gap: 8px; font-size: 13.5px; }
  .chk input { accent-color: var(--primary); width: 16px; height: 16px; margin-top: 2px; }
  .act-b { white-space: nowrap; }
  @media (max-width: 1200px) { .side { grid-template-columns: 1fr; } }

<script>
const { icon, fmt, toast } = Shell;
Shell.mount({ active: 'FM_38', title: 'Quyền riêng tư & nhật ký' });
/* Sub-nav Cài đặt (giống hệt ở FM_38–41) */
function setNav(k) { document.querySelectorAll('.set-nav a').forEach(a => { if (!a.querySelector('.icon')) a.insertAdjacentHTML('afterbegin', Shell.icon(a.dataset.ic)); a.dataset.k === k ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'); }); }
setNav('privacy');

const LOC_OPTS = [6, 12, 24, 36];
let SAVED_LOC = 12;
// [tài xế, SĐT, trạng thái agree|withdrawn|pending, ngày, phiên bản, ghi chú]
const CONS = [
  ['Nguyễn Văn Tuấn', '0903 •••• 218', 'agree', '15/09/2026', 'v1.2'],
  ['Trần Minh Đức', '0918 •••• 402', 'agree', '15/09/2026', 'v1.2'],
  ['Lê Hoàng Phúc', '0937 •••• 651', 'agree', '16/09/2026', 'v1.2'],
  ['Võ Thành Nhân', '0909 •••• 117', 'agree', '16/09/2026', 'v1.2'],
  ['Đặng Quang Vinh', '0988 •••• 530', 'agree', '18/09/2026', 'v1.2'],
  ['Ngô Đức Trí', '0971 •••• 804', 'agree', '20/09/2026', 'v1.2'],
  ['Phan Thanh Tùng', '0932 •••• 276', 'withdrawn', '08/11/2026', 'v1.2', 'App ngừng gửi vị trí; mốc chuyến bấm tay, vị trí xe lấy từ GSHT'],
  ['Huỳnh Tấn Lộc', '0905 •••• 993', 'agree', '22/09/2026', 'v1.2'],
  ['Bùi Minh Khoa', '0912 •••• 045', 'agree', '02/10/2026', 'v1.2'],
  ['Trương Văn Lực', '0868 •••• 371', 'pending', 'Gửi 05/11/2026', 'v1.2', 'Chưa mở app từ khi được mời'],
  ['Đặng Văn Hiếu', '0396 •••• 728', 'pending', 'Gửi 30/10/2026', 'v1.2', 'GPLX hết hạn, chưa nhận chuyến'],
  ['Võ Thanh Sơn', '0947 •••• 160', 'agree', '25/09/2026', 'v1.1', 'Cần xác nhận lại theo điều khoản v1.2']
];
// [thời gian, người, vai trò, loại, đối tượng, chi tiết, IP]
const LOG = [
  ['12/11/2026 10:21', 'Nguyễn Thị Lan', 'Điều độ', 'view', 'CH-0458 · 51C-123.45', 'Xem vị trí trực tiếp trong chuyến', '113.161.42.18'],
  ['12/11/2026 09:47', 'Mai Hương', 'Kế toán', 'export', 'Báo cáo lãi/lỗ T10/2026', 'Xuất Excel 1.146 chuyến', '113.161.42.21'],
  ['12/11/2026 08:30', 'Hoàng Văn Hùng', 'Chủ DN / Admin', 'perm', 'Phạm Thu Trang', 'Mời với vai trò Kế toán · chi nhánh Hải Phòng', '14.232.88.4'],
  ['11/11/2026 17:05', 'Mai Hương', 'Kế toán', 'settle', 'CH-0431', 'Duyệt và khoá quyết toán · 8.420.000 đ', '113.161.42.21'],
  ['11/11/2026 16:52', 'Mai Hương', 'Kế toán', 'unlock', 'CH-0427', 'Sửa chi phí sau khoá: BOT 245.000 → 290.000 đ · lý do: thiếu vé trạm An Sương', '113.161.42.21'],
  ['11/11/2026 15:10', 'Trần Thanh Phong', 'QL đội xe', 'view', 'Phát lại hành trình 51C-456.78', 'Xem hành trình 28/10 (trong chuyến CH-0438)', '113.161.42.30'],
  ['10/11/2026 11:02', 'Hoàng Văn Hùng', 'Chủ DN / Admin', 'perm', 'Vai trò Điều độ', 'Tạm ứng: Xem → Sửa', '14.232.88.4'],
  ['10/11/2026 09:15', 'Nguyễn Thị Lan', 'Điều độ', 'export', 'Báo cáo tuân thủ T10/2026', 'Xuất mẫu nội bộ (Excel)', '113.161.42.18'],
  ['09/11/2026 14:40', 'Mai Hương', 'Kế toán', 'settle', 'CH-0424, CH-0425, CH-0426', 'Duyệt hàng loạt 3 quyết toán · 21.380.000 đ', '113.161.42.21'],
  ['08/11/2026 07:58', 'Phan Thanh Tùng', 'Tài xế', 'perm', 'Đồng ý dữ liệu vị trí', 'Rút đồng ý trên app tài xế', 'App · 4G']
];
const KIND = { view: ['Xem vị trí', 'b-info', 'eye'], unlock: ['Sửa sau khoá', 'b-warning', 'lock'], settle: ['Duyệt quyết toán', 'b-success', 'check'], export: ['Xuất dữ liệu', 'b-neutral', 'download'], perm: ['Thay đổi quyền', 'b-accent', 'shield'] };

let S;
function reset(o) { S = Object.assign({ tab: 'policy', loc: SAVED_LOC, cf: 'all', lk: 'all', loading: false, error: false, empty: false }, o || {}); }
const view = document.getElementById('view');

function render() {
  const T = [['policy', 'Chính sách lưu trữ', 'clock'], ['consent', 'Đồng ý của tài xế', 'users'], ['log', 'Nhật ký hệ thống', 'list']];
  document.getElementById('tabs').innerHTML = T.map(([k, l, ic]) => `<button role="tab" type="button" data-tab="${k}" aria-selected="${S.tab === k}">${icon(ic)}${l}</button>`).join('');
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; history.replaceState(null, '', '#' + (S.tab === 'policy' ? 'default' : S.tab)); render(); });
  const pa = document.getElementById('pageA'); pa.innerHTML = S.tab === 'log' && !S.loading && !S.error ? `<button class="btn btn-secondary" type="button" id="expLog">${icon('download')}Xuất nhật ký</button>` : '';
  const el = document.getElementById('expLog'); if (el) el.onclick = () => toast('Đang tạo file nhật ký… Việc xuất cũng được ghi vào nhật ký.');
  if (S.loading) { view.innerHTML = `<div class="card card-body">${Array(5).fill('<div style="display:flex;gap:14px;align-items:center;margin:10px 0"><span class="sk" style="width:36px;height:36px"></span><span style="flex:1"><span class="sk" style="width:40%"></span><span class="sk" style="width:70%;margin-top:6px"></span></span><span class="sk" style="width:140px;height:34px"></span></div>').join('')}</div>`; return; }
  if (S.error) { view.innerHTML = `<div class="alert alert-danger" role="alert">${icon('block')}<div>Không tải được cài đặt quyền riêng tư. Thử lại sau ít phút.</div><div class="alert-actions"><button class="btn btn-secondary btn-sm" type="button" id="retry">${icon('refresh')}Thử lại</button></div></div>`; document.getElementById('retry').onclick = () => { S.error = false; render(); }; return; }
  view.innerHTML = S.tab === 'policy' ? policyHtml() : S.tab === 'consent' ? consentHtml() : logHtml();
  bind();
}
function policyHtml() {
  const ch = S.loc !== SAVED_LOC;
  const lockRow = (ic, t, d) => `<div class="rt"><span class="ic">${icon(ic)}</span><span><b>${t}</b><small>${d}</small></span><span class="val"><span class="badge b-neutral" title="Thời hạn theo quy định, không chỉnh được">Bắt buộc</span><span class="locked">${icon('lock')}3 năm</span></span></div>`;
  return `<div class="side"><section class="card" aria-label="Thời hạn lưu dữ liệu">
    <div class="card-title"><h2>Thời hạn lưu dữ liệu</h2><span class="meta">Áp dụng cho cả 3 chi nhánh</span></div>
    <div class="ret">
      <div class="rt ${ch ? 'changed' : ''}"><span class="ic">${icon('pin')}</span><span><b>Vị trí & hành trình xe</b><small>Từ GSHT và app tài xế, chỉ ghi trong lúc chạy chuyến. Dùng cho phát lại hành trình, km rỗng, tốc độ. Mặc định 12 tháng.</small></span>
        <span class="val"><select class="input" id="locSel" aria-label="Thời hạn lưu vị trí">${LOC_OPTS.map(m => `<option value="${m}" ${m === S.loc ? 'selected' : ''}>${m} tháng</option>`).join('')}</select></span></div>
      ${lockRow('shield', 'Hồ sơ an toàn', 'Giờ lái, vi phạm tốc độ, nhật ký xử lý vi phạm.')}
      ${lockRow('qr', 'Giấy vận tải', 'Giấy vận tải điện tử đã phát hành, kể cả bản đã thu hồi.')}
    </div>
    ${ch ? `<div class="savebar" role="status">${icon('warn')}<span>${S.loc < SAVED_LOC ? `Vị trí cũ hơn ${S.loc} tháng sẽ bị xoá vĩnh viễn.` : `Giữ vị trí lâu hơn, dung lượng lưu trữ tăng.`}</span><span style="flex:1"></span><button class="btn btn-secondary btn-sm" type="button" id="undoLoc">Bỏ thay đổi</button><button class="btn btn-primary btn-sm" type="button" id="saveLoc">Lưu</button></div>` : ''}
    <div class="card-foot" style="margin-top:auto">${icon('info')}<span>Dữ liệu quá hạn được xoá tự động lúc 00:00 ngày 1 hằng tháng. Ảnh chứng từ chi phí lưu theo chứng từ kế toán.</span></div>
  </section>
  <section class="card" aria-label="Tình trạng lưu trữ">
    <div class="card-title"><h2>Tình trạng</h2></div>
    <div class="facts"><div class="fact"><span>Vị trí cũ nhất đang lưu</span><b>12/11/2025</b></div><div class="fact"><span>Lần xoá gần nhất</span><b>01/11/2026</b></div><div class="fact"><span>Đã xoá lần đó</span><b>1,8 triệu điểm vị trí</b></div><div class="fact"><span>Lần xoá kế tiếp</span><b>01/12/2026</b></div><div class="fact"><span>Hồ sơ an toàn cũ nhất</span><b>15/09/2026</b></div></div>
    <div class="card-foot" style="margin-top:auto">${icon('lock')}<span>Chỉ Chủ DN / Admin đổi được thời hạn. Mỗi lần đổi được ghi nhật ký.</span></div>
  </section></div>`;
}
function consentHtml() {
  const n = k => CONS.filter(c => c[2] === k).length, rs = CONS.filter(c => S.cf === 'all' || c[2] === S.cf);
  const B = { agree: `<span class="badge b-success">${icon('check')}Đã đồng ý</span>`, withdrawn: `<span class="badge b-warning">${icon('x')}Đã rút đồng ý</span>`, pending: `<span class="badge b-neutral">${icon('clock')}Chưa phản hồi</span>` };
  return `<section class="card" aria-label="Đồng ý xử lý dữ liệu vị trí">
    <div class="card-title"><h2>Đồng ý xử lý dữ liệu vị trí</h2><span class="meta">Tài xế đồng ý hoặc rút đồng ý trên app tài xế</span></div>
    <div class="cstrip"><div class="cs main"><b>${n('agree')}/${CONS.length}</b><span>tài xế đã đồng ý</span></div><div class="cs"><b>${n('withdrawn')}</b><span>đã rút đồng ý</span></div><div class="cs"><b>${n('pending')}</b><span>chưa phản hồi</span></div>
      <div style="margin-left:auto;align-self:center"><div class="seg" role="group" aria-label="Lọc trạng thái" id="cfSeg">${[['all', 'Tất cả'], ['agree', 'Đã đồng ý'], ['withdrawn', 'Đã rút'], ['pending', 'Chưa phản hồi']].map(([k, l]) => `<button type="button" data-cf="${k}" aria-pressed="${S.cf === k}">${l}</button>`).join('')}</div></div></div>
    <div class="tbl-wrap"><table class="grid"><thead><tr><th>Tài xế</th><th>Trạng thái</th><th>Ngày</th><th>Điều khoản</th><th>Ghi chú</th><th><span class="sr-only">Hành động</span></th></tr></thead>
      <tbody>${rs.map(c => `<tr><td><a href="fm-17-chi-tiet-tai-xe.html" style="font-weight:600">${c[0]}</a><span class="cell-sub">${c[1]}</span></td><td>${B[c[2]]}</td><td>${c[3]}</td><td>${c[4] === 'v1.2' ? 'v1.2' : `<span style="color:var(--warning-fg);font-weight:600">${c[4]}</span>`}</td>
        <td class="muted" style="white-space:normal;max-width:340px">${c[5] || '—'}</td><td style="text-align:right">${c[2] === 'pending' || c[4] !== 'v1.2' ? `<button class="btn btn-ghost btn-sm" type="button" data-resend="${c[0]}">Gửi lại yêu cầu</button>` : ''}</td></tr>`).join('')}</tbody></table></div>
    <div class="card-foot">${icon('info')}<span>Tài xế rút đồng ý vẫn chạy chuyến được: app không gửi vị trí, mốc bấm tay. Nội dung điều khoản v1.2 xem tại app tài xế.</span></div>
  </section>`;
}
function logHtml() {
  const rs = S.empty ? [] : LOG.filter(l => S.lk === 'all' || l[3] === S.lk);
  return `<div class="filterbar" role="toolbar" aria-label="Lọc nhật ký"><button class="chip on" type="button">7 ngày gần nhất ${icon('chevron')}</button><button class="chip" type="button">Người thực hiện ${icon('chevron')}</button>
      <div class="seg" role="group" aria-label="Loại hành động">${[['all', 'Tất cả']].concat(Object.entries(KIND).map(([k, v]) => [k, v[0]])).map(([k, l]) => `<button type="button" data-lk="${k}" aria-pressed="${S.lk === k}">${l}</button>`).join('')}</div></div>
    <section class="card" aria-label="Nhật ký hệ thống">
    ${rs.length ? `<div class="tbl-wrap" style="border-radius:var(--r-lg)"><table class="grid"><thead><tr><th>Thời gian · nguồn</th><th>Người thực hiện</th><th>Hành động</th><th>Đối tượng</th><th>Chi tiết</th></tr></thead>
      <tbody>${rs.map(l => { const k = KIND[l[3]]; return `<tr><td>${l[0]}<span class="cell-sub code">${l[6]}</span></td><td><b style="font-weight:600">${l[1]}</b><span class="cell-sub">${l[2]}</span></td><td class="act-b"><span class="badge ${k[1]}">${icon(k[2])}${k[0]}</span></td><td style="white-space:normal;min-width:150px">${/^CH-/.test(l[4]) ? `<a class="code" href="fm-09-chi-tiet-chuyen.html">${l[4]}</a>` : l[4]}</td><td style="white-space:normal">${l[5]}</td></tr>`; }).join('')}</tbody></table></div>`
      : `<div class="empty">${icon('list')}<h3>Không có hoạt động nào khớp bộ lọc</h3><p>Thử mở rộng khoảng thời gian hoặc chọn "Tất cả".</p><button class="btn btn-secondary" type="button" id="clrLog">Xoá lọc</button></div>`}
    </section>
    <div class="card-foot" style="padding:0 2px">${icon('lock')}<span>Nhật ký chỉ ghi thêm, không ai sửa hay xoá được, kể cả Chủ DN / Admin.</span></div>`;
}
function bind() {
  const ls = document.getElementById('locSel'); if (ls) ls.onchange = () => { S.loc = +ls.value; render(); };
  const u = document.getElementById('undoLoc'); if (u) u.onclick = () => { S.loc = SAVED_LOC; render(); };
  const sv = document.getElementById('saveLoc'); if (sv) sv.onclick = () => S.loc < SAVED_LOC ? confirmReduce() : doSave();
  view.querySelectorAll('[data-cf]').forEach(b => b.onclick = () => { S.cf = b.dataset.cf; render(); });
  view.querySelectorAll('[data-resend]').forEach(b => b.onclick = () => toast(`Đã gửi lại yêu cầu đồng ý tới ${b.dataset.resend} qua app và SMS`));
  view.querySelectorAll('[data-lk]').forEach(b => b.onclick = () => { S.lk = b.dataset.lk; render(); });
  const cl = document.getElementById('clrLog'); if (cl) cl.onclick = () => { S.lk = 'all'; S.empty = false; render(); };
}
function doSave() { const prev = SAVED_LOC; SAVED_LOC = S.loc; render(); toast(`Đã lưu: giữ vị trí ${S.loc} tháng · ghi nhật ký`, { undo: () => { SAVED_LOC = prev; S.loc = prev; render(); } }); }
function confirmReduce() {
  closeModal(true);
  const s = document.createElement('div'); s.className = 'scrim modal-scrim'; s.id = 'mScrim';
  const m = document.createElement('div'); m.className = 'modal'; m.id = 'modal'; m.setAttribute('role', 'alertdialog'); m.setAttribute('aria-modal', 'true'); m.setAttribute('aria-labelledby', 'mT');
  m.innerHTML = `<div class="modal-head">${icon('warn')}<h2 id="mT">Rút thời hạn lưu vị trí còn ${S.loc} tháng?</h2></div>
    <p class="muted">Lúc 00:00 ngày 01/12/2026, vị trí và hành trình trước <b style="color:var(--fg-strong)">01/${S.loc === 6 ? '06' : '12'}/2026</b> sẽ bị xoá vĩnh viễn (khoảng ${S.loc === 6 ? '9,6' : '0'} triệu điểm). Không khôi phục được. Phát lại hành trình và báo cáo km rỗng của kỳ đó sẽ không còn.</p>
    <p class="muted">Hồ sơ an toàn và giấy vận tải vẫn giữ 3 năm.</p>
    <label class="chk"><input type="checkbox" id="ack">Tôi hiểu dữ liệu bị xoá không khôi phục được</label>
    <div class="modal-foot"><button class="btn btn-secondary" type="button" id="mC">Huỷ</button><button class="btn btn-danger" type="button" id="mOk" disabled>Rút còn ${S.loc} tháng</button></div>`;
  document.body.append(s, m);
  s.onclick = m.querySelector('#mC').onclick = () => closeModal();
  m.querySelector('#ack').onchange = e => { m.querySelector('#mOk').disabled = !e.target.checked; };
  m.querySelector('#mOk').onclick = () => { closeModal(); doSave(); };
}
function closeModal(now) { ['modal', 'mScrim'].forEach(id => { const e = document.getElementById(id); if (e) { e.id = ''; now ? e.remove() : Shell.dismiss(e); } }); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

Shell.states([['default', 'Chính sách lưu trữ'], ['consent', 'Đồng ý của tài xế'], ['log', 'Nhật ký hệ thống'], ['confirm', 'Xác nhận rút thời hạn'], ['loading', 'Đang tải'], ['empty', 'Nhật ký trống'], ['error', 'Lỗi']], s => {
  closeModal(true); SAVED_LOC = 12;
  reset({ consent: { tab: 'consent' }, log: { tab: 'log' }, confirm: { loc: 6 }, empty: { tab: 'log', empty: true, lk: 'unlock' }, loading: { loading: true }, error: { error: true } }[s]); render();
  if (s === 'confirm') confirmReduce();
});
</script>
</body>
