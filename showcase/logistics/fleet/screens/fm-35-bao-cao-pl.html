<style>

  .delta .icon { width: 13px; height: 13px; }
  .spark { display: block; margin-top: 4px; }
  .card-title { display: flex; align-items: center; gap: 10px; padding: 16px 18px 6px; }
  .card-title h2 { font-size: 16px; }
  .card-title .meta { margin-left: auto; font-size: 12.5px; color: var(--fg-muted); display: inline-flex; gap: 10px; align-items: center; text-align: right; }
  .chart-legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--fg-muted); padding: 0 18px 14px; }
  .chart-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; box-sizing: border-box; }
  .foot-note { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--fg-muted); padding: 0 2px; }
  .foot-note .icon { width: 15px; height: 15px; flex: none; }
  @media (max-width: 1200px) { .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); } .sum-main { grid-column: 1 / -1; } }
  .dimsel { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--fg-muted); }
  .dimsel select { height: 30px; font-weight: 500; }
  .chart-card svg { display: block; width: 100%; height: auto; }
  .chart-card .bar { cursor: pointer; }
  .chart-card .bar:hover rect.b, .chart-card .bar:focus rect.b { opacity: .8; }

  .chart-wrap { padding: 4px 18px 8px; }

<div id="app-content">
  <div class="page-header">

    <div class="seg" role="group" aria-label="Chế độ lãi" style="margin-left:auto"><button type="button" data-mode="gross" aria-pressed="true">Lãi gộp</button><button type="button" data-mode="alloc" aria-pressed="false">Lãi sau phân bổ</button></div>
  </div>

<script src="../assets/js/shell.js"></script>

<script>
const { icon, fmt, toast } = Shell;
Shell.mount({ active: 'FM_35', title: 'Lãi/lỗ' });
const V = n => fmt.vnd(n, { bare: 1 });
const NA = 'href="javascript:void(0)" title="chưa có trong prototype"';
document.querySelectorAll('.ic-chev').forEach(e => e.outerHTML = icon('chevron'));
document.getElementById('xlsBtn').innerHTML = icon('download') + 'Xuất Excel';
document.getElementById('refresh').innerHTML = icon('refresh') + 'Làm mới';
document.getElementById('refresh').onclick = () => toast('Đã làm mới số liệu');
document.getElementById('defBadge').innerHTML = icon('info') + `Đang dùng giá trị mặc định — <a ${NA} style="color:inherit;text-decoration:underline">Cập nhật</a>`;

/* ---------- Floating tooltip ---------- */
const TIPS = {}; let tipN = 0;
const tip = html => { const k = 't' + (tipN++); TIPS[k] = html; return `data-ftip="${k}"`; };
const ftip = document.createElement('div'); ftip.className = 'tip-body'; ftip.setAttribute('role', 'tooltip');
Object.assign(ftip.style, { position: 'fixed', transform: 'none', bottom: 'auto', zIndex: 100 }); document.body.appendChild(ftip);
function showTip(el) { const h = TIPS[el.dataset.ftip]; if (!h) return; ftip.innerHTML = h; ftip.style.opacity = 1; const r = el.getBoundingClientRect(), w = ftip.offsetWidth, ht = ftip.offsetHeight; ftip.style.left = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), innerWidth - w - 8) + 'px'; let y = r.top - ht - 8; if (y < 8) y = r.bottom + 8; ftip.style.top = y + 'px'; }
const hideTip = () => { ftip.style.opacity = 0; };
document.addEventListener('mouseover', e => { const el = e.target.closest('[data-ftip]'); el ? showTip(el) : hideTip(); });
document.addEventListener('focusin', e => { const el = e.target.closest('[data-ftip]'); el ? showTip(el) : hideTip(); });
document.addEventListener('scroll', hideTip, true);
document.getElementById('defBadge').setAttribute('data-ftip', 'def'); TIPS.def = 'Chi phí cố định/km, khấu hao/ngày của 14 xe chưa được chỉnh. Lãi sau phân bổ có thể chưa sát thực tế.';

/* ---------- Dữ liệu (đ). Tháng 10/2026, chi nhánh TP.HCM ---------- */
const M = 1e6, R5 = v => Math.round(v / 1e5) * 1e5;
function mk(name, trips, rev, g, n, extra) {
  const Rd = rev >= 1e8 ? R5 : v => Math.round(v / 1e3) * 1e3;
  const vc = rev - g, fuel = Rd(vc * .42), toll = Rd(vc * .08), lift = Rd(vc * .19), sal = Rd(vc * .24), oth = vc - fuel - toll - lift - sal;
  const al = g - n, dep = Rd(al * .45);
  return Object.assign({ name, trips, rev, g, n, vc, fuel, toll, lift, sal, oth, dep, fix: al - dep }, extra || {});
}
const TOT = { trips: 1146, rev: 4820 * M, g: 1210 * M, n: 168 * M };
// rows: [name, trips, revPerTripM, grossMargin, netMargin, extra]; dòng cuối nhận phần còn lại để tổng khớp
function gen(rows, tot) {
  tot = tot || TOT; const out = []; let st = 0, sr = 0, sg = 0, sn = 0;
  rows.forEach((r, i) => {
    if (i < rows.length - 1) { const rev = R5(r[1] * r[2] * M), g = R5(rev * r[3]), n = R5(rev * r[4]); st += r[1]; sr += rev; sg += g; sn += n; out.push(mk(r[0], r[1], rev, g, n, r[5])); }
    else out.push(mk(r[0], tot.trips - st, tot.rev - sr, tot.g - sg, tot.n - sn, r[5]));
  });
  return out;
}
const CUST = [
  mk('Tân Cảng Logistics', 312, 1452.6 * M, 362.4 * M, 58.1 * M, { sub: '41 chuyến ghép · đã phân bổ theo khối lượng × km', alloc: 1, prov: 12 }),
  mk('Gỗ Minh Long', 168, 712.4 * M, 178.1 * M, 24.2 * M, { prov: 6 }),
  mk('Bao bì Tân Phú', 186, 702.3 * M, 196.6 * M, 52.7 * M, { prov: 5, sub: '9 chuyến ghép · đã phân bổ theo khối lượng × km', alloc: 1 }),
  mk('Thép Hòa Phát Bình Dương', 142, 598.3 * M, 155.6 * M, 19.8 * M, { prov: 4 }),
  mk('Thủy sản Vĩnh Hoàn', 104, 512.8 * M, 131.9 * M, 9.6 * M, { prov: 4 }),
  mk('Nhựa Đông Á', 94, 388.0 * M, 64.8 * M, -11.6 * M, { prov: 3 }),
  mk('Bao bì Phương Nam', 78, 248.6 * M, 63.4 * M, 8.1 * M, { prov: 2, sub: '22 chuyến ghép · đã phân bổ theo khối lượng × km', alloc: 1 }),
  mk('Nhựa Duy Tân', 62, 205.0 * M, 57.2 * M, 7.1 * M, { prov: 2, sub: '14 chuyến ghép · đã phân bổ theo khối lượng × km', alloc: 1 })
];
const DIMS = {
  branch: { label: 'Chi nhánh', col: 'Chi nhánh', rows: [mk('TP.HCM', TOT.trips, TOT.rev, TOT.g, TOT.n, { sub: '38 chuyến tạm tính' })] },
  customer: { label: 'Khách hàng', col: 'Khách hàng', rows: CUST, price: 1 },
  route: { label: 'Tuyến', col: 'Tuyến', price: 1, rows: gen([['KCN Tân Uyên → Cát Lái', 232, 4.95, .262, .047], ['Cát Lái → KCN VSIP 1', 186, 4.4, .268, .049], ['KCN Mỹ Phước 3 → Cát Lái', 168, 4.3, .25, .034], ['KCN Đồng An → Cát Lái', 142, 4.2, .26, .033], ['Cát Lái → Sa Đéc', 104, 4.93, .257, .019], ['ICD Phước Long → KCN Phước Đông', 66, 4.6, .212, .011], ['Tuyến khác (23 tuyến)', 0, 0, 0, 0]]) },
  vehicle: { label: 'Xe', col: 'Xe', rows: gen([['51C-123.45', 46, 4.85, .262, .041, { sub: 'Đầu kéo · Nguyễn Văn Tuấn' }], ['51D-456.78', 44, 4.7, .255, .038, { sub: 'Đầu kéo · Trần Minh Đức' }], ['51C-456.78', 43, 4.6, .231, .012, { sub: 'Đầu kéo · Đặng Quang Vinh' }], ['61C-220.14', 41, 5.1, .248, .03, { sub: 'Đầu kéo · Võ Thành Nhân' }], ['51C-731.80', 40, 4.5, .259, .036, { sub: 'Đầu kéo · Ngô Đức Trí' }], ['51D-702.33', 52, 2.3, .29, .061, { sub: 'Xe tải thùng · Lê Hoàng Phúc' }], ['51C-588.02', 48, 2.4, .28, .052, { sub: 'Xe tải thùng · Huỳnh Tấn Lộc' }], ['19 xe khác', 0, 0, 0, 0, { sub: 'Đầu kéo và xe tải' }]]) },
  driver: { label: 'Tài xế', col: 'Tài xế', rows: gen([['Nguyễn Văn Tuấn', 46, 4.85, .262, .041, { sub: '51C-123.45' }], ['Trần Minh Đức', 44, 4.7, .255, .038, { sub: '51D-456.78' }], ['Đặng Quang Vinh', 43, 4.6, .231, .012, { sub: '51C-456.78' }], ['Võ Thành Nhân', 41, 5.1, .248, .03, { sub: '61C-220.14' }], ['Ngô Đức Trí', 40, 4.5, .259, .036, { sub: '51C-731.80' }], ['Lê Hoàng Phúc', 52, 2.3, .29, .061, { sub: '51D-702.33' }], ['Huỳnh Tấn Lộc', 48, 2.4, .28, .052, { sub: '51C-588.02' }], ['21 tài xế khác', 0, 0, 0, 0, { sub: 'Nhiều xe' }]]) },
  period: { label: 'Kỳ', col: 'Kỳ', rows: gen([['Tuần 01–04/10', 152, 4.18, .255, .04, { sub: '4 ngày' }], ['Tuần 05–11/10', 268, 4.2, .252, .037], ['Tuần 12–18/10', 262, 4.22, .25, .033], ['Tuần 19–25/10', 259, 4.21, .249, .032], ['Tuần 26–31/10', 0, 0, 0, 0, { sub: '6 ngày' }]]) },
  trip: { label: 'Chuyến', col: 'Chuyến', rows: null }
};
const HP = mk('Hải Phòng', 512, 2140 * M, 498.6 * M, 61.2 * M, { sub: '21 chuyến tạm tính' });
// Tuyến của từng khách (cấp 2)
const CROUTES = {
  'Tân Cảng Logistics': [mk('KCN Tân Uyên → Cát Lái', 128, 652.8 * M, 171.0 * M, 30.4 * M, { alloc: 1 }), mk('Cát Lái → KCN VSIP 1', 96, 441.6 * M, 118.3 * M, 21.6 * M), mk('ICD Phước Long → KCN Phước Đông', 54, 248.4 * M, 52.6 * M, 4.3 * M, { alloc: 1 }), mk('Cát Lái → KCN Mỹ Phước 3', 34, 109.8 * M, 20.5 * M, 1.8 * M)],
  'Gỗ Minh Long': ['KCN Mỹ Phước 3 → Cát Lái', 'Cát Lái → KCN Mỹ Phước 3'], 'Bao bì Tân Phú': ['KCN Tân Phú Trung → Cát Lái', 'KCN Tân Phú Trung → Long An'],
  'Thép Hòa Phát Bình Dương': ['KCN Đồng An → Cát Lái', 'KCN Đồng An → ICD Sóng Thần'], 'Thủy sản Vĩnh Hoàn': ['Cát Lái → Sa Đéc', 'Sa Đéc → Cát Lái'],
  'Nhựa Đông Á': ['KCN Vĩnh Lộc → Cát Lái', 'KCN Vĩnh Lộc → Bình Dương'], 'Bao bì Phương Nam': ['KCN Sóng Thần → Long An', 'KCN Sóng Thần → Bến Lức'], 'Nhựa Duy Tân': ['Bình Tân → Mỹ Tho', 'Bình Tân → Cần Thơ']
};
function routesOf(r) {
  const x = CROUTES[r.name]; if (x && typeof x[0] !== 'string') return x;
  const names = x || ['Tuyến chính', 'Tuyến khác']; const t1 = Math.round(r.trips * .65), rv = R5(r.rev * .65), g = R5(r.g * .67), n = R5(r.n * .7);
  return [mk(names[0], t1, rv, g, n), mk(names[1], r.trips - t1, r.rev - rv, r.g - g, r.n - n)];
}
const PAIRS = [['51C-123.45', 'Nguyễn Văn Tuấn'], ['51D-456.78', 'Trần Minh Đức'], ['51C-731.80', 'Ngô Đức Trí'], ['61C-220.14', 'Võ Thành Nhân'], ['51C-456.78', 'Đặng Quang Vinh'], ['51C-334.21', 'Võ Thanh Sơn']];
function tripsOf(r, seed) {
  const avg = r.rev / r.trips, gm = r.g / r.rev, nm = r.n / r.rev, out = [];
  const pairs = r.sub && /^\d{2}[A-Z]-/.test(r.name) ? [[r.name, r.sub.split(' · ')[1]]] : r.sub && /^\d{2}[A-Z]-/.test(r.sub) ? [[r.sub, r.name]] : PAIRS;
  for (let i = 0; i < Math.min(6, r.trips); i++) {
    const k = (seed + i * 7) % 11, rev = R5(avg * (0.9 + k * .02)), gmi = gm + (k - 5) * .012, nmi = nm + (k - 5) * .012;
    const p = pairs[(seed + i) % pairs.length], day = 31 - ((seed + i * 3) % 30);
    out.push(mk('CH-' + (380 - ((seed * 13 + i * 9) % 160)).toString().padStart(4, '0'), 1, rev, Math.round(rev * gmi / 1e3) * 1e3, Math.round(rev * nmi / 1e3) * 1e3, { trip: 1, sub: `${String(day).padStart(2, '0')}/10`, drv: p[0] + ' · ' + p[1], alloc: r.alloc && i % 3 === 1, prov: i === 0 && day > 26 }));
  }
  return out;
}

/* ---------- State ---------- */
let S;
function reset(o) { S = Object.assign({ dim: 'customer', dim2: 'route', mode: 'gross', branch: 'hcm', open: new Set(), sort: null, low: false, only: null, loading: false, empty: false, error: false }, o || {}); }
try { const m = localStorage.getItem('fm.plMode'); } catch (e) {}
const marg = (r, mode) => (mode === 'alloc' ? r.n : r.g) / r.rev * 100;

const exp = kind => toast(`Đang tạo file ${kind} (${fmt.vnd(totals().trips, { bare: 1 })} chuyến)…`);
document.getElementById('xlsBtn').onclick = () => exp('Excel'); document.getElementById('pdfBtn').onclick = () => exp('PDF');

/* ---------- Prototype states ---------- */
Shell.states([['default', 'Mặc định'], ['alloc', 'Lãi sau phân bổ'], ['drill', 'Mở xuống 2 cấp'], ['vehicle', 'Theo xe'], ['allbranch', 'Tất cả chi nhánh'], ['loading', 'Đang tải'], ['empty', 'Trống'], ['error', 'Lỗi'], ['export', 'Đang xuất']], s => {
  const o = { alloc: { mode: 'alloc' }, drill: { open: new Set(['Tân Cảng Logistics', 'Tân Cảng Logistics|KCN Tân Uyên → Cát Lái']) }, vehicle: { dim: 'vehicle' }, allbranch: { dim: 'branch', branch: 'all' }, loading: { loading: true }, empty: { empty: true }, error: { error: true } }[s];
  reset(o); render();
  if (s === 'export') exp('Excel');
});
</script>
