<style>

  .list-card .grid td, .list-card .grid th { padding-left: 10px; padding-right: 10px; }
  .list-foot { display: flex; align-items: center; gap: 6px; padding: 10px 16px 12px; font-size: 12.5px; color: var(--fg-muted); margin-top: auto; }

  .pv { display: flex; flex-direction: column; min-width: 0; position: sticky; top: calc(var(--header-h) + 16px); max-height: calc(100vh - var(--header-h) - 32px); }

  .pv-body { overflow-y: auto; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 14px; }
  .pv-actions { display: flex; gap: 8px; align-items: center; padding: 2px 16px 12px; flex-wrap: wrap; }
  .pv-actions .sp { flex: 1; }
  .paper-bg { background: var(--surface-muted); border-radius: 8px; padding: 14px; }
  .paper { background: var(--surface); border-radius: 6px; box-shadow: var(--shadow-card); padding: 18px 20px 16px; font-size: 13px; line-height: 18px; position: relative; }
  .paper.void::after { content: "ĐÃ HUỶ"; position: absolute; top: 42%; left: 50%; transform: translate(-50%, -50%) rotate(-14deg); font: 700 44px/1 var(--font-display); color: var(--danger-solid); opacity: .16; letter-spacing: .1em; pointer-events: none; }
  .paper-top { display: grid; grid-template-columns: minmax(0, 1fr) 92px; gap: 14px; align-items: start; }
  .paper .org { font-size: 11.5px; color: var(--fg-muted); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
  .paper h3 { font: 700 17px/22px var(--font-display); letter-spacing: .04em; margin-top: 4px; }
  .paper .no { font-size: 12.5px; color: var(--fg-muted); margin-top: 2px; }
  .qr { width: 92px; height: 92px; display: block; }
  .qr-cap { font-size: 10.5px; color: var(--fg-muted); text-align: center; margin-top: 2px; line-height: 13px; }
  .qr-wrap.draft .qr { opacity: .18; }
  .qr-wrap { position: relative; }
  .qr-wrap .qr-over { position: absolute; inset: 0 0 16px; display: grid; place-items: center; font-size: 11px; font-weight: 600; color: var(--fg-muted); text-align: center; line-height: 14px; }
  .pf { display: grid; grid-template-columns: 20px 132px minmax(0, 1fr); gap: 2px 6px; margin: 14px 0 0; }
  .pf > div { display: contents; }
  .pf dt { color: var(--fg-muted); }
  .pf .n { color: var(--fg-subtle); font-variant-numeric: tabular-nums; }
  .pf dd { margin: 0 0 6px; color: var(--fg-strong); min-width: 0; }
  .pf dd.miss { color: var(--danger-fg); font-weight: 500; }
  .wconf { margin-top: 10px; padding: 10px 12px; border-radius: 6px; background: var(--surface-muted); display: grid; grid-template-columns: minmax(0, 1fr) 120px; gap: 10px; align-items: center; }
  .wconf .t { font-size: 11.5px; color: var(--fg-muted); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
  .wconf b { font-variant-numeric: tabular-nums; }
  .sig { width: 120px; height: 46px; display: block; background: var(--surface); border-radius: 4px; }
  .paper-foot { margin-top: 12px; font-size: 11.5px; color: var(--fg-muted); display: flex; gap: 6px; align-items: center; }
  .hist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; font-size: 12.5px; }
  .hist li { display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 8px; padding: 4px 6px; border-radius: 6px; }
  .hist li:hover { background: var(--surface-muted); }
  .hist .when { color: var(--fg-muted); font-variant-numeric: tabular-nums; }
  .open-note { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 8px; background: var(--warning-soft); color: var(--warning-fg); font-size: 12.5px; line-height: 17px; }
  .open-note .badge { background: var(--surface); color: var(--warning-fg); flex: none; }
  @media (max-width: 1280px) { .md { grid-template-columns: 1fr; } .pv { position: static; max-height: none; } }
  .empty .btn .icon { width: 16px; height: 16px; stroke-width: 1.75; color: inherit; }
  .empty p { max-width: 560px; }
</style>

<body>
<div id="app-content">

      <div class="crumb">Vận hành / Giấy vận tải</div>
      <h1>Giấy vận tải điện tử</h1>

    <span class="select-wrap"><select class="select" id="fDate" aria-label="Ngày phát hành"><option>Hôm nay · 12/11/2026</option><option>7 ngày qua</option><option>Tháng 11/2026</option><option>Tra cứu lưu trữ (3 năm)</option></select><span id="icChev"></span></span>

<script>
const { icon, fmt, toast } = Shell;
Shell.mount({ active: 'FM_11', title: 'Giấy vận tải' });
const $ = id => document.getElementById(id);
$('icLock').outerHTML = icon('lock'); $('icChev').outerHTML = icon('chevron'); $('icSearch').outerHTML = icon('search');
$('btnExport').insertAdjacentHTML('afterbegin', icon('download'));
$('btnBulk').insertAdjacentHTML('afterbegin', icon('qr'));

const ORG = 'Công ty TNHH Vận tải Phát Đạt';
/* st: draft | blocked | issued | cancelled ; w: confirmed | waiting */
const TPL = [
  { id: 'GVT-2611-0458', trip: 'CH-0458', orders: ['DH-1125'], st: 'issued', at: '12/11 06:52', w: 'confirmed', wAt: '12/11 07:41', wBy: 'Thủ kho Phạm Thị Hạnh (KCN Tân Uyên)', wHow: 'Ký trên app tài xế', wVal: 24.5,
    hirer: 'Tân Cảng Logistics', recv: 'Cảng Cát Lái · Tân Cảng Sài Gòn', contract: 'HĐ 15/2026/HĐVC-TCL · 02/01/2026', cargo: "Container 40' hàng khô · TCLU 4421087", tons: 24.5,
    hist: [['12/11 07:41', 'Thủ kho Phạm Thị Hạnh ký xác nhận 24,5 tấn trên app tài xế'], ['12/11 06:58', 'Nguyễn Văn Tuấn mở giấy trên app (DR_10)'], ['12/11 06:52', 'Lê Văn Hải phát hành'], ['11/11 16:20', 'Hệ thống tạo nháp khi gán xe, tài xế']] },
  { id: 'GVT-2611-0462', trip: 'CH-0462', orders: ['DH-1126'], st: 'draft', at: null, w: 'waiting',
    hirer: 'Gỗ Minh Long', recv: 'Cảng Cát Lái · Tân Cảng Sài Gòn', contract: 'HĐ 08/2026/HĐVC-GML · 15/03/2026', cargo: "Container 40' gỗ ván ép · MSKU 7731045", tons: 22.0,
    hist: [['12/11 05:41', 'Trần Minh Đức nhận chuyến'], ['11/11 17:05', 'Lê Văn Hải gán xe, chọn "Chỉ gán, phát hành sau"']] },
  { id: 'GVT-2611-0463', trip: 'CH-0463', orders: ['DH-1127', 'DH-1133'], st: 'issued', at: '12/11 06:40', w: 'confirmed', wAt: '12/11 07:22', wBy: 'Kho Bao bì Phương Nam (Sóng Thần)', wHow: 'Ảnh phiếu xuất kho', wVal: 7.5, multi: true,
    hirer: 'Bao bì Phương Nam', recv: 'Kho khách hàng tại Long An (2 điểm giao)', contract: 'HĐ 21/2026/HĐVC-PN · 10/02/2026', cargo: 'Bao bì carton · 32 kiện (2 đơn ghép)', tons: 7.5,

  { id: 'GVT-2611-0464', trip: 'CH-0464', orders: ['DH-1128'], st: 'blocked', at: null, w: 'waiting', block: 'Rơ-moóc 51R-088.12 bảo hiểm quá hạn 28/10/2026',
    hirer: 'Thủy sản Vĩnh Hoàn', recv: 'Nhà máy Vĩnh Hoàn · KCN Sa Đéc', contract: 'HĐ 03/2026/HĐVC-VH · 05/01/2026', cargo: "Container 40' lạnh · SEGU 9012334", tons: 26.0,
    hist: [['12/11 06:58', 'Lê Văn Hải gán xe, tài xế · phát hành bị chặn']] },
  { id: 'GVT-2611-0459', trip: 'CH-0459', orders: ['DH-1129'], st: 'issued', at: '12/11 07:30', w: 'confirmed', wAt: '12/11 08:44', wBy: 'Gỗ Minh Long · Tổ đóng hàng', wHow: 'Ảnh phiếu cân', wVal: 22.0,
    hirer: 'Gỗ Minh Long', recv: 'Cảng Cát Lái · Tân Cảng Sài Gòn', contract: 'HĐ 08/2026/HĐVC-GML · 15/03/2026', cargo: "Container 40' gỗ ván ép · MSKU 7731052", tons: 22.0,
    hist: [['12/11 09:01', 'Đồng bộ ảnh phiếu cân (chụp 08:44, mất mạng)'], ['12/11 07:30', 'Lê Văn Hải phát hành']] },
  { id: 'GVT-2611-0457', trip: 'CH-0457', orders: ['DH-1123'], st: 'issued', at: '12/11 03:41', w: 'confirmed', wAt: '12/11 04:35', wBy: 'Kho Thép Hòa Phát Đồng An', wHow: 'Ký trên app tài xế', wVal: 21.0,
    hirer: 'Thép Hòa Phát Bình Dương', recv: 'Cảng Cát Lái · Tân Cảng Sài Gòn', contract: 'HĐ 11/2026/HĐVC-HP · 20/01/2026', cargo: "Container 20' thép cuộn · HLXU 2210983", tons: 21.0,
    hist: [['12/11 04:35', 'Kho Đồng An ký xác nhận 21,0 tấn'], ['12/11 03:41', 'Lê Văn Hải phát hành']] },
  { id: 'GVT-2611-0455', trip: 'CH-0455', orders: ['DH-1122'], st: 'issued', at: '12/11 03:12', w: 'confirmed', wAt: '12/11 03:50', wBy: 'Kho Nhựa Duy Tân Bình Tân', wHow: 'Ký trên app tài xế', wVal: 12.0, done: true,
    hirer: 'Nhựa Duy Tân', recv: 'Đại lý Duy Tân Mỹ Tho', contract: 'HĐ 05/2026/HĐVC-DT · 12/01/2026', cargo: 'Sản phẩm nhựa gia dụng · 240 kiện', tons: 12.0,
    hist: [['12/11 07:05', 'Chuyến hoàn thành · giấy chuyển lưu trữ'], ['12/11 03:12', 'Lê Văn Hải phát hành']] },
  { id: 'GVT-2611-0452', trip: 'CH-0452', orders: ['DH-1121'], st: 'issued', at: '12/11 00:44', w: 'confirmed', wAt: '12/11 01:30', wBy: 'Cảng Cát Lái · bãi xuất', wHow: 'Ảnh phiếu EIR', wVal: 23.0, done: true,
    hirer: 'Tân Cảng Logistics', recv: 'Kho khách hàng KCN VSIP 1', contract: 'HĐ 15/2026/HĐVC-TCL · 02/01/2026', cargo: "Container 40' hàng khô · TCLU 4419920", tons: 23.0,
    hist: [['12/11 04:52', 'Chuyến hoàn thành · giấy chuyển lưu trữ'], ['12/11 00:44', 'Lê Văn Hải phát hành']] },
  { id: 'GVT-2611-0460', trip: 'CH-0460', orders: ['DH-1130'], st: 'cancelled', at: '12/11 07:02', w: 'waiting', cancelNote: 'Khách dời lịch · huỷ 12/11 08:15 bởi Lê Văn Hải',
    hirer: 'Thép Hòa Phát Bình Dương', recv: 'Cảng Cát Lái · Tân Cảng Sài Gòn', contract: 'HĐ 11/2026/HĐVC-HP · 20/01/2026', cargo: "Container 20' thép cuộn · HLXU 2211004", tons: 21.0, vehicleOverride: '51C-588.02', driverOverride: 'Huỳnh Tấn Lộc',
    hist: [['12/11 08:15', 'Lê Văn Hải huỷ giấy · lý do: khách dời lịch'], ['12/11 07:02', 'Lê Văn Hải phát hành']] }
];
TPL.forEach(g => { const t = FM.trips.find(x => x.id === g.trip); Object.assign(g, { vehicle: g.vehicleOverride || t.vehicle, trailer: t.trailer, driver: g.driverOverride || t.driver, route: t.route, pick: t.pick, drop: t.drop, type: t.type }); });
const GPLX = { 'Nguyễn Văn Tuấn': 'CE · 790112345678', 'Trần Minh Đức': 'CE · 790123456781', 'Lê Hoàng Phúc': 'CE · 790134567812', 'Võ Thành Nhân': 'CE · 790145678123', 'Ngô Đức Trí': 'CE · 790156781234', 'Đặng Quang Vinh': 'CE · 790167812345', 'Huỳnh Tấn Lộc': 'C · 790178123456' };

let G = [], sel = 'GVT-2611-0458', tab = 'all', onlyWait = false, q = '';
const SB = {
  draft: `<span class="badge b-neutral">${icon('pen')}Chờ phát hành</span>`,
  blocked: `<span class="badge b-danger">${icon('block')}Không phát hành được</span>`,
  issued: `<span class="badge b-success">${icon('check')}Đã phát hành</span>`,
  cancelled: `<span class="badge b-neutral" style="text-decoration:line-through">${icon('x')}Đã huỷ</span>`
};
const stBadge = g => g.st === 'issued' && g.done ? `<span class="badge b-neutral">${icon('lock')}Lưu trữ · chuyến xong</span>` : SB[g.st];
const wBadge = g => g.st === 'cancelled' ? '<span class="muted">—</span>' : g.w === 'confirmed'
  ? `<span class="badge b-success">${icon('check')}${fmt.dec(g.wVal)} tấn</span>`
  : `<span class="badge b-warning">${icon('clock')}Chờ xác nhận</span>`;

function rows() {
  return G.filter(g => (tab === 'all' || (tab === 'draft' ? ['draft', 'blocked'].includes(g.st) : g.st === tab)) && (!onlyWait || (g.w === 'waiting' && g.st !== 'cancelled')) &&
    (!q || (g.id + g.trip + g.vehicle + g.driver + g.hirer).toLowerCase().includes(q)));
}
function renderTabs() {
  const n = k => G.filter(g => k === 'all' || (k === 'draft' ? ['draft', 'blocked'].includes(g.st) : g.st === k)).length;
  $('tabs').innerHTML = [['all', 'Tất cả'], ['draft', 'Chờ phát hành'], ['issued', 'Đã phát hành'], ['cancelled', 'Đã huỷ']].map(([k, l]) => `<button role="tab" type="button" data-tab="${k}" aria-selected="${tab === k}">${l}<span class="count-pill">${n(k)}</span></button>`).join('');
  $('tabs').querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
  const ready = G.filter(g => g.st === 'draft').length;
  $('btnBulk').disabled = !ready; $('btnBulk').lastChild.textContent = ready ? `Phát hành ${ready} giấy đủ điều kiện` : 'Không có giấy chờ phát hành';
}
function renderList() {
  const r = rows();
  if (!r.length) { $('listCard').innerHTML = `<div class="empty">${icon('search')}<h3>Không có giấy khớp bộ lọc</h3><p>Thử tìm theo số giấy, mã chuyến hoặc biển số.</p></div>`; return; }
  $('listCard').innerHTML = `<div class="grid-wrap"><table class="grid" aria-label="Giấy vận tải">
    <thead><tr><th>Số giấy · Chuyến</th><th>Xe · Tài xế</th><th>Người thuê · Hành trình</th><th>Trạng thái · KL đã xếp</th></tr></thead>
    <tbody>${r.map(g => `<tr data-id="${g.id}" class="${g.id === sel ? 'selected' : ''} ${g.st === 'cancelled' ? 'is-cancelled' : ''}" tabindex="0">
      <td><b class="code">${g.id}</b><span class="cell-sub"><a class="code" href="fm-09-chi-tiet-chuyen.html">${g.trip}</a>${g.multi ? ' · 2 đơn ghép' : ''}</span></td>
      <td><span class="code">${g.vehicle}</span><span class="cell-sub">${g.driver}</span></td>
      <td class="wrapcell">${g.hirer}<span class="cell-sub">${g.route}</span></td>
      <td>${stBadge(g)}<span class="cell-sub" style="margin-top:4px">${g.st === 'cancelled' ? (g.at ? 'Phát hành ' + g.at : '') : g.w === 'confirmed' ? `<span class="pos">${icon('check')}</span> Đã xếp <b class="num">${fmt.dec(g.wVal)} tấn</b>` : `<span style="color:var(--warning-fg)">${icon('clock')} Chờ xác nhận KL</span>`}</span></td>
    </tr>`).join('')}</tbody></table></div>
    <div class="list-foot">${icon('info')}Giấy đã phát hành hiển thị trên app tài xế (DR_10) để xuất trình khi kiểm tra.</div>`;
  $('listCard').querySelectorAll('tbody tr').forEach(tr => {
    const pick = () => { sel = tr.dataset.id; renderList(); renderPreview(); };
    tr.onclick = e => { if (!e.target.closest('a')) pick(); }; tr.onkeydown = e => { if (e.key === 'Enter') pick(); };
  });
}

/* Deterministic pseudo-QR (not scannable) */
function qr(seed) {
  const N = 25, c = 92 / N; let h = 0; for (const ch of seed) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const rnd = () => { h ^= h << 13; h >>>= 0; h ^= h >> 17; h ^= h << 5; h >>>= 0; return h / 4294967296; };
  const finder = (x, y) => `<rect x="${x * c}" y="${y * c}" width="${7 * c}" height="${7 * c}" style="fill:var(--fg-strong)"/><rect x="${(x + 1) * c}" y="${(y + 1) * c}" width="${5 * c}" height="${5 * c}" style="fill:var(--surface)"/><rect x="${(x + 2) * c}" y="${(y + 2) * c}" width="${3 * c}" height="${3 * c}" style="fill:var(--fg-strong)"/>`;
  let cells = '';
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const inF = (x < 8 && y < 8) || (x > N - 9 && y < 8) || (x < 8 && y > N - 9);
    if (!inF && rnd() > .52) cells += `<rect x="${(x * c).toFixed(2)}" y="${(y * c).toFixed(2)}" width="${c.toFixed(2)}" height="${c.toFixed(2)}"/>`;
  }
  return `<svg class="qr" viewBox="0 0 92 92" role="img" aria-label="Mã QR tra cứu giấy ${seed}"><rect width="92" height="92" style="fill:var(--surface)"/><g style="fill:var(--fg-strong)">${cells}</g>${finder(0, 0)}${finder(N - 7, 0)}${finder(0, N - 7)}</svg>`;
}
const sigSvg = `<svg class="sig" viewBox="0 0 120 46" role="img" aria-label="Chữ ký xác nhận"><path d="M10 32c8-14 14-20 18-12s-6 14 2 8 10-18 16-10-2 12 6 6 8-10 14-4 6 4 14-2 8-6 16-4" fill="none" style="stroke:var(--fg-strong)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 38h92" style="stroke:var(--border-strong)" stroke-dasharray="2 3"/></svg>`;

function renderPreview() {
  const g = G.find(x => x.id === sel); const pv = $('pv');
  if (!g) { pv.innerHTML = `<div class="empty">${icon('doc')}<h3>Chọn một giấy để xem</h3></div>`; return; }
  const isDraft = g.st === 'draft' || g.st === 'blocked';
  const keep = g.at ? `12/11/2029` : null;
  const F = [
    ['Đơn vị vận tải', ORG],
    ['Biển số xe', `<span class="code">${g.vehicle}</span>${g.trailer ? ` · rơ-moóc <span class="code">${g.trailer}</span>` : ''}`],
    ['Lái xe', `${g.driver} · GPLX ${GPLX[g.driver] || '—'}`],
    ['Người thuê vận tải', g.hirer],
    ['Người nhận hàng', g.recv],
    ['Hành trình', `${g.route}<br><span class="muted num">Đi ${g.pick} · đến dự kiến ${g.drop} ngày 12/11/2026</span>`],
    ['Số, ngày hợp đồng', g.contract],
    ['Loại hàng', g.cargo],
    ['Khối lượng hàng', `<span class="num">${fmt.dec(g.tons)} tấn</span>`]
  ];
  const wconf = g.st === 'cancelled' ? '' : g.w === 'confirmed'
    ? `<div class="wconf"><div><div class="t">Xác nhận khối lượng đã xếp</div><div style="margin-top:4px"><b>${fmt.dec(g.wVal)} tấn</b> · ${g.wBy}</div><div class="muted sm num" style="margin-top:2px">${g.wHow} · ${g.wAt}</div></div>${g.wHow.startsWith('Ký') ? sigSvg : `<span class="badge b-outline" style="justify-self:end">${icon('camera')}Xem ảnh</span>`}</div>`
    : `<div class="wconf"><div><div class="t">Xác nhận khối lượng đã xếp</div><div style="margin-top:4px">Chưa có. Tài xế chụp phiếu hoặc xin chữ ký của chủ hàng trên app khi xếp hàng xong.</div></div><span class="badge b-warning" style="justify-self:end">${icon('clock')}Chờ xác nhận</span></div>`;
  pv.innerHTML = `<div class="pv-head"><h2>Xem trước</h2>${stBadge(g)}${keep ? `<span class="tip" style="margin-left:auto"><span class="badge b-outline" tabindex="0">${icon('lock')}Lưu đến ${keep}</span><span class="tip-body right">Giấy vận tải lưu tối thiểu 3 năm từ ngày phát hành. Không ai xoá được, kể cả Admin; giấy sai thì huỷ và phát hành giấy mới.</span></span>` : ''}</div>
    <div class="pv-actions">
      ${g.st === 'issued' && !g.done ? `<button class="btn btn-ghost" type="button" id="aCancel" style="color:var(--destructive)">Huỷ giấy</button>` : ''}
      <span class="sp"></span>
      ${g.st !== 'blocked' && g.st !== 'draft' ? `<a class="btn btn-ghost" href="driver-app.html">${icon('phone')}Xem trên app</a>` : ''}
      <button class="btn btn-secondary" type="button" id="aPdf" ${isDraft ? 'disabled title="Chỉ in được giấy đã phát hành"' : ''}>${icon('download')}In PDF dự phòng</button>
      ${g.st === 'draft' ? `<button class="btn btn-primary" type="button" id="aIssue">${icon('qr')}Phát hành</button>` : ''}
      ${g.st === 'blocked' ? `<span class="tip"><button class="btn btn-primary" type="button" disabled>${icon('qr')}Phát hành</button><span class="tip-body right">${g.block}.</span></span>` : ''}
    </div>
    <div class="pv-body">
      ${g.st === 'blocked' ? `<div class="alert alert-danger" role="alert">${icon('block')}<div><b>Không phát hành được:</b> ${g.block}. Đổi rơ-moóc hoặc cập nhật bảo hiểm trước khi phát hành.</div><div class="alert-actions"><a class="btn btn-secondary btn-sm" href="fm-08-dieu-phoi.html#drawer">Đổi rơ-moóc</a></div></div>` : ''}
      ${g.multi ? `<div class="open-note"><span class="badge">${icon('info')}Chưa chốt</span><div>Chuyến ghép 2 đơn (DH-1127, DH-1133): đang phát hành <b>một giấy cho cả chuyến</b>. Chưa chốt có cần mỗi đơn một giấy hay không; chờ xác nhận quy định trước khi làm bản chính thức.</div></div>` : ''}
      ${g.st === 'cancelled' ? `<div class="alert alert-info">${icon('info')}<div>${g.cancelNote}. Giấy đã huỷ vẫn được lưu trữ và tra cứu được bằng QR (hiện trạng thái Đã huỷ).</div></div>` : ''}
      <div class="paper-bg"><article class="paper ${g.st === 'cancelled' ? 'void' : ''}" aria-label="Giấy vận tải ${g.id}">
        <div class="paper-top">
          <div><div class="org">${ORG}</div><h3>GIẤY VẬN TẢI</h3><div class="no">Số <span class="code">${g.id}</span> · ${g.at ? `phát hành <span class="num">${g.at.replace(' ', '/2026 ')}</span>` : '<b>Bản nháp, chưa phát hành</b>'}</div>
            <div class="no">Chuyến <span class="code">${g.trip}</span> · Đơn <span class="code">${g.orders.join(', ')}</span></div></div>
          <div class="qr-wrap ${isDraft ? 'draft' : ''}">${qr(g.id)}${isDraft ? '<span class="qr-over">Có QR sau khi phát hành</span>' : ''}<div class="qr-cap">Quét để tra cứu</div></div>
        </div>
        <dl class="pf">${F.map(([k, v], i) => `<div><span class="n">${i + 1}.</span><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>
        ${wconf}
        <div class="paper-foot">${icon('phone')}${g.st === 'issued' ? 'Đang hiển thị trên app tài xế để xuất trình.' : g.st === 'cancelled' ? 'Đã gỡ khỏi app tài xế.' : 'Chỉ hiện trên app tài xế sau khi phát hành.'}</div>
      </article></div>
      <div class="stack" style="gap:6px"><div class="section-title"><h3>Lịch sử</h3><span class="muted sm">không sửa được</span></div><ul class="hist">${g.hist.map(([w, t]) => `<li><span class="when">${w}</span><span>${t}</span></li>`).join('')}</ul></div>
    </div>`;
  const pdf = $('aPdf'); if (pdf && !pdf.disabled) pdf.onclick = () => toast(`Đã tạo bản PDF <span class="code">${g.id}.pdf</span> · in mang theo khi app không dùng được`);
  const iss = $('aIssue'); if (iss) iss.onclick = () => confirmIssue([g]);
  const c = $('aCancel'); if (c) c.onclick = () => confirmCancel(g);
}
function modal(html, onOk, needInput) {
  const s = document.createElement('div'); s.className = 'scrim modal-scrim';
  const m = document.createElement('div'); m.className = 'modal'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true'); m.innerHTML = html;
  document.body.append(s, m); const close = () => { Shell.dismiss(s); Shell.dismiss(m); };
  const ok = m.querySelector('[data-ok]'), inp = m.querySelector('input');
  if (needInput) { ok.disabled = true; inp.oninput = () => ok.disabled = !inp.value.trim(); inp.focus(); } else ok.focus();
  m.querySelector('[data-x]').onclick = close; s.onclick = close; ok.onclick = () => { close(); onOk(inp && inp.value.trim()); };
}
function confirmIssue(list) {
  modal(`<h2>Phát hành ${list.length > 1 ? list.length + ' giấy vận tải' : 'giấy ' + list[0].id}?</h2><p class="muted">Giấy sẽ hiện trên app tài xế kèm mã QR. Sau khi phát hành không sửa được; muốn đổi thì huỷ và phát hành giấy mới. Giấy được lưu tối thiểu 3 năm.</p>
    <div class="row" style="justify-content:flex-end"><button class="btn btn-secondary" type="button" data-x>Quay lại</button><button class="btn btn-primary" type="button" data-ok>Phát hành</button></div>`, () => {
    list.forEach(g => { g.st = 'issued'; g.at = '12/11 09:06'; g.hist.unshift(['12/11 09:06', 'Lê Văn Hải phát hành']); });
    sel = list[0].id; render();
    toast(list.length > 1 ? `Đã phát hành ${list.length} giấy vận tải` : `Đã phát hành <span class="code">${list[0].id}</span> · tài xế ${list[0].driver} đã nhận thông báo`);
  });
}
function confirmCancel(g) {
  modal(`<h2>Huỷ giấy ${g.id}?</h2><p class="muted">Giấy bị gỡ khỏi app tài xế nhưng vẫn được lưu trữ, tra cứu QR sẽ hiện "Đã huỷ". Không xoá được.</p>
    <label class="field"><span>Lý do huỷ *</span><input class="input" placeholder="VD: Đổi xe do xe hỏng giữa đường"></label>
    <div class="row" style="justify-content:flex-end"><button class="btn btn-secondary" type="button" data-x>Quay lại</button><button class="btn btn-danger" type="button" data-ok>Huỷ giấy</button></div>`, reason => {
    const prev = JSON.parse(JSON.stringify(g));
    g.st = 'cancelled'; g.cancelNote = `${reason} · huỷ 12/11 09:06 bởi Lê Văn Hải`; g.hist.unshift(['12/11 09:06', 'Lê Văn Hải huỷ giấy · lý do: ' + reason.toLowerCase()]); render();
    toast(`Đã huỷ <span class="code">${g.id}</span>`, { undo: () => { Object.assign(g, prev); render(); } });
  }, true);
}
function render() { $('slot').innerHTML = ''; renderTabs(); renderList(); renderPreview(); }

$('fWait').onclick = e => { onlyWait = !onlyWait; e.currentTarget.classList.toggle('on', onlyWait); e.currentTarget.setAttribute('aria-pressed', onlyWait); render(); };
$('q').oninput = e => { q = e.target.value.trim().toLowerCase(); render(); };
$('btnBulk').onclick = () => { const l = G.filter(g => g.st === 'draft'); if (l.length) confirmIssue(l); };
$('btnExport').onclick = () => toast('Đã xuất danh sách giấy vận tải ngày 12/11/2026 (Excel)');
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, select')) return;
  if (e.key === '/') { e.preventDefault(); $('q').focus(); }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { const r = rows(), i = r.findIndex(g => g.id === sel); const n = r[Math.max(0, Math.min(r.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))]; if (n) { e.preventDefault(); sel = n.id; renderList(); renderPreview(); } }
});

Shell.states([['default', 'Mặc định'], ['draft', 'Chờ phát hành'], ['blocked', 'Bị chặn'], ['multi', 'Ghép đơn (chưa chốt)'], ['cancelled', 'Đã huỷ'], ['loading', 'Đang tải'], ['empty', 'Trống'], ['error', 'Lỗi']], s => {
  G = JSON.parse(JSON.stringify(TPL)); tab = 'all'; onlyWait = false; q = ''; $('q').value = ''; $('fWait').classList.remove('on');
  sel = { draft: 'GVT-2611-0462', blocked: 'GVT-2611-0464', multi: 'GVT-2611-0463', cancelled: 'GVT-2611-0460' }[s] || 'GVT-2611-0458';
  $('md').style.display = ''; render();
  if (s === 'loading') {
    $('listCard').innerHTML = `<table class="grid"><thead><tr>${Array(5).fill('<th><span class="sk" style="width:80px"></span></th>').join('')}</tr></thead><tbody>${Array(8).fill('<tr>' + Array(5).fill('<td><span class="sk" style="width:80%"></span><span class="sk" style="width:50%;margin-top:6px;height:9px"></span></td>').join('') + '</tr>').join('')}</tbody></table>`;
    $('pv').innerHTML = `<div class="pv-head"><span class="sk" style="width:120px"></span></div><div class="pv-body"><div class="paper-bg"><div class="paper stack">${Array(10).fill('<span class="sk"></span>').join('')}</div></div></div>`;
  }
  if (s === 'empty') {
    G = []; renderTabs();
    $('md').style.display = 'none';
    $('slot').innerHTML = `<section class="card"><div class="empty">${icon('qr')}<h3>Chưa có giấy vận tải nào hôm nay</h3><p>Giấy được tạo tự động khi gán xe và tài xế cho chuyến ở màn Điều phối.</p><a class="btn btn-primary" href="fm-08-dieu-phoi.html">Mở Điều phối</a></div></section>`;
  }
  if (s === 'error') $('slot').innerHTML = `<div class="alert alert-warning" role="alert">${icon('refresh')}<div>Không kết nối được máy chủ. Chưa phát hành được giấy mới; giấy đã phát hành vẫn hiện trên app tài xế (kể cả khi offline).</div><div class="alert-actions"><button class="btn btn-secondary btn-sm" type="button" onclick="location.reload()">Thử lại</button></div></div>`;
});
</script>
</body>
