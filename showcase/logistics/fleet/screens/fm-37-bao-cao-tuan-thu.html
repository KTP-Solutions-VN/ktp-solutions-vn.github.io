<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Báo cáo tuân thủ · Đội Xe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700&family=Inter:wght@400;500;600;700&display=swap&subset=vietnamese">
<link rel="stylesheet" href="../assets/css/app.css">
<style>
  .fresh button { border: 0; background: none; color: var(--primary); font: 500 12.5px var(--font-body); cursor: pointer; padding: 0; display: inline-flex; gap: 4px; align-items: center; }
  .fresh button .icon { width: 14px; height: 14px; }
  /* SummaryStrip (như FM_35) */
  .summary { display: grid; grid-template-columns: minmax(380px, 1.5fr) repeat(4, minmax(0, 1fr)); gap: 6px; padding: 6px; background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-card); }
  .sum-main { padding: 18px 22px; background: var(--primary-soft); display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; column-gap: 16px; border-radius: 8px; }
  .sum-main-text { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .sum-main .k { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--side-active); }
  .sum-main .v { font: 700 var(--text-display)/40px var(--font-display); color: var(--fg-strong); font-variant-numeric: tabular-nums; }
  .sum-main .v small { font: 600 18px var(--font-display); color: var(--fg-muted); margin-left: 4px; }
  .sum-main .row, .sum-item .row { gap: 6px; flex-wrap: wrap; font-size: 12.5px; color: var(--fg-muted); }
  .sum-spark { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; padding-bottom: 2px; }
  .sum-spark small { font-size: 11.5px; color: var(--fg-muted); }
  .sum-item { padding: 18px 16px; display: flex; flex-direction: column; justify-content: center; gap: 4px; min-width: 0; border: 0; border-radius: 8px; background: transparent; font: inherit; color: inherit; text-align: left; cursor: pointer; text-decoration: none !important; }
  .sum-item:hover { background: var(--surface-muted); }
  .sum-item .k { font-size: 12.5px; color: var(--fg-muted); font-weight: 500; }
  .sum-item .v { font: 700 24px/30px var(--font-display); color: var(--fg-strong); font-variant-numeric: tabular-nums; }
  .sum-item .v small { font: 600 14px var(--font-body); color: var(--fg-muted); }
  .delta { display: inline-flex; align-items: center; gap: 3px; font-size: 12.5px; font-weight: 600; }
  .delta.good { color: var(--success-fg); } .delta.bad { color: var(--danger-fg); }
  .card { display: flex; flex-direction: column; min-width: 0; }
  .card-title { display: flex; align-items: center; gap: 10px; padding: 16px 18px 10px; min-height: 30px; }
  .card-title h2 { font-size: 16px; white-space: nowrap; }
  .card-title .meta { margin-left: auto; font-size: 12.5px; color: var(--fg-muted); display: inline-flex; gap: 10px; align-items: center; white-space: nowrap; }
  .card-foot { margin-top: auto; padding: 8px 18px 14px; font-size: 12.5px; color: var(--fg-muted); display: flex; align-items: center; gap: 8px; }
  .card-foot .icon { width: 15px; height: 15px; flex: none; }
  .row2 { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: var(--s-4); align-items: stretch; }
  /* Bảng vi phạm */
  .grid td, .grid th { font-variant-numeric: tabular-nums; }
  .grid td.right, .grid th.right { text-align: right; }
  .grid tbody tr[data-drv] { cursor: pointer; }
  .grid tbody tr:last-child td { border-bottom: 0; }
  .grid th.grp { text-align: center; border-bottom: 0; padding-bottom: 0; }
  #tblV th, #tblV td { padding-left: 10px; padding-right: 10px; }
  .z { color: var(--fg-subtle); }
  .hot { color: var(--warning-fg); font-weight: 600; }
  .tbl-wrap { border-radius: 0 0 var(--r-lg) var(--r-lg); overflow: hidden; flex: 1; }
  /* Chart tuần */
  .chart-wrap { padding: 4px 14px 4px; flex: 1; display: flex; align-items: center; }
  .chart-wrap svg { display: block; width: 100%; height: auto; }
  .chart-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--fg-muted); padding: 4px 18px 14px; }
  .chart-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; box-sizing: border-box; }
  /* Danh sách không kẻ (B1) */
  .list { padding: 0 10px 6px; display: flex; flex-direction: column; gap: 2px; }
  .li { display: grid; grid-template-columns: 88px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 8px; border-radius: 8px; color: inherit; text-decoration: none !important; }
  .li:hover { background: var(--surface-muted); }
  .li .when { font-size: 12.5px; color: var(--fg-muted); font-variant-numeric: tabular-nums; line-height: 16px; }
  .li .t, .li .d { display: block; }
  .li .t { font-weight: 600; color: var(--fg-strong); font-size: 13.5px; line-height: 20px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .li .d { font-size: 12.5px; color: var(--fg-muted); line-height: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc-li { grid-template-columns: 3px 32px minmax(0, 1fr) auto; padding-left: 0; }
  .doc-li .sev { align-self: stretch; margin: 4px 0; border-radius: 0 3px 3px 0; background: var(--danger-solid); }
  .doc-li .ic { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; background: var(--danger-soft); color: var(--danger-fg); }
  /* Drawer */
  .drawer { width: min(640px, 100vw); }
  .drawer-head { border-bottom: 0; padding-bottom: 0; }
  .drawer-head .top { display: flex; align-items: flex-start; gap: 12px; }
  .drawer-head .top h2 { font-size: 18px; }
  .drawer-head .close { margin-left: auto; }
  .ev { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 9px 8px; border-radius: 8px; }
  .ev:hover { background: var(--surface-muted); }
  .ev.sel { background: var(--primary-soft); }
  .mini-stats { display: flex; gap: 6px; background: var(--surface-muted); border-radius: 8px; padding: 6px; }
  .mini-stats div { flex: 1; padding: 8px 10px; border-radius: 6px; }
  .mini-stats div:first-child { background: var(--surface); }
  .mini-stats b { display: block; font: 700 20px/26px var(--font-display); color: var(--fg-strong); font-variant-numeric: tabular-nums; }
  .mini-stats span { font-size: 12px; color: var(--fg-muted); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-grid .full { grid-column: 1 / -1; }
  .opt { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 8px; background: var(--surface-muted); cursor: pointer; }
  .opt:has(input:checked) { background: var(--primary-soft); box-shadow: inset 0 0 0 1px var(--primary); }
  .opt input { margin-top: 3px; accent-color: var(--primary); }
  .opt b { display: block; font-size: 13.5px; color: var(--fg-strong); }
  .opt small { display: block; font-size: 12.5px; color: var(--fg-muted); line-height: 17px; margin-top: 2px; }
  .chk { display: flex; align-items: center; gap: 8px; font-size: 13.5px; }
  .chk input { accent-color: var(--primary); width: 16px; height: 16px; }
  .modal { width: min(560px, calc(100vw - 32px)); }
  .modal-head { display: flex; align-items: center; gap: 8px; }
  .modal-head h2 { font-size: 17px; }
  .modal-foot { display: flex; gap: 8px; justify-content: flex-end; align-items: center; margin-top: 4px; }
  .lbl { font-size: 12.5px; font-weight: 600; color: var(--fg-muted); text-transform: uppercase; letter-spacing: .04em; }
  @media (max-width: 1200px) { .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); } .sum-main { grid-column: 1 / -1; } .row2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="app-content">
  <div class="page-header">
    <div>
      <div class="crumb">Báo cáo / Tuân thủ</div>
      <h1>Báo cáo tuân thủ</h1>
      <div class="fresh" style="margin-top:6px" id="fresh"></div>
    </div>
    <div class="actions">
      <button class="btn btn-secondary" type="button" id="xlsBtn"></button>
      <button class="btn btn-primary" type="button" id="exportBtn"></button>
    </div>
  </div>

  <div class="filterbar" role="toolbar" aria-label="Bộ lọc">
    <button class="chip on" type="button">Kỳ: Tháng 10/2026 <span class="ic-chev"></span></button>
    <button class="chip" type="button">Tài xế: Tất cả <span class="ic-chev"></span></button>
    <div class="seg" role="group" aria-label="Loại vi phạm" id="kindSeg"><button type="button" data-kind="all" aria-pressed="true">Tất cả vi phạm</button><button type="button" data-kind="drive" aria-pressed="false">Giờ lái</button><button type="button" data-kind="speed" aria-pressed="false">Tốc độ</button></div>
    <button class="chip" type="button" id="openOnly" aria-pressed="false">Chỉ còn chưa xử lý</button>
    <button class="btn btn-ghost btn-sm" type="button" id="clearF">Xoá lọc</button>
  </div>

  <div id="view" style="display:contents"></div>
</div>

<script src="../assets/js/shell.js"></script>
<script src="../assets/js/data.js"></script>
<script>
const { icon, fmt, toast } = Shell;
Shell.mount({ active: 'FM_37', title: 'Báo cáo tuân thủ' });
document.querySelectorAll('.ic-chev').forEach(e => e.outerHTML = icon('chevron'));
document.getElementById('xlsBtn').innerHTML = icon('download') + 'Xuất Excel';
document.getElementById('exportBtn').innerHTML = icon('shield') + 'Xuất mẫu phục vụ kiểm tra';

/* ---------- Dữ liệu tháng 10/2026 ----------
   Vi phạm giờ lái: liên tục > 4h, ngày > 10h, tuần > 48h. Tốc độ: số lần vượt giới hạn đoạn đường từ GSHT.
   [tài xế, xe, liên tục, ngày, tuần, tốc độ, tốc độ cao nhất "x/y", số chưa xử lý] */
const DRV = [
  ['Đặng Quang Vinh', '51C-456.78', 4, 1, 1, 6, '92/80', 2],
  ['Võ Thành Nhân', '61C-220.14', 3, 2, 0, 4, '88/80', 1],
  ['Trần Minh Đức', '51D-456.78', 2, 1, 1, 1, '84/80', 1],
  ['Võ Thanh Sơn', '51C-334.21', 2, 0, 0, 3, '86/80', 0],
  ['Ngô Đức Trí', '51C-731.80', 1, 1, 0, 2, '83/80', 1],
  ['Bùi Minh Khoa', '51C-412.09', 1, 0, 0, 1, '81/80', 0],
  ['Lê Hoàng Phúc', '51D-702.33', 0, 0, 0, 1, '68/60', 0],
  ['Nguyễn Văn Tuấn', '51C-123.45', 1, 0, 0, 0, '—', 0]
].map(([name, plate, c4, d10, w48, sp, max, open]) => ({ name, plate, c4, d10, w48, sp, max, open, drive: c4 + d10 + w48, total: c4 + d10 + w48 + sp }));
const EVENTS = {
  'Đặng Quang Vinh': [
    ['28/10 14:52', 'speed', 'Quá tốc độ 92/80 km/h trong 3 phút', 'CH-0438 · QL1A, đoạn Bình Chánh', null],
    ['24/10 16:10', 'drive', 'Lái liên tục 4h38 không nghỉ', 'CH-0429 · Cát Lái → Sa Đéc', null],
    ['19/10 22:40', 'drive', 'Thời gian lái trong ngày 10h25', 'CH-0417, CH-0419', 'Nhắc nhở · Trần Thanh Phong · 21/10'],
    ['17/10 09:05', 'speed', 'Quá tốc độ 87/80 km/h trong 1 phút', 'CH-0412 · Vành đai 2, Thủ Đức', 'Nhắc nhở · Trần Thanh Phong · 18/10'],
    ['12/10 15:30', 'drive', 'Lái liên tục 4h12 không nghỉ', 'CH-0401 · KCN Tân Uyên → Cát Lái', 'Cảnh cáo bằng văn bản · Hoàng Văn Hùng · 14/10'],
    ['06/10 11:20', 'drive', 'Tổng giờ lái tuần 49h10', 'Tuần 29/09–05/10', 'Nhắc nhở · Trần Thanh Phong · 07/10']
  ]
};
const LOG = [
  ['11/11/2026', '09:14', 'Võ Thanh Sơn', 'Quá tốc độ 86/80 km/h · CH-0447', 'Nhắc nhở', 'Trần Thanh Phong'],
  ['10/11/2026', '16:40', 'Bùi Minh Khoa', 'Lái liên tục 4h05 · CH-0444', 'Đào tạo lại quy định giờ lái', 'Trần Thanh Phong'],
  ['08/11/2026', '10:02', 'Võ Thành Nhân', 'Thời gian lái ngày 10h40 · CH-0436', 'Cảnh cáo bằng văn bản', 'Hoàng Văn Hùng'],
  ['05/11/2026', '14:25', 'Trần Minh Đức', 'Tổng giờ lái tuần 48h50', 'Nhắc nhở, điều chỉnh lịch tuần sau', 'Nguyễn Thị Lan'],
  ['03/11/2026', '08:50', 'Lê Hoàng Phúc', 'Quá tốc độ 68/60 km/h · CH-0425', 'Nhắc nhở', 'Trần Thanh Phong']
];
const DOCS = [
  ['51C-099.21', 'Giấy chứng nhận kiểm định (đăng kiểm)', '02/11/2026', 10, 'truck'],
  ['Đặng Văn Hiếu', 'Giấy phép lái xe hạng FC', '05/11/2026', 7, 'user'],
  ['51C-731.80', 'Phù hiệu xe container', '09/11/2026', 3, 'truck'],
  ['51R-088.12', 'Bảo hiểm TNDS rơ-moóc', '28/10/2026', 15, 'container']
];
const WEEKS = [['28/9', 9], ['5/10', 11], ['12/10', 8], ['19/10', 7], ['26/10', 6], ['2/11', 5], ['9/11', 2]];

let S;
function reset(o) { S = Object.assign({ kind: 'all', open: false, loading: false, empty: false, error: false, gsht: false }, o || {}); }
const view = document.getElementById('view');
const rowsF = () => DRV.filter(d => (S.kind === 'all' ? d.total : S.kind === 'drive' ? d.drive : d.sp) > 0 && (!S.open || d.open > 0));

function render() {
  sync();
  document.getElementById('fresh').innerHTML = S.gsht ? `<span class="live warn" aria-hidden="true"></span>Dữ liệu tốc độ dừng ở 06:40 12/11 · GSHT Bình Anh mất kết nối` : `<span class="live" aria-hidden="true"></span>Cập nhật 8 phút trước · GSHT và mốc app tài xế <button type="button" id="refresh">${icon('refresh')}Làm mới</button>`;
  const rf = document.getElementById('refresh'); if (rf) rf.onclick = () => toast('Đã làm mới số liệu tuân thủ');
  if (S.loading) { view.innerHTML = `<section class="summary"><div class="sum-main"><div class="sum-main-text"><span class="sk" style="width:60%"></span><span class="sk" style="width:30%;height:34px;margin-top:8px"></span></div></div>${Array(4).fill('<div class="sum-item"><span class="sk" style="width:70%"></span><span class="sk" style="width:40%;height:22px;margin-top:8px"></span></div>').join('')}</section><div class="row2"><div class="card"><table class="grid"><tbody>${Array(8).fill('<tr>' + Array(8).fill('<td><span class="sk" style="width:80%"></span></td>').join('') + '</tr>').join('')}</tbody></table></div><div class="card card-body">${Array(7).fill('<span class="sk" style="height:18px;margin:10px 0"></span>').join('')}</div></div>`; return; }
  if (S.error) { view.innerHTML = `<div class="alert alert-danger" role="alert">${icon('block')}<div>Không tải được báo cáo tuân thủ. Thử lại sau ít phút.</div><div class="alert-actions"><button class="btn btn-secondary btn-sm" type="button" id="retry">${icon('refresh')}Thử lại</button></div></div>`; document.getElementById('retry').onclick = () => { S.error = false; render(); }; return; }
  if (S.empty) { view.innerHTML = `<div class="card"><div class="empty">${icon('shield')}<h3>Không có vi phạm giờ lái hay tốc độ trong kỳ</h3><p>Vẫn có thể xuất báo cáo trống để lưu hồ sơ kiểm tra.</p><button class="btn btn-secondary" type="button" id="exp2">Xuất mẫu phục vụ kiểm tra</button></div></div>` + `<div class="row2" style="grid-template-columns:1fr">${docsHtml()}</div>`; document.getElementById('exp2').onclick = openExport; return; }
  view.innerHTML = (S.gsht ? `<div class="alert alert-warning" role="status">${icon('warn')}<div><b>Vi phạm tốc độ từ 06:40 12/11 chưa có.</b> Kết nối GSHT Bình Anh báo lỗi xác thực. Vi phạm giờ lái vẫn tính từ mốc app tài xế.</div><div class="alert-actions"><a class="btn btn-secondary btn-sm" href="fm-39-tich-hop.html#autherr">Mở Tích hợp</a></div></div>` : '') +
    summaryHtml() + `<div class="row2">${tableHtml()}${weekHtml()}</div><div class="row2">${logHtml()}${docsHtml()}</div>`;
  bind();
}
function summaryHtml() {
  const t = k => DRV.reduce((s, d) => s + d[k], 0), total = t('total'), open = t('open');
  return `<section class="summary" aria-label="Tóm tắt tuân thủ tháng 10/2026">
    <div class="sum-main"><span class="sum-main-text"><span class="k">Vi phạm tháng 10/2026</span><span class="v">${total}<small>lần</small></span>
      <span class="row"><span>${DRV.filter(d => d.total).length} tài xế</span><span class="delta good">▼ 9 lần</span><span>so với T9</span></span></span>
      <span class="sum-spark">${spark([58, 52, 49, 49, total], 112, 40)}<small>5 tháng gần nhất</small></span></div>
    <button class="sum-item" type="button" data-kindgo="drive"><span class="k">Giờ lái</span><span class="v">${t('drive')}</span><span class="row" title="Liên tục &gt; 4h: ${t('c4')} · ngày &gt; 10h: ${t('d10')} · tuần &gt; 48h: ${t('w48')}">${t('c4')} lần lái liên tục &gt; 4h</span></button>
    <button class="sum-item" type="button" data-kindgo="speed"><span class="k">Quá tốc độ</span><span class="v">${t('sp')}</span><span class="row">${S.gsht ? 'thiếu dữ liệu từ 06:40 12/11' : 'cao nhất 92/80 km/h'}</span></button>
    <button class="sum-item" type="button" id="openGo"><span class="k">Chưa xử lý</span><span class="v" style="color:var(--warning-fg)">${open}</span><span class="row">cần ghi nhận xử lý</span></button>
    <a class="sum-item" href="fm-18-giay-to.html?filter=overdue"><span class="k">Giấy tờ quá hạn</span><span class="v">${DOCS.length}</span><span class="row">xe, rơ-moóc, tài xế ${icon('chevron-right')}</span></a>
  </section>`;
}
function spark(vals, w, h) {
  const max = Math.max(...vals), min = Math.min(...vals), pts = vals.map((v, i) => [4 + i / (vals.length - 1) * (w - 8), h - 4 - (v - min) / (max - min || 1) * (h - 8)]);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ')}" fill="none" style="stroke:var(--primary)" stroke-width="2" stroke-linecap="round"/><circle cx="${pts[pts.length - 1][0]}" cy="${pts[pts.length - 1][1]}" r="3" style="fill:var(--primary)"/></svg>`;
}
function tableHtml() {
  const rs = rowsF().sort((a, b) => b.total - a.total), sd = S.kind !== 'speed', ss = S.kind !== 'drive';
  const n = v => v ? v : '<span class="z">0</span>';
  return `<section class="card" aria-label="Vi phạm theo tài xế">
    <div class="card-title"><h2>Vi phạm theo tài xế</h2><span class="count-pill">${rs.length} tài xế</span><span class="meta">Bấm dòng để xem từng lần và ghi nhận xử lý</span></div>
    <div class="tbl-wrap grid-wrap"><table class="grid" id="tblV"><thead>
      <tr><th rowspan="2">Tài xế</th>${sd ? '<th colspan="3" class="grp">Giờ lái vượt</th>' : ''}${ss ? '<th colspan="2" class="grp">Tốc độ</th>' : ''}<th rowspan="2" class="right">Tổng</th><th rowspan="2">Xử lý</th></tr>
      <tr>${sd ? '<th class="right">4h liên tục</th><th class="right">10h/ngày</th><th class="right">48h/tuần</th>' : ''}${ss ? '<th class="right">Số lần</th><th class="right">Max km/h</th>' : ''}</tr></thead>
      <tbody>${rs.map(d => `<tr data-drv="${d.name}" tabindex="0"><td><b style="font-weight:600">${d.name}</b><span class="cell-sub code">${d.plate}</span></td>
        ${sd ? `<td class="right ${d.c4 >= 3 ? 'hot' : ''}">${n(d.c4)}</td><td class="right ${d.d10 >= 2 ? 'hot' : ''}">${n(d.d10)}</td><td class="right">${n(d.w48)}</td>` : ''}
        ${ss ? `<td class="right ${d.sp >= 4 ? 'hot' : ''}">${n(d.sp)}</td><td class="right">${d.max === '—' ? '<span class="z">—</span>' : d.max}</td>` : ''}
        <td class="right"><b>${S.kind === 'all' ? d.total : S.kind === 'drive' ? d.drive : d.sp}</b></td>
        <td>${d.open ? `<span class="badge b-warning">${icon('warn')}Còn ${d.open}</span>` : `<span class="badge b-success">${icon('check')}Xong</span>`}</td></tr>`).join('') || `<tr><td colspan="8" class="muted">Không có tài xế nào khớp bộ lọc.</td></tr>`}</tbody></table></div>
  </section>`;
}
function weekHtml() {
  const W = 340, H = 330, X0 = 30, Y0 = 22, Y1 = H - 26, max = 12, bw = 28, gap = (W - X0 - 8) / WEEKS.length, y = v => Y1 - v / max * (Y1 - Y0);
  const bars = WEEKS.map(([lb, v], i) => { const cx = X0 + gap * i + gap / 2, partial = i === WEEKS.length - 1, hi = i === WEEKS.length - 2;
    return `<rect x="${cx - bw / 2}" y="${y(v)}" width="${bw}" height="${Y1 - y(v)}" rx="3" style="fill:${partial ? 'transparent' : hi ? 'var(--primary)' : 'var(--chart-muted)'};${partial ? 'stroke:var(--primary);stroke-dasharray:4 3;stroke-width:1.5' : ''}"/>
      <text x="${cx}" y="${y(v) - 6}" text-anchor="middle" font-size="12" font-weight="${hi || partial ? 700 : 500}" style="fill:${hi || partial ? 'var(--fg-strong)' : 'var(--fg-muted)'}">${v}</text>
      <text x="${cx}" y="${H - 8}" text-anchor="middle" font-size="11" style="fill:var(--fg-muted)">${lb}</text>`; }).join('');
  return `<section class="card" aria-label="Vi phạm theo tuần">
    <div class="card-title"><h2>Vi phạm theo tuần</h2><span class="meta">7 tuần gần nhất</span></div>
    <div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ cột số vi phạm mỗi tuần">
      ${[4, 8, 12].map(v => `<line x1="${X0}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--surface-muted)"/><text x="${X0 - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" style="fill:var(--fg-muted)">${v}</text>`).join('')}
      <line x1="${X0}" x2="${W - 4}" y1="${Y1}" y2="${Y1}" style="stroke:var(--border-strong)"/>${bars}</svg></div>
    <div class="chart-legend"><span><i style="background:var(--chart-muted)"></i>Tuần trước</span><span><i style="background:var(--primary)"></i>Tuần gần nhất đã trọn</span><span><i style="border:1.5px dashed var(--primary)"></i>Tuần này (đang chạy)</span></div>
  </section>`;
}
function logHtml() {
  return `<section class="card" aria-label="Nhật ký xử lý">
    <div class="card-title"><h2>Nhật ký xử lý</h2><span class="meta"><a href="fm-40-quyen-rieng-tu.html#log">Nhật ký hệ thống</a></span></div>
    <div class="list">${LOG.map(([d, t, drv, v, how, who]) => `<div class="li"><span class="when">${d}<br>${t}</span><span style="min-width:0"><span class="t">${drv} · ${how}</span><span class="d" title="${v}">${v} · ghi nhận bởi ${who}</span></span><span class="badge b-success">${icon('check')}Đã xử lý</span></div>`).join('')}</div>
    <div class="card-foot">${icon('lock')}<span>Nhật ký xử lý là hồ sơ an toàn, lưu 3 năm và không sửa được sau khi ghi.</span></div>
  </section>`;
}
function docsHtml() {
  return `<section class="card" aria-label="Giấy tờ quá hạn">
    <div class="card-title"><h2>Giấy tờ quá hạn</h2><span class="count-pill">${DOCS.length}</span><span class="meta"><a href="fm-18-giay-to.html?filter=overdue">Mở Giấy tờ & hạn</a></span></div>
    <div class="list">${DOCS.map(([who, doc, exp, days, ic]) => `<a class="li doc-li" href="fm-18-giay-to.html?filter=overdue&q=${encodeURIComponent(who)}"><span class="sev"></span><span class="ic">${icon(ic)}</span><span style="min-width:0"><span class="t"><span class="${/^\d/.test(who) ? 'code' : ''}">${who}</span></span><span class="d" title="${doc}">${doc}</span></span><span class="badge b-danger" title="Hết hạn ${exp}">${icon('block')}Quá ${days} ngày</span></a>`).join('')}</div>
    <div class="card-foot">${icon('info')}<span>Xe, tài xế có giấy tờ quá hạn bị chặn gán chuyến.</span></div>
  </section>`;
}

/* ---------- Drawer chi tiết tài xế ---------- */
function openDrawer(name) {
  closeDrawer(true);
  const d = DRV.find(x => x.name === name), ev = EVENTS[name] || EVENTS['Đặng Quang Vinh'].slice(0, d.total > 6 ? 6 : Math.max(2, d.total)).map((e, i) => [e[0], e[1], e[2], `${['CH-0441', 'CH-0433', 'CH-0420', 'CH-0414', 'CH-0408', 'CH-0402'][i]} · ${d.plate}`, i < d.open ? null : e[4]]);
  const s = document.createElement('div'); s.className = 'scrim'; s.id = 'drScrim'; s.onclick = () => closeDrawer();
  const dr = document.createElement('aside'); dr.className = 'drawer'; dr.id = 'drawer'; dr.setAttribute('role', 'dialog'); dr.setAttribute('aria-modal', 'true'); dr.setAttribute('aria-labelledby', 'drT');
  const firstOpen = ev.findIndex(e => !e[4]);
  dr.innerHTML = `<div class="drawer-head"><div class="top"><div><div class="muted sm">Vi phạm tháng 10/2026 · <span class="code">${d.plate}</span></div><h2 id="drT">${d.name}</h2></div><button class="icon-btn close" type="button" aria-label="Đóng" id="drClose">${icon('x')}</button></div></div>
    <div class="drawer-body">
      <div class="mini-stats"><div><b>${d.total}</b><span>vi phạm trong kỳ</span></div><div><b>${d.drive}</b><span>giờ lái</span></div><div><b>${d.sp}</b><span>tốc độ</span></div><div><b style="color:${d.open ? 'var(--warning-fg)' : 'var(--fg-strong)'}">${d.open}</b><span>chưa xử lý</span></div></div>
      <div><div class="lbl" style="margin-bottom:6px">Từng lần vi phạm</div>
        ${ev.map((e, i) => `<div class="ev ${i === firstOpen ? 'sel' : ''}"><span class="sm muted" style="font-variant-numeric:tabular-nums">${e[0]}</span><span style="min-width:0"><b style="font-weight:600;font-size:13.5px">${e[2]}</b><span class="cell-sub">${e[3]}${e[4] ? ' · ' + e[4] : ''}</span></span>${e[4] ? `<span class="badge b-success">${icon('check')}Đã xử lý</span>` : `<span class="badge b-warning">${icon('warn')}Chưa xử lý</span>`}</div>`).join('')}
        <p class="sm muted" style="margin-top:8px">Vị trí chỉ ghi khi xe đang chạy chuyến. Xem lại hành trình trong <a href="fm-13-gio-lai.html">Giờ lái & an toàn</a>.</p></div>
      ${firstOpen >= 0 ? `<div><div class="lbl" style="margin-bottom:8px">Ghi nhận xử lý · ${ev[firstOpen][0]}</div>
        <div class="form-grid"><label class="field"><span>Hình thức</span><select class="input" id="how"><option>Nhắc nhở</option><option>Cảnh cáo bằng văn bản</option><option>Trừ thưởng chuyến</option><option>Đào tạo lại quy định</option></select></label>
        <label class="field"><span>Người xử lý</span><input class="input" value="Trần Thanh Phong (QL đội xe)" readonly></label>
        <label class="field full"><span>Ghi chú</span><textarea class="input" rows="3" placeholder="Ví dụ: đã trao đổi trực tiếp, tài xế cam kết nghỉ 15 phút sau mỗi 4 giờ"></textarea></label></div></div>` : `<div class="alert alert-success">${icon('check')}<div>Mọi vi phạm của tài xế trong kỳ đã có hình thức xử lý.</div></div>`}
    </div>
    <div class="drawer-foot"><a class="btn btn-ghost" href="fm-17-chi-tiet-tai-xe.html?tab=safety">Hồ sơ tài xế</a><span style="flex:1"></span><button class="btn btn-secondary" type="button" id="drCancel">Đóng</button>${firstOpen >= 0 ? '<button class="btn btn-primary" type="button" id="drSave">Lưu xử lý</button>' : ''}</div>`;
  document.body.append(s, dr);
  dr.querySelector('#drClose').onclick = dr.querySelector('#drCancel').onclick = () => closeDrawer();
  const sv = dr.querySelector('#drSave'); if (sv) sv.onclick = () => { const how = dr.querySelector('#how').value; d.open = Math.max(0, d.open - 1); LOG.unshift(['12/11/2026', '10:05', d.name, ev[firstOpen][2], how, 'Trần Thanh Phong']); LOG.pop(); closeDrawer(); render(); toast(`Đã ghi nhận "${how}" cho ${d.name}`, { undo: () => { d.open++; LOG.shift(); render(); } }); };
}
function closeDrawer(now) { ['drawer', 'drScrim'].forEach(id => { const e = document.getElementById(id); if (e) { e.id = ''; now ? e.remove() : Shell.dismiss(e); } }); }

/* ---------- Modal xuất mẫu ---------- */
function openExport() {
  closeModal(true);
  const s = document.createElement('div'); s.className = 'scrim modal-scrim'; s.id = 'mScrim'; s.onclick = () => closeModal();
  const m = document.createElement('div'); m.className = 'modal'; m.id = 'modal'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true'); m.setAttribute('aria-labelledby', 'mT');
  m.innerHTML = `<div class="modal-head">${icon('shield')}<h2 id="mT">Xuất mẫu phục vụ kiểm tra</h2><button class="icon-btn" style="margin-left:auto" type="button" aria-label="Đóng" id="mX">${icon('x')}</button></div>
    <div class="field"><span>Mẫu</span>
      <label class="opt"><input type="radio" name="tpl" checked><span><b>Mẫu nội bộ đầy đủ</b><small>Vi phạm giờ lái, tốc độ theo tài xế, nhật ký xử lý, giấy tờ quá hạn. Có chữ ký người lập.</small></span></label>
      <label class="opt"><input type="radio" name="tpl"><span><b>Mẫu theo Thông tư 36/2024 <span class="badge b-neutral" style="margin-left:4px">Chưa xác nhận</span></b><small>Chưa rõ văn bản có quy định mẫu báo cáo bắt buộc hay không. Cần đọc văn bản trước khi dùng mẫu này.</small></span></label></div>
    <div class="form-grid"><label class="field"><span>Kỳ</span><select class="input"><option>Tháng 10/2026</option><option>Quý 3/2026</option><option>Tuỳ chọn…</option></select></label>
      <label class="field"><span>Định dạng</span><select class="input"><option>Excel (.xlsx)</option><option>PDF có chữ ký</option></select></label></div>
    <div class="field"><span>Gồm các phần</span><div class="form-grid">${['Vi phạm giờ lái', 'Vi phạm tốc độ', 'Nhật ký xử lý', 'Giấy tờ quá hạn'].map(x => `<label class="chk"><input type="checkbox" checked>${x}</label>`).join('')}</div></div>
    <div class="modal-foot"><span class="sm muted" style="margin-right:auto">${DRV.length} tài xế · chi nhánh TP.HCM</span><button class="btn btn-secondary" type="button" id="mC">Huỷ</button><button class="btn btn-primary" type="button" id="mOk">${icon('download')}Xuất file</button></div>`;
  document.body.append(s, m);
  m.querySelector('#mX').onclick = m.querySelector('#mC').onclick = () => closeModal();
  m.querySelector('#mOk').onclick = () => { closeModal(); toast('Đang tạo file báo cáo tuân thủ Tháng 10/2026… Việc xuất được ghi vào nhật ký hệ thống.'); };
}
function closeModal(now) { ['modal', 'mScrim'].forEach(id => { const e = document.getElementById(id); if (e) { e.id = ''; now ? e.remove() : Shell.dismiss(e); } }); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeDrawer(); closeModal(); } });

function bind() {
  view.querySelectorAll('tr[data-drv]').forEach(tr => { tr.onclick = () => openDrawer(tr.dataset.drv); tr.onkeydown = e => { if (e.key === 'Enter') openDrawer(tr.dataset.drv); }; });
  view.querySelectorAll('[data-kindgo]').forEach(b => b.onclick = () => { S.kind = b.dataset.kindgo; render(); });
  const og = document.getElementById('openGo'); if (og) og.onclick = () => { S.open = true; render(); };
}
function sync() {
  document.querySelectorAll('#kindSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.kind === S.kind));
  const o = document.getElementById('openOnly'); o.classList.toggle('on', S.open); o.setAttribute('aria-pressed', S.open);
}
document.querySelectorAll('#kindSeg button').forEach(b => b.onclick = () => { S.kind = b.dataset.kind; render(); });
document.getElementById('openOnly').onclick = () => { S.open = !S.open; render(); };
document.getElementById('clearF').onclick = () => { S.open = false; S.kind = 'all'; render(); };
document.getElementById('exportBtn').onclick = openExport;
document.getElementById('xlsBtn').onclick = () => toast('Đang tạo file Excel vi phạm Tháng 10/2026…');

Shell.states([['default', 'Mặc định'], ['drawer', 'Chi tiết tài xế'], ['export', 'Xuất mẫu kiểm tra'], ['gsht', 'Mất dữ liệu GSHT'], ['loading', 'Đang tải'], ['empty', 'Không vi phạm'], ['error', 'Lỗi']], s => {
  closeDrawer(true); closeModal(true);
  reset({ gsht: { gsht: true }, loading: { loading: true }, empty: { empty: true }, error: { error: true } }[s]); render();
  if (s === 'drawer') openDrawer('Đặng Quang Vinh');
  if (s === 'export') openExport();
});
</script>
