<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nhập dữ liệu từ Excel · Đội Xe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700&family=Inter:wght@400;500;600;700&display=swap&subset=vietnamese">
<link rel="stylesheet" href="../assets/css/app.css">
<style>
  [hidden] { display: none !important; }
  .stepper { display: flex; align-items: center; gap: 0; padding: 2px 0; }
  .stepper button { border: 0; background: none; display: flex; align-items: center; gap: 8px; font: 500 13.5px var(--font-body); color: var(--fg-muted); padding: 4px 6px; border-radius: var(--r-sm); cursor: default; white-space: nowrap; }
  .stepper button .n { width: 24px; height: 24px; border-radius: 50%; background: var(--surface); box-shadow: inset 0 0 0 1px var(--border-strong); display: grid; place-items: center; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stepper button.done { color: var(--fg); cursor: pointer; }
  .stepper button.done:hover { background: var(--surface-muted); }
  .stepper button.done .n { background: var(--success-soft); box-shadow: none; color: var(--success-fg); }
  .stepper button.cur { color: var(--primary); font-weight: 600; }
  .stepper button.cur .n { background: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); color: var(--on-primary); }
  .stepper .line { flex: 1; height: 2px; border-radius: 1px; background: var(--border); margin: 0 12px; min-width: 24px; }
  .stepper .line.done { background: var(--success-solid); }
  .s1 { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: var(--s-4); align-items: stretch; }
  .s1 > .card { display: flex; flex-direction: column; min-width: 0; }
  .s1 > .card > .card-body { flex: 1; }
  .rcards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .rc { border: 1px solid var(--border); border-radius: var(--r-md); padding: 10px 12px; display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 2px 8px; cursor: pointer; font-size: 13.5px; background: var(--surface); }
  .rc input { margin: 2px 0 0; accent-color: var(--primary); }
  .rc b { font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .rc small { grid-column: 2; color: var(--fg-muted); font-size: 12.5px; line-height: 16px; }
  .rc:hover { border-color: var(--border-strong); }
  .rc:has(input:checked) { border-color: var(--primary); background: var(--primary-soft); box-shadow: inset 0 0 0 1px var(--primary); }
  .drop { border: 1.5px dashed var(--border-strong); border-radius: var(--r-lg); background: var(--surface-muted); padding: 32px 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; transition: border-color .12s, background-color .12s; }
  .drop.over { border-color: var(--primary); background: var(--primary-soft); }
  .drop > .icon { width: 36px; height: 36px; stroke-width: 1.25; color: var(--fg-muted); }
  .drop.err { border: 0; padding: 0; background: none; }
  .filechip { display: flex; align-items: center; gap: 10px; border: 0; border-radius: 8px; padding: 10px 12px; background: var(--surface-muted); }
  .filechip .ficon { width: 34px; height: 34px; border-radius: var(--r-md); background: var(--success-soft); color: var(--success-fg); display: grid; place-items: center; }
  .exits a, .exits button { justify-content: flex-start; align-items: flex-start; width: 100%; height: auto; padding: 10px; border-radius: 8px; text-align: left; white-space: normal; line-height: 18px; }
  .exits .icon { margin-top: 1px; flex: none; }
  .exits .cell-sub { font-weight: 400; color: var(--fg-muted); margin-top: 2px; }
  .field .input { width: 100%; }
  .map td { padding: 6px 12px; height: 58px; }
  .map td.samples { color: var(--fg-muted); font-size: 12.5px; }
  .map .samples .code { color: var(--fg); background: var(--surface-muted); border: 0; border-radius: var(--r-sm); padding: 1px 6px; margin-right: 4px; font-size: 12px; font-weight: 500; }
  .map select.input { width: 240px; height: 30px; }
  .map tr.need td:first-child { box-shadow: inset 3px 0 0 var(--warning-solid); }
  .map tr.dupmap select { border-color: var(--danger-solid); }
  .pv-wrap { max-height: calc(100vh - 380px); min-height: 280px; overflow: auto; }
  .pv td { height: 62px; padding: 6px 10px; vertical-align: middle; }
  .pv th { padding-left: 10px; padding-right: 10px; }
  .pv .cell-in { width: 116px; }
  .pv th:nth-child(1), .pv td:nth-child(1) { position: sticky; left: 0; z-index: 1; width: 64px; }
  .pv th:nth-child(2), .pv td:nth-child(2) { position: sticky; left: 64px; z-index: 1; box-shadow: inset -1px 0 0 var(--border); }
  .pv th:nth-child(1), .pv th:nth-child(2) { z-index: 3; }
  .pv td:nth-child(1), .pv td:nth-child(2) { background: var(--surface); }
  .pv tr:hover td { background: var(--surface-muted); }
  .cellv { display: inline-block; min-width: 72px; border: 1px solid transparent; border-radius: var(--r-sm); padding: 2px 6px; margin: 0 -6px; cursor: text; min-height: 24px; line-height: 20px; }
  .cellv:hover { border-color: var(--border-strong); background: var(--surface); }
  .cellv.bad { border-color: var(--danger-solid); background: var(--surface); color: var(--danger-fg); }
  .cellv.empty-v { color: var(--fg-subtle); font-style: italic; }
  .pv .cell-in { height: 28px; width: 130px; border: 1px solid var(--primary); border-radius: var(--r-sm); padding: 0 6px; font: 13.5px var(--font-body); outline: 2px solid var(--ring); outline-offset: 1px; }
  .pv .cell-in.bad { border-color: var(--danger-solid); outline-color: var(--danger-solid); }
  .emsg { display: flex; align-items: flex-start; gap: 4px; font-size: 11.5px; line-height: 14px; color: var(--danger-fg); margin-top: 2px; white-space: normal; max-width: 170px; }
  .emsg .icon { margin-top: 1px; flex: none; }
  .pv td:nth-child(3) { min-width: 116px; }
  .pv td.right .emsg { display: block; margin-left: auto; text-align: right; }
  .pv td.right .emsg .icon { display: inline-block; vertical-align: -2px; margin: 0 3px 0 0; }
  .emsg .icon { width: 12px; height: 12px; }
  .xb { display: flex; align-items: center; gap: 3px; font-size: 11.5px; line-height: 15px; margin-top: 2px; white-space: nowrap; }
  .xb .icon { width: 12px; height: 12px; }
  .xb.d { color: var(--danger-fg); } .xb.w { color: var(--warning-fg); }
  .pv select.input { height: 30px; width: 170px; }
  .gridfoot { padding: 12px 16px 14px; }
  .manual td { padding: 6px 8px; vertical-align: top; }
  .manual .input { height: 30px; width: 100%; }
  .manual .input.bad { border-color: var(--danger-solid); }
  .footbar { position: sticky; bottom: 0; z-index: 15; margin: 0 calc(-1 * var(--s-6)) calc(-1 * var(--s-6)); padding: 12px var(--s-6); background: var(--bg); border-top: 1px solid transparent; display: flex; gap: 8px; align-items: center; justify-content: flex-end; transition: border-color var(--d-2, 180ms), background-color var(--d-2, 180ms); }
  .footbar.stuck { border-top-color: var(--border); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: saturate(1.2) blur(8px); }
  .summary { display: grid; grid-template-columns: minmax(300px, 1.6fr) repeat(3, minmax(0, 1fr)); gap: 6px; padding: 6px; background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-card); }
  .sum-main { padding: 18px 22px; background: var(--primary-soft); border-radius: 8px; display: flex; flex-direction: column; gap: 4px; }
  .sum-main .k { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--side-active); }
  .sum-main .v { font: 700 var(--text-display)/40px var(--font-display); color: var(--fg-strong); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .sum-main .v small, .sum-item .v small { font: 600 15px var(--font-body); color: var(--fg-muted); margin-left: 2px; }
  .sum-main .d { font-size: 12.5px; color: var(--fg-muted); }
  .sum-item { padding: 18px 16px; display: flex; flex-direction: column; justify-content: center; gap: 4px; min-width: 0; border: 0; background: none; border-radius: 8px; text-align: left; font: inherit; color: inherit; }
  button.sum-item { cursor: pointer; }
  button.sum-item:hover { background: var(--surface-muted); }
  .sum-item .k { font-size: 12.5px; color: var(--fg-muted); font-weight: 500; }
  .sum-item .v { font: 700 24px/30px var(--font-display); color: var(--fg-strong); font-variant-numeric: tabular-nums; }
  .sum-item .d { font-size: 12.5px; color: var(--fg-muted); display: inline-flex; gap: 4px; align-items: center; }
  .sum-item.is-err .v { color: var(--danger-fg); }
  .sum-item.is-err .d { color: var(--primary); font-weight: 500; }
  #app-content > * { flex: none; }
  @media (max-width: 1100px) { .s1 { grid-template-columns: 1fr; } .rcards { grid-template-columns: repeat(2, minmax(0, 1fr)); } .summary { grid-template-columns: repeat(3, minmax(0, 1fr)); } .sum-main { grid-column: 1 / -1; } }
</style>
</head>
<body>
<div id="app-content">
  <div class="page-header">
    <div>
      <div class="crumb" id="crumb">Đội xe / Nhập dữ liệu</div>
      <h1>Nhập dữ liệu từ Excel</h1>
    </div>
    <div class="actions"><button class="btn btn-secondary" type="button" id="btnExit">${'Thoát'}</button></div>
  </div>
  <nav class="stepper" id="stepper" aria-label="Các bước nhập dữ liệu"></nav>
  <div id="stepBody" class="stack" style="gap:16px"></div>
  <div class="footbar" id="footbar"></div>
</div>

<script src="../assets/js/shell.js"></script>
<script src="../assets/js/data.js"></script>
<script>
const { icon, fmt, toast } = Shell;
Shell.mount({ active: 'FM_14', title: 'Nhập dữ liệu từ Excel' });
document.getElementById('btnExit').textContent = 'Thoát';
const NA = 'href="javascript:void(0)" title="chưa có trong prototype"';
const $ = id => document.getElementById(id);
const TODAY = new Date(2026, 10, 12);

const TYPES = [
  ['vehicle', 'Xe & rơ-moóc', 'Biển số, loại xe, tải trọng, hạn đăng kiểm, bảo hiểm, phù hiệu', 'truck'],
  ['driver', 'Tài xế', 'Họ tên, SĐT, hạng GPLX, hạn bằng lái', 'user'],
  ['doc', 'Giấy tờ', 'Chủ thể, loại giấy tờ, số, ngày hết hạn', 'doc'],
  ['customer', 'Khách hàng', 'Tên, MST, địa chỉ, người liên hệ', 'users'],
  ['place', 'Địa điểm', 'Kho, cảng, depot, toạ độ', 'map'],
  ['route', 'Tuyến đường', 'Điểm đầu, điểm cuối, km chuẩn, trạm thu phí', 'route']
];
const SHEETS = [['DS xe 2026', 126], ['Mooc', 40], ['Tài xế', 31]];
const FIELDS = ['Biển số', 'Loại xe', 'Tải trọng (tấn)', 'Hạn đăng kiểm', 'Hạn bảo hiểm', 'Hạn phù hiệu', 'Nhãn hiệu', 'Năm sản xuất', 'Số khung', 'Tài xế thường lái', 'Chi nhánh'];
const REQUIRED = ['Biển số', 'Loại xe', 'Tải trọng (tấn)'];
const COLS0 = [
  ['BKS', ['51C12345', '51C 678.90'], 'Biển số'],
  ['Kiểu xe', ['Đầu kéo', 'Xe tải'], ''],
  ['Trọng tải', ['30', '15'], 'Tải trọng (tấn)'],
  ['Hạn ĐK', ['15/03/2027', '46100'], 'Hạn đăng kiểm', 'Định dạng ngày: dd/mm/yyyy và số ngày Excel'],
  ['Hạn BH', ['02/11/2026', '12/25/2027'], 'Hạn bảo hiểm', 'Định dạng ngày: dd/mm/yyyy'],
  ['Hạn phù hiệu', ['20/12/2026', '30/06/2027'], 'Hạn phù hiệu', 'Định dạng ngày: dd/mm/yyyy'],
  ['Nhãn hiệu', ['Hyundai', 'Hino'], 'Nhãn hiệu'],
  ['Năm SX', ['2019', '2021'], 'Năm sản xuất'],
  ['Số khung', ['KMFGA17PPLC0…', 'JHDFG8JN…'], 'Số khung'],
  ['Tên tài xế', ['Nguyễn Văn Tuấn', 'Lê Hoàng Phúc'], ''],
  ['Ghi chú', ['Xe mới thay lốp', '—'], '__skip']
];
const ROWS0 = [
  [12, '51C12345', 'Đầu kéo', '30', '15/03/2027', '02/11/2026', '20/12/2026'],
  [13, '51C-602.17', 'Đầu kéo', '30', '08/06/2027', '14/01/2027', '30/06/2027'],
  [14, '51D 456.78', 'Đầu kéo', '30', '19/01/2027', '22/02/2027', '15/04/2027'],
  [15, '51C-618.40', 'Xe tải', '15', '21/11/2026', '05/05/2027', '12/08/2027'],
  [18, '51C-745.12', 'Đầu kéo', '30', '31/02/2027', '11/03/2027', '30/09/2027'],
  [19, '61C-118.56', 'Đầu kéo', '30', '46100', '18/07/2027', '18/07/2027'],
  [23, '51D-233.09', '', '15', '02/04/2027', '09/12/2026', '09/12/2026'],
  [27, '51C-099.21', 'Đầu kéo', '30', '02/11/2026', '25/04/2027', '25/04/2027'],
  [31, '51C-820.33', 'Đầu kéo', '30', '17/05/2027', '04/11/2026', '10/10/2027'],
  [45, '51C-588.02', 'Xe tải', '15', '13/02/2027', '13/02/2027', '13/02/2027'],
  [52, '51D-517.64', 'Xe tải', 'ba mươi', '06/09/2027', '06/09/2027', '06/09/2027'],
  [58, '61C 220.14', 'Đầu kéo', '30', '28/12/2026', '28/12/2026', '28/12/2026'],
  [67, '51C 588.02', 'Xe tải', '15', '13/02/2027', '13/02/2027', '13/02/2027'],
  [71, '51C-904.28', 'Đầu kéo', '30', '01/08/2027', '12/25/2027', '01/08/2027'],
  [88, '50H-112.07', '', '15', '30/02/2027', '19/06/2027', '19/06/2027'],
  [103, '51C12', 'Đầu kéo', '30', '03/03/2027', '03/03/2027', '03/03/2027'],
  [104, '51C-377.91', 'Đầu kéo', '30', '27/11/2026', '14/09/2027', '14/09/2027'],
  [109, '51D-640.25', 'Xe tải', '15', '11/10/2027', '11/10/2027', '11/10/2027']
];
const TOTAL = 126, HIDDEN_VALID = TOTAL - ROWS0.length;
const EXISTING = new Set(FM.vehicles.map(v => v.plate));

let S;
function reset() {
  S = { step: 1, type: 'vehicle', branch: 'TP.HCM', file: null, sheet: 'DS xe 2026', fileErr: false, readErr: false, sheetEmpty: false, loading: false,
    cols: COLS0.map(c => ({ name: c[0], samples: c[1], field: c[2], hint: c[3], auto: !!c[2] })), dateMode: null,
    rows: ROWS0.map(r => ({ r: r[0], plate: r[1], type: r[2], cap: r[3], dk: r[4], bh: r[5], ph: r[6], action: 'skip' })),
    filter: 'all', editing: null, manual: null, bigImport: false, importing: false, result: null };
}

/* ---------- Validation ---------- */
function normPlate(v) { const x = String(v || '').replace(/[\s.\-]/g, '').toUpperCase(); const m = x.match(/^(\d{2}[A-Z]{1,2})(\d{3})(\d{2})$/); if (m) return `${m[1]}-${m[2]}.${m[3]}`; const m4 = x.match(/^(\d{2}[A-Z]{1,2})(\d{4})$/); return m4 ? `${m4[1]}-${m4[2]}` : null; }
function parseDate(v, md) {
  v = String(v || '').trim(); if (!v) return { empty: true };
  if (/^\d{5}$/.test(v)) { const d = new Date(1899, 11, 30); d.setDate(d.getDate() + +v); return { d }; }
  const m = v.match(/^(\d{1,4})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/); if (!m) return { err: `Ngày '${v}' không đúng định dạng` };
  let a = +m[1], b = +m[2], y = +m[3];
  if (m[1].length === 4) { y = a; a = +m[3]; }
  if (y < 100) y += 2000;
  let day = md ? b : a, mon = md ? a : b;
  if (mon > 12 || mon < 1) return { err: `Ngày '${v}' không tồn tại (tháng ${mon})` };
  const d = new Date(y, mon - 1, day);
  if (d.getMonth() !== mon - 1) return { err: `Ngày '${v}' không tồn tại` };
  return { d };
}
const fmtD = d => `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
function validate(row, idx) {
  const e = {};
  const p = normPlate(row.plate);
  if (!row.plate) e.plate = 'Thiếu Biển số';
  else if (!p) e.plate = `Biển số '${row.plate}' không đúng định dạng`;
  else { const first = S.rows.findIndex((x, i) => i < idx && normPlate(x.plate) === p); if (first >= 0) e.plate = `Biển số trùng với dòng ${S.rows[first].r}`; }
  if (!row.type) e.type = 'Thiếu Loại xe'; else if (!['Đầu kéo', 'Xe tải'].includes(row.type)) e.type = `Loại xe '${row.type}' không có trong danh mục`;
  const c = parseFloat(String(row.cap).replace(',', '.'));
  if (!row.cap) e.cap = 'Thiếu Tải trọng'; else if (isNaN(c) || !/^[\d.,]+$/.test(row.cap)) e.cap = `Tải trọng '${row.cap}' không phải số`;
  const dates = {};
  [['dk', false], ['bh', S.dateMode === 'md'], ['ph', false]].forEach(([k, md]) => { const r = parseDate(row[k], md); if (r.err) e[k] = r.err; else dates[k] = r.d; });
  const n = Object.keys(e).length;
  return { e, n, plate: p, dates, dup: !n && p && EXISTING.has(p) };
}
function stats() {
  const v = S.rows.map((r, i) => validate(r, i));
  const err = v.filter(x => x.n).length, dup = v.filter(x => x.dup).length;
  const valid = TOTAL - err - dup;
  const upd = S.rows.filter((r, i) => v[i].dup && r.action === 'update').length;
  return { v, err, dup, valid, upd, importN: valid + upd };
}
function expBadge(d) {
  if (!d) return '';
  const days = Math.round((d - TODAY) / 864e5);
  if (days < 0) return `<span class="xb d">${icon('block')}Quá hạn ${-days} ngày</span>`;
  if (days <= 30) return `<span class="xb w">${icon('warn')}Còn ${days} ngày</span>`;
  return '';
}

/* ---------- Stepper & frame ---------- */
const STEPS = ['Chọn file', 'Ghép cột', 'Xem trước & sửa', 'Kết quả'];
function renderStepper() {
  $('stepper').innerHTML = STEPS.map((t, i) => {
    const n = i + 1, cls = n < S.step ? 'done' : n === S.step ? 'cur' : '';
    return `${i ? `<span class="line ${n <= S.step ? 'done' : ''}"></span>` : ''}<button type="button" class="${cls}" ${n < S.step && S.step < 4 ? `data-go="${n}"` : 'tabindex="-1"'} ${n === S.step ? 'aria-current="step"' : ''}><span class="n">${n < S.step ? icon('check') : n}</span>${t}</button>`;
  }).join('');
  $('stepper').querySelectorAll('[data-go]').forEach(b => b.onclick = () => { S.step = +b.dataset.go; render(); });
}
function render() {
  renderStepper();
  [step1, step2, step3, step4][S.step - 1]();
}
function foot(html) { $('footbar').innerHTML = html; requestAnimationFrame(syncFoot); }
function syncFoot() { const se = document.scrollingElement; $('footbar').classList.toggle('stuck', se.scrollHeight - se.scrollTop - se.clientHeight > 2); }
addEventListener('scroll', syncFoot, { passive: true }); addEventListener('resize', syncFoot);

/* ---------- Bước 1 ---------- */
function step1() {
  const t = TYPES.find(x => x[0] === S.type);
  let zone;
  if (S.readErr) zone = `<div class="drop err"><div class="alert alert-danger" role="alert" style="width:100%;text-align:left">${icon('block')}<div>Không đọc được file '<b>DS xe.xlsx</b>'. File có thể đang đặt mật khẩu hoặc bị hỏng.</div><div class="alert-actions"><button class="btn btn-secondary btn-sm" type="button" id="pickAgain">Chọn file khác</button><button class="btn btn-ghost btn-sm" type="button" data-support>Gửi file nhờ hỗ trợ</button></div></div></div>`;
  else if (S.fileErr) zone = dropHtml(`<div class="alert alert-danger" role="alert" style="text-align:left">${icon('block')}<div>File '<b>${S.fileErr}</b>' không phải Excel hoặc CSV. Chọn file .xlsx, .xls hoặc .csv.</div></div>`);
  else if (S.file) {
    const sh = SHEETS.find(s => s[0] === S.sheet);
    zone = `<div class="stack" style="gap:12px"><div class="filechip"><span class="ficon">${icon('doc', 'lg')}</span><div class="grow"><b>${S.file}</b><span class="cell-sub">${SHEETS.length} sheet · 84 KB · tải lên lúc 08:51</span></div><button class="btn btn-ghost btn-sm" type="button" id="removeFile">${icon('x')}Bỏ file</button></div>

      const inp = k === 'type' ? `<select class="input ${e ? 'bad' : ''}" data-m="${i}" data-k="${k}"><option value="">Chọn…</option><option ${r.type === 'Đầu kéo' ? 'selected' : ''}>Đầu kéo</option><option ${r.type === 'Xe tải' ? 'selected' : ''}>Xe tải</option></select>`
        : `<input class="input ${k === 'cap' ? 'num right' : k === 'plate' ? 'code' : 'num'} ${e ? 'bad' : ''}" data-m="${i}" data-k="${k}" value="${r[k]}" placeholder="${k === 'plate' ? 'VD: 51C-123.45' : k === 'cap' ? '0' : 'dd/mm/yyyy'}">`;
      return `<td>${inp}${e ? `<span class="emsg">${icon('block')}${e}</span>` : ''}</td>`; }).join('')}</tr>`).join('')}</tbody></table></div>
    <div class="card-body" style="padding-top:10px"><button class="btn btn-ghost btn-sm" type="button" id="addRow">${icon('plus')}Thêm dòng</button></div></section>`;
  document.querySelectorAll('[data-m]').forEach(inp => {
    inp.onchange = () => { const r = rows[+inp.dataset.m]; r[inp.dataset.k] = inp.value.trim(); r.touched[inp.dataset.k] = true; if (inp.dataset.k === 'plate' && normPlate(r.plate)) r.plate = normPlate(r.plate); const at = [inp.dataset.m, inp.dataset.k]; step3manual(); const nx = document.querySelector(`[data-m="${at[0]}"][data-k="${at[1]}"]`); };
    inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); inp.dispatchEvent(new Event('change')); const n = document.querySelector(`[data-m="${+inp.dataset.m + 1}"][data-k="${inp.dataset.k}"]`); if (n) n.focus(); } };
  });
  $('addRow').onclick = () => { rows.push({ plate: '', type: '', cap: '', dk: '', bh: '', ph: '', touched: {} }); step3manual(); };
  foot(`<button class="btn btn-ghost" type="button" id="backM" style="margin-right:auto">Quay lại chọn file</button><span class="sm muted">${okN} dòng hợp lệ</span><button class="btn btn-primary" type="button" id="doImportM" ${okN ? '' : 'disabled'}>Nhập ${okN} xe</button>`);
  $('backM').onclick = () => { S.manual = null; S.step = 1; render(); };
  $('doImportM').onclick = () => { S.result = { ins: okN, upd: 0, skip: 0, err: 0, manual: true }; S.step = 4; render(); };
}

/* ---------- Bước 4: Kết quả ---------- */
function step4() {
  const r = S.result || { ins: 115, upd: 4, skip: 0, err: 7 };
  const next = { vehicle: ['driver', 'Tài xế'], driver: ['doc', 'Giấy tờ'], doc: ['customer', 'Khách hàng'] }[S.type] || ['driver', 'Tài xế'];
  $('stepBody').innerHTML = `
    <div class="alert alert-success" role="status">${icon('check')}<div>Đã nhập xong dữ liệu ${TYPES.find(t => t[0] === S.type)[1].toLowerCase()} vào chi nhánh TP.HCM lúc 08:58 12/11/2026.</div></div>
    <div class="summary" aria-label="Kết quả nhập">
      <div class="sum-main"><span class="k">Đã nhập mới</span><span class="v">${r.ins}<small>xe</small></span><span class="d">Tạo mới trong danh sách xe chi nhánh TP.HCM</span></div>
      <div class="sum-item"><span class="k">Đã cập nhật</span><span class="v">${r.upd}<small>xe</small></span><span class="d">Trùng biển số, chọn Cập nhật</span></div>
      <div class="sum-item"><span class="k">Bỏ qua</span><span class="v">${r.skip}</span><span class="d">Trùng biển số, chọn Bỏ qua</span></div>
      ${r.err ? `<button class="sum-item is-err" type="button" id="kErr"><span class="k">Lỗi chưa sửa</span><span class="v">${r.err}<small>dòng</small></span><span class="d">${icon('download')}Tải file lỗi</span></button>` : `<div class="sum-item"><span class="k">Lỗi chưa sửa</span><span class="v">0</span><span class="d">Không có dòng lỗi</span></div>`}
    </div>
    ${r.manual ? '' : `<div class="alert alert-warning" role="alert">${icon('doc')}<div>Trong dữ liệu vừa nhập có <b>3 giấy tờ quá hạn</b> và <b>7 giấy tờ hết hạn trong 30 ngày</b>. Xe có giấy tờ quá hạn sẽ không gán được chuyến.</div><div class="alert-actions"><a class="btn btn-secondary btn-sm" ${NA}>Xem giấy tờ</a></div></div>`}
    <p class="sm muted">Xe nhập từ file chưa gắn thiết bị GSHT. Gắn thiết bị ở Cài đặt → Kết nối GSHT.</p>`;
  const k = $('kErr'); if (k) k.onclick = () => toast(`Đã tải "DS xe 2026 - loi.xlsx" (${r.err} dòng)`);
  foot(`<button class="btn btn-secondary" type="button" id="nextType" style="margin-left:auto">Nhập tiếp ${next[1]}</button><a class="btn btn-primary" href="fm-04-tong-quan.html#onboarding">Về Tổng quan</a>`);
  $('nextType').onclick = () => { const t = S.type; reset(); S.type = next[0]; render(); toast(`Đã chọn sẵn loại "${next[1]}"`); };
}

/* ---------- Modals ---------- */
function modal(html, onOk) {
  const s = document.createElement('div'); s.className = 'scrim modal-scrim';
  const m = document.createElement('div'); m.className = 'modal'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true');
  m.innerHTML = html; document.body.append(s, m);
  const close = () => { Shell.dismiss(s); Shell.dismiss(m); };
  m.querySelector('[data-x]').onclick = close; s.onclick = close; m.querySelector('[data-ok]').onclick = () => { onOk(m); close(); };
  (m.querySelector('textarea') || m.querySelector('[data-x]')).focus();
  return close;
}
function supportModal() {
  modal(`<h2>Gửi file cho đội hỗ trợ nhập giúp?</h2><p class="muted">Đội hỗ trợ sẽ nhập file '<b>${S.file || 'DS xe 2026.xlsx'}</b>' vào chi nhánh TP.HCM và gọi lại cho bạn qua số <span class="num">0903 xxx 128</span> trong 1 ngày làm việc.</p>
    <label class="field"><span>Ghi chú cho đội hỗ trợ (không bắt buộc)</span><textarea class="input" rows="3" placeholder="VD: Sheet Mooc ghép theo biển số đầu kéo ở cột B"></textarea></label>
    <div class="row" style="justify-content:flex-end"><button class="btn btn-secondary" type="button" data-x>Quay lại</button><button class="btn btn-primary" type="button" data-ok>Gửi file</button></div>`, () => toast('Đã gửi file. Đội hỗ trợ sẽ liên hệ trong 1 ngày làm việc.'));
}
$('btnExit').onclick = () => {
  if (S.step === 2 || S.step === 3) modal(`<h2>Thoát khi chưa nhập xong?</h2><p class="muted">Các chỉnh sửa trên lưới xem trước sẽ mất. Mapping cột đã được lưu.</p><div class="row" style="justify-content:flex-end"><button class="btn btn-secondary" type="button" data-x>Ở lại</button><button class="btn btn-danger" type="button" data-ok>Thoát</button></div>`, () => location.href = 'fm-04-tong-quan.html');
  else location.href = 'fm-04-tong-quan.html';
};
document.addEventListener('keydown', e => { if (e.key === 'Escape') { const m = document.querySelector('.modal:not(.leaving)'); if (m) { Shell.dismiss(m); Shell.dismiss(document.querySelector('.modal-scrim:not(.leaving)')); } } });

/* ---------- Prototype states ---------- */
Shell.states([['default', 'Mặc định'], ['sheets', 'Nhiều sheet'], ['mapping', 'Ghép cột'], ['preview', 'Xem trước có lỗi'], ['manual', 'Nhập tay nhanh'], ['big', 'Đang nhập (file lớn)'], ['loading', 'Đang đọc file'], ['success', 'Kết quả'], ['empty', 'Sheet trống'], ['error', 'Lỗi đọc file']], st => {
  document.querySelectorAll('.modal:not(.leaving), .modal-scrim:not(.leaving)').forEach(x => Shell.dismiss(x));
  reset();
  if (st !== 'default' && st !== 'error') S.file = 'DS xe 2026.xlsx';
  if (st === 'mapping') S.step = 2;
  if (st === 'loading') { S.step = 2; S.loading = true; }
  if (st === 'preview') { S.step = 3; S.dateMode = 'dm'; S.cols[1].field = 'Loại xe'; S.cols[9].field = '__skip'; S.filter = 'error'; S.editing = { i: 4, k: 'dk' }; }
  if (st === 'big') { S.step = 3; S.dateMode = 'dm'; S.cols[1].field = 'Loại xe'; S.cols[9].field = '__skip'; S.bigImport = true; }
  if (st === 'manual') { S.step = 3; S.manual = blankManual(); Object.assign(S.manual[0], { plate: '51C-602.17', type: 'Đầu kéo', cap: '30', dk: '08/06/2027', bh: '14/01/2027', ph: '30/06/2027' }); Object.assign(S.manual[1], { plate: '51D-233.09', type: 'Xe tải', cap: '15', dk: '02/04/2027', bh: '09/12/2026', ph: '' }); }
  if (st === 'success') { S.step = 4; S.result = { ins: 115, upd: 4, skip: 0, err: 7 }; }
  if (st === 'empty') { S.sheet = 'Mooc'; S.sheetEmpty = true; }
  if (st === 'error') S.readErr = true;
  render();
});
</script>
