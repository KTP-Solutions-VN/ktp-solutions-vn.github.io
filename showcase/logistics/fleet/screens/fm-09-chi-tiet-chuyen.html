function actByCat() { const a = { fuel: 0, toll: 0, lift: 0, salary: 0, other: 0 }; T.lines.forEach(l => a[l.cat] += +l.amt); return a; }
function calc() {
  const rev = T.rev.reduce((s, r) => s + r[1], 0);

}

    ${row('Tổng chi phí biến đổi', c.est, c.act, { cost: 1, cls: 'sub', eTip: 'Dầu + phí cầu đường + nâng hạ + lương chuyến + bốc xếp & khác', aTip: `Tổng ${T.lines.length} dòng chi phí = <span class="formula">${V(c.act)} đ</span>` })}
    ${row('Lãi gộp chuyến', c.gE, c.gA, { cls: alloc ? 'sub' : 'res', eP: P(c.gE, c.rev), aP: P(c.gA, c.rev), eTip: `Doanh thu <span class="formula">${V(c.rev)}</span> − chi phí biến đổi <span class="formula">${V(c.est)}</span> = <span class="formula">${V(c.gE)} đ</span>`, aTip: `Doanh thu <span class="formula">${V(c.rev)}</span> − chi phí biến đổi <span class="formula">${V(c.act)}</span> = <span class="formula">${V(c.gA)} đ</span>`, badge: !alloc && gLow ? lowBadge : '' })}
    ${alloc ? `<tr class="grp"><td colspan="4">Phân bổ</td></tr>

      ${row(`Chi phí cố định (${V(T.alloc.perKm)} đ/km)`, c.fixE, c.fixA, { cost: 1, eTip: `<span class="formula">${T.alloc.kmEst} km × ${V(T.alloc.perKm)} đ/km = ${V(c.fixE)} đ</span>`, aTip: `<span class="formula">${T.alloc.kmAct} km × ${V(T.alloc.perKm)} đ/km = ${V(c.fixA)} đ</span> (giá trị mặc định)` })}
      ${row('Lãi sau phân bổ', c.nE, c.nA, { cls: 'res', eP: P(c.nE, c.rev), aP: P(c.nA, c.rev), aPcls: nLow ? 'neg' : 'muted', eTip: `Lãi gộp <span class="formula">${V(c.gE)}</span> − khấu hao <span class="formula">${V(T.alloc.dep)}</span> − cố định <span class="formula">${V(c.fixE)}</span>`, aTip: `Lãi gộp <span class="formula">${V(c.gA)}</span> − khấu hao <span class="formula">${V(T.alloc.dep)}</span> − cố định <span class="formula">${V(c.fixA)}</span> = <span class="formula">${V(c.nA)} đ</span>`, badge: nLow ? lowBadge : '' })}` : ''}`;
  const ed = editable() && !run;
  p.innerHTML = `${summaryHtml()}${lockAlert}${multi}
  <section class="card" aria-label="Lãi lỗ chuyến">
    <div class="card-head pl-toolbar">
      <h2>Lãi/lỗ chuyến</h2>

      <span class="badge b-warning" tabindex="0" style="margin-left:auto" ${tip('Chi phí cố định/km và khấu hao/ngày chưa được chỉnh. Lãi sau phân bổ có thể chưa sát thực tế.')}>${icon('info')}Đang dùng giá trị mặc định — <a ${NA} style="color:inherit;text-decoration:underline">Cập nhật</a></span>
    </div>
    <div class="grid-wrap"><table class="pl"><colgroup><col class="c1"><col><col><col></colgroup>
      <thead><tr><th>Khoản</th><th>Dự toán</th><th>${actLbl}</th><th>Chênh lệch</th></tr></thead>
      <tbody>${body}</tbody></table></div>

      <tbody>${T.lines.map(l => `<tr data-line="${l.id}">
        <td><span class="src">${icon(SRC[l.src][0])}${SRC[l.src][1]}</span></td><td>${l.type}</td><td style="white-space:normal">${l.desc}</td>
        <td class="right num">${S.unlocked && l.src !== 'formula' ? `<input class="input amt-input num" value="${V(l.amt)}" data-amt="${l.id}" aria-label="Số tiền ${l.desc}">` : V(l.amt)}</td>
        <td>${l.doc ? `<button class="docbtn" type="button" data-view="${l.id}" aria-label="Xem chứng từ ${l.desc}">${icon(l.doc === 'img' ? 'camera' : 'doc')}${l.doc === 'img' ? 'Ảnh' : 'PDF'}</button>` : '<span class="muted">—</span>'}</td>

/* ---------- Tab: Chứng từ ---------- */
function paperHtml(d, line) {
  if (line && line.inv) return `<h4>${line.inv[0].split(' · ')[1] || 'Hoá đơn'}</h4><div class="muted" style="text-align:center;margin-bottom:6px">${line.inv[0].split(' · ')[0]}</div>${line.inv[1].map(([a, b]) => `<div class="ln"><span>${a}</span><span class="num">${b}</span></div>`).join('')}<div class="ln tot"><span>Thành tiền</span><span class="num">${V(line.inv[2])} đ</span></div><div class="sig"><span>Người mua: Cty Vận tải</span><span>Đã thu</span></div>`;
  if (!d) return '';
  if (d.f === 'pod') return `<h4>Biên bản giao nhận</h4><div class="ln"><span>Chuyến</span><span class="code">${T.id}</span></div><div class="ln"><span>Bên nhận</span><span>${T.id === 'CH-0458' ? 'Tân Cảng Logistics' : d.name.slice(-7)}</span></div><div class="ln"><span>Hàng</span><span class="num">${T.id === 'CH-0458' ? "1×40' · 24,5 tấn" : 'đủ, nguyên đai'}</span></div><div class="ln"><span>Giờ giao</span><span class="num">${d.at}</span></div><div class="sig"><span>Bên giao</span><span>Bên nhận</span></div><svg viewBox="0 0 220 40" width="100%" height="40" aria-label="Chữ ký"><path d="M8,30 C20,8 30,34 42,18 S60,26 70,14" stroke="var(--fg-muted)" fill="none" stroke-width="1.5"/><path d="M140,28 C150,6 162,32 172,16 S190,30 206,12" stroke="var(--primary)" fill="none" stroke-width="1.5"/></svg>`;
  if (d.f === 'gvt') return `<h4>Giấy vận tải</h4><div class="muted" style="text-align:center;margin-bottom:6px" class="code">${d.name}</div><div class="ln"><span>Xe</span><span class="code">${T.id === 'CH-0458' ? '51C-123.45' : '61C-245.18'}</span></div><div class="ln"><span>Tài xế</span><span>${T.id === 'CH-0458' ? 'Nguyễn Văn Tuấn' : 'Trần Văn Hùng'}</span></div><div class="ln"><span>Tuyến</span><span>${T.route.split(' → ')[0]} →</span></div><div class="ln"><span>Phát hành</span><span class="num">${d.at}</span></div><div class="sig"><span>Mã QR tra cứu</span><span>Hệ thống</span></div>`;
  if (d.f === 'eir') return `<h4>Phiếu EIR</h4><div class="ln"><span>Container</span><span class="code">TCLU 4421087</span></div><div class="ln"><span>Loại</span><span>40' HC</span></div><div class="ln"><span>Tình trạng</span><span>Tốt, không hư hỏng</span></div><div class="ln"><span>Thời điểm</span><span class="num">${d.at}</span></div><div class="sig"><span>Tài xế</span><span>Giám định viên</span></div>`;
  const l = T.lines.find(x => x.docId === d.id && x.inv); if (l) return paperHtml(null, l);
  return `<h4>Sao kê ETC</h4>${T.lines.filter(x => x.src === 'tray').map(x => `<div class="ln"><span>${x.desc}</span><span class="num">${V(x.amt)}</span></div>`).join('')}<div class="ln tot"><span>Tổng</span><span class="num">${V(T.lines.filter(x => x.src === 'tray').reduce((s, x) => s + x.amt, 0))} đ</span></div>`;
}
let zoom = 1, rot = 0;
function viewerBar() { return `<button class="icon-btn" type="button" data-z="-1" aria-label="Thu nhỏ">−</button><span class="num sm muted" style="min-width:40px;text-align:center">${Math.round(zoom * 100)}%</span><button class="icon-btn" type="button" data-z="1" aria-label="Phóng to">${icon('plus')}</button><button class="icon-btn" type="button" data-rot aria-label="Xoay">${icon('refresh')}</button>`; }
function bindViewer(root, rerender) {
  root.querySelectorAll('[data-z]').forEach(b => b.onclick = () => { zoom = Math.min(2, Math.max(.6, zoom + (+b.dataset.z) * .2)); rerender(); });
  root.querySelectorAll('[data-rot]').forEach(b => b.onclick = () => { rot = (rot + 90) % 360; rerender(); });
}
function renderDocs(p) {
  if (S.noDocs) { p.innerHTML = `<div class="card"><div class="empty">${icon('camera')}<h3>Chưa có chứng từ</h3><p>POD, EIR và hoá đơn chi phí sẽ hiện ở đây khi tài xế chụp trên app.</p></div></div>`; return; }
  const types = ['Tất cả', 'Giấy vận tải', 'POD', 'EIR', 'Hoá đơn chi phí'];
  const list = T.docs.filter(d => S.docF === 'Tất cả' || d.type.startsWith(S.docF));
  const sel = T.docs.find(d => d.id === S.docSel) || T.docs[0];
  p.innerHTML = `<div class="docs-split">
    <section class="card" aria-label="Danh sách chứng từ" style="min-width:0">
      <div class="card-head" style="flex-wrap:wrap">${types.map(t => `<button class="chip ${S.docF === t ? 'on' : ''}" type="button" data-df="${t}">${t}</button>`).join('')}<div class="tools"><button class="btn btn-secondary btn-sm" type="button" id="zipBtn">${icon('download')}Tải tất cả (.zip)</button></div></div>
      <div class="grid-wrap"><table class="grid"><thead><tr><th>Loại</th><th>Tên / số</th><th class="right">Thời điểm</th><th>Người tải lên</th><th>Trạng thái</th></tr></thead>
      <tbody>${list.map(d => `<tr class="clickable ${d.id === sel.id ? 'selected' : ''}" data-dsel="${d.id}" tabindex="0"><td>${d.type}</td><td class="dname" title="${d.name}">${d.f === 'gvt' || d.f === 'eir' ? `<span class="code">${d.name}</span>` : d.name}</td><td class="right num">${d.at}</td><td>${d.by}</td><td>${d.st}</td></tr>`).join('')}</tbody></table></div>
      <p class="sm muted" style="padding:12px 18px 16px;margin:auto 0 0">Giấy vận tải và các bản đã thay thế được lưu tối thiểu 3 năm, không xoá được.</p>
    </section>
    <section class="card viewer" aria-label="Xem chứng từ">
      <div class="card-head"><h2 style="font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${sel.type} · ${sel.name}</h2></div>
      <div class="paper-stage"><div class="paper" style="transform:scale(${zoom}) rotate(${rot}deg)">${paperHtml(sel)}</div></div>
      <div class="viewer-bar">${viewerBar()}<span style="flex:1"></span><button class="btn btn-secondary btn-sm" type="button" id="dlOne">${icon('download')}Tải về</button><button class="btn btn-secondary btn-sm" type="button" id="printOne">In</button></div>
    </section>
  </div>`;
  p.querySelectorAll('[data-df]').forEach(b => b.onclick = () => { S.docF = b.dataset.df; renderDocs(p); });
  p.querySelectorAll('[data-dsel]').forEach(r => { r.onclick = () => { S.docSel = r.dataset.dsel; renderDocs(p); }; r.onkeydown = e => { if (e.key === 'Enter') r.click(); }; });
  bindViewer(p, () => renderDocs(p));
  document.getElementById('zipBtn').onclick = () => toast(`Đang tạo file ${T.id}_chung-tu.zip (${T.docs.length} file)…`);
  document.getElementById('dlOne').onclick = () => toast(`Đã tải ${sel.name}`);
  document.getElementById('printOne').onclick = () => toast('Đã gửi lệnh in');
}

/* ---------- Drawer: xem chứng từ dòng chi phí (EL-28) ---------- */
function closeOverlays() { document.querySelectorAll('.drawer:not(.leaving), .scrim:not(.leaving), .modal:not(.leaving)').forEach(x => { x.removeAttribute('id'); Shell.dismiss(x); }); }
function openDocViewer(lineId) {
  closeOverlays(); zoom = 1; rot = 0;
  const withDoc = T.lines.filter(l => l.doc); let i = withDoc.findIndex(l => l.id === lineId);
  const s = document.createElement('div'); s.className = 'scrim'; s.onclick = closeOverlays;
  const d = document.createElement('aside'); d.className = 'drawer doc'; d.setAttribute('role', 'dialog'); d.setAttribute('aria-modal', 'true');
  document.body.append(s, d);
  const draw = () => { const l = withDoc[i]; const doc = T.docs.find(x => x.id === l.docId);
    d.innerHTML = `<div class="drawer-head"><div class="row"><h2>${l.inv ? l.inv[0] : doc.name} · <span class="num">${V(l.amt)} đ</span></h2><button class="icon-btn" id="dvClose" aria-label="Đóng (Esc)" style="margin-left:auto">${icon('x', 'lg')}</button></div><div class="row sm muted"><span class="src">${icon(SRC[l.src][0])}${SRC[l.src][1]}</span> · ${l.type} · ${l.desc}</div></div>
      <div class="drawer-body" style="padding:0"><div class="paper-stage" style="height:100%;min-height:420px"><div class="paper" style="transform:scale(${zoom}) rotate(${rot}deg)">${paperHtml(doc, l)}</div></div></div>
      <div class="drawer-foot" style="justify-content:space-between">${`<div class="row">${viewerBar()}</div>`}<div class="row"><button class="btn btn-secondary btn-sm" type="button" id="dvPrev" ${i === 0 ? 'disabled' : ''}>← Trước</button><span class="sm muted num">${i + 1}/${withDoc.length}</span><button class="btn btn-secondary btn-sm" type="button" id="dvNext" ${i === withDoc.length - 1 ? 'disabled' : ''}>Tiếp →</button></div></div>`;
    d.querySelector('#dvClose').onclick = closeOverlays; d.querySelector('#dvPrev').onclick = () => { i--; draw(); }; d.querySelector('#dvNext').onclick = () => { i++; draw(); }; bindViewer(d, draw); };
  draw(); d.querySelector('#dvClose').focus();
}

      <div class="kv">
        <div><h4><span class="pos">${icon('check')}</span>Khách thấy</h4><ul><li>Trạng thái mốc</li><li>Giờ dự kiến đến</li><li>POD khi hoàn thành</li></ul></div>
        <div><h4><span class="neg">${icon('block')}</span>Khách không thấy</h4><ul><li>Vị trí chính xác của xe</li><li>SĐT tài xế</li></ul></div>
      </div>
      <div class="row sm"><span class="muted">${icon('clock')}</span><span>Link hết hạn: 7 ngày sau khi chuyến hoàn thành (<b class="num">19/11/2026</b>)</span></div>
    </div>
    <div class="drawer-foot" style="justify-content:space-between"><a class="btn btn-ghost" ${NA}>${icon('external')}Xem như khách</a><button class="btn btn-danger" type="button" id="revoke" ${S.linkRevoked ? 'disabled' : ''}>Thu hồi link</button></div>`;
    d.querySelector('#shClose').onclick = closeOverlays;
    const cp = d.querySelector('#copyLink'); cp.onclick = () => { try { navigator.clipboard.writeText('https://theodoi.fleet.vn/t/8KQ2-X7PM'); } catch (e) {} toast('Đã sao chép link theo dõi'); };
    d.querySelector('#revoke').onclick = () => confirmModal('Thu hồi link theo dõi?', 'Khách đang giữ link sẽ không xem được nữa. Bạn có thể tạo link mới sau.', 'Thu hồi link', () => { S.linkRevoked = true; draw(); toast('Đã thu hồi link theo dõi'); }, true);
    const nl = d.querySelector('#newLink'); if (nl) nl.onclick = () => { S.linkRevoked = false; draw(); toast('Đã tạo link mới'); };

/* ---------- Modal ---------- */
function confirmModal(title, body, okLabel, onOk, keepDrawer) {
  const s = document.createElement('div'); s.className = 'scrim modal-scrim';
  const m = document.createElement('div'); m.className = 'modal'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true');
  m.innerHTML = `<h2>${title}</h2><p class="muted">${body}</p><div class="row" style="justify-content:flex-end"><button class="btn btn-secondary" type="button" data-x>Quay lại</button><button class="btn btn-danger" type="button" data-ok>${okLabel}</button></div>`;
  document.body.append(s, m); const close = () => { Shell.dismiss(s); Shell.dismiss(m); };
  m.querySelector('[data-x]').onclick = close; s.onclick = close; m.querySelector('[data-ok]').onclick = () => { close(); onOk(); }; m.querySelector('[data-x]').focus();
}
function openUnlock() {
  const s = document.createElement('div'); s.className = 'scrim modal-scrim';
  const m = document.createElement('div'); m.className = 'modal'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true'); m.setAttribute('aria-labelledby', 'ulT');
  m.innerHTML = `<h2 id="ulT">Mở khoá chi phí chuyến ${T.id}?</h2><p class="muted">P&amp;L của chuyến sẽ thay đổi trong các báo cáo đã xem. Thao tác này được ghi vào nhật ký hệ thống.</p>
    <label class="field"><span>Lý do mở khoá (bắt buộc)</span><textarea class="input" id="ulReason" rows="3" placeholder="Ví dụ: hoá đơn nâng hạ nhập sai số tiền"></textarea></label>
    <div class="row" style="justify-content:flex-end"><button class="btn btn-secondary" type="button" data-x>Quay lại</button><button class="btn btn-danger" type="button" id="ulOk" disabled>Mở khoá</button></div>`;
  document.body.append(s, m); const close = () => { Shell.dismiss(s); Shell.dismiss(m); };
  m.querySelector('[data-x]').onclick = close; s.onclick = close;
  const r = m.querySelector('#ulReason'), okb = m.querySelector('#ulOk'); r.oninput = () => okb.disabled = !r.value.trim(); r.focus();
  okb.onclick = () => { close(); S.unlocked = true; T.history.unshift(['16/11 09:12', 'Phạm Thu Hà (Kế toán trưởng)', 'Mở khoá chi phí: ' + r.value.trim(), 'cost', 3]); render(); toast('Đã mở khoá chi phí. Lý do đã được ghi vào lịch sử chuyến.'); };
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeOverlays(); });

/* ---------- Prototype states ---------- */
Shell.states([
  ['default', 'Mặc định'], ['running', 'Đang chạy'], ['done', 'Hoàn thành'], ['journey', 'Hành trình'], ['journey-nogsht', 'Không GSHT'],
  ['pl-gross', 'P&L lãi gộp'], ['pl-alloc', 'P&L sau phân bổ'], ['multi', 'Ghép nhiều đơn'], ['unlocked', 'Đã mở khoá'], ['docs', 'Chứng từ'],
  ['share', 'Chia sẻ link'], ['loading', 'Đang tải'], ['empty', 'Trống (chứng từ)'], ['error', 'Lỗi GSHT'], ['noperm', 'Không có quyền']
], s => {
  closeOverlays();
  const map = {
    default: {}, running: { status: 'running' }, done: { status: 'done' }, journey: { tab: 'journey' }, 'journey-nogsht': { tab: 'journey', gsht: false },
    'pl-gross': { tab: 'pl' }, 'pl-alloc': { tab: 'pl', mode: 'alloc' }, multi: { trip: 'CH-0471', status: 'done', tab: 'pl', docSel: 'e2' }, unlocked: { tab: 'pl', unlocked: true },
    docs: { tab: 'docs', docSel: 'd4' }, share: {}, loading: { loading: true }, empty: { tab: 'docs', status: 'accepted', noDocs: true }, error: { tab: 'journey', gshtError: true }, noperm: { noperm: true }
  };
  reset(map[s]);
  if (s === 'running') { /* giữ tab Tổng quan */ }
  render();
  if (s === 'share') openShare();
});
try { const t = new URL(location.href).searchParams.get('tab'); if (t && !location.hash && ['overview', 'journey', 'pl', 'docs'].includes(t)) setTab(t); } catch (e) {}
</script>
