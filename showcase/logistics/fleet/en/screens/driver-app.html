          <label class="app-field"><span>Note for the accountant${sh.sel.includes('other') ? ' (required)' : ''}</span><textarea class="app-input" id="disNote" placeholder="e.g. I paid the handling fee in cash">${esc(sh.note)}</textarea></label>
          ${sh.err ? `<p class="app-err" role="alert">${sh.err}</p>` : ''}
          <div class="app-btns"><button class="app-btn app-btn-primary" data-act="disSend">Send to accountant</button><button class="app-btn app-btn-secondary" data-act="close">Cancel</button></div>`;
      } else if (sh.kind === 'policy') {
        c = `<h2>Location data policy</h2>
          <h3>When it's collected</h3><p>Only while a trip is in progress — from "Start trip" to "Complete trip". Outside trips, the app doesn't collect your location.</p>
          <h3>What it's used for</h3><p>Auto-logging "Arrived…" milestones, showing the dispatcher where the truck is, and letting customers track only their own trip.</p>
          <h3>Who can see</h3><p>Minh Phát's dispatchers and branch managers. Every location view is logged.</p>
          <h3>How long it's kept</h3><p>Location: 12 months, then deleted automatically. Waybills and safety records: 3 years, as required by regulations.</p>
          <h3>Your rights</h3><p>Turn off sharing anytime in Account. To view or delete past data, contact your company admin.</p>
          <p class="app-note" style="text-align:left">Updated 01/11/2026</p><div class="app-btns"><button class="app-btn app-btn-primary" data-act="close">Got it</button></div>`;
      } else if (sh.kind === 'phone') {
        c = `<h2>Change phone number</h2><p>Your company admin needs to approve the new number. The admin will call your old number to confirm, then you log in with the new one.</p>
          <label class="app-field"><span>New number</span><input class="app-input app-phone" id="newPhone" type="tel" inputmode="numeric" maxlength="10" placeholder="0912 345 777" value="${esc(sh.val)}"></label>
          ${sh.err ? `<p class="app-err" role="alert">${sh.err}</p>` : ''}
          <div class="app-btns"><button class="app-btn app-btn-primary" data-act="phoneSend">Send request to admin</button><button class="app-btn app-btn-secondary" data-act="close">Cancel</button></div>`;
      } else if (sh.kind === 'payline') {
        const p = PAY.find(x => x.id === sh.id);
        c = `<h2>${p.id} · ${p.d}</h2><p class="muted">${p.route} · ${p.kind}</p>
          <div class="app-dl"><div><span>Basis</span><b>${p.how}</b></div><div><span>Settled</span><b>${p.st}/2026</b></div><div><span>Trip pay</span><b>${vnd(p.amt)}</b></div></div>
          <p class="app-note" style="text-align:left">Spot a mistake? Call the accountant before the period closes on 16/11.</p>
          <div class="app-btns"><button class="app-btn app-btn-primary" data-act="close">Close</button><button class="app-btn app-btn-secondary" data-act="call" data-arg="acc">${ic('call')}Call accountant</button></div>`;
      } else if (sh.kind === 'payadj') {
        const x = PAY_ADJ[sh.id];
        c = `<h2>${x.l} · ${x.k === 'plus' ? '+' : '−'} ${vnd(x.amt)}</h2><div class="app-reason ${x.k === 'plus' ? 'r-ok' : 'r-warn'}" style="margin-left:0">${x.why}</div>
          <div class="app-dl"><div><span>Recorded by</span><b>${x.by}</b></div><div><span>Period</span><b>01–15/11/2026</b></div></div>
          <div class="app-btns"><button class="app-btn app-btn-primary" data-act="close">Close</button><button class="app-btn app-btn-secondary" data-act="call" data-arg="acc">${ic('call')}Call accountant</button></div>`;
      } else if (sh.kind === 'period') {
        const p = PAY_HIST.find(x => x.id === sh.id);
        c = `<h2>${p.name}</h2><div>${badge('success', 'lock', 'Paid by transfer ' + p.paid)}</div>
          <div class="app-dl"><div><span>Trips</span><b>${p.trips}</b></div><div><span>Trip pay</span><b>${vnd(p.base)}</b></div><div><span>Bonus</span><b>+ ${vnd(p.plus)}</b></div><div><span>Deductions</span><b>${p.minus ? '− ' + vnd(p.minus) : '0 ₫'}</b></div><div><span>Net pay</span><b style="font-size:19px">${vnd(p.base + p.plus - p.minus)}</b></div><div><span>Closed</span><b>${p.close} · Khoa</b></div><div><span>Paid to</span><b>VCB ••••5821</b></div></div>
          ${p.minusWhy ? `<div class="app-reason r-warn" style="margin-left:0">${p.minusWhy}</div>` : ''}
          <div class="app-btns"><button class="app-btn app-btn-primary" data-act="close">Close</button><button class="app-btn app-btn-secondary" data-act="call" data-arg="acc">${ic('call')}Call accountant</button></div>`;
      }
      h += scrim + `<div class="app-sheet" role="dialog" aria-modal="true">${c}</div>`;
    }
    return h;
  }

  function undoBar() {
    const u = S.undo; if (!u || S.screen !== 'dr04') return '';
    const C = 2 * Math.PI * 11, off = C * (1 - u.left / 10);
    return `<div class="app-undo" role="status" data-key="${esc(u.trip + u.k + u.text)}">${ic(u.auto ? 'pin' : 'check')}<span class="app-ut">${u.text}</span><button data-act="undo"><svg class="app-ring" viewBox="0 0 28 28" aria-hidden="true"><circle class="bg" cx="14" cy="14" r="11"/><circle class="fg" cx="14" cy="14" r="11" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg><span class="app-ul">${u.auto ? 'Wrong? ' : ''}Undo (${u.left})</span></button></div>`;
  }
  /* Undo bar enters once, counts down in place, and leaves with an exit animation */
  function setUndo() {
    const host = document.getElementById('undo');
    const cur = host.querySelector('.app-undo:not(.leaving)');
    const u = S.undo, html = undoBar();
    if (!html) { if (cur) Shell.dismiss(cur); return; }
    const key = u.trip + u.k + u.text;
    if (cur && cur.dataset.key === key) {
      const C = 2 * Math.PI * 11;
      cur.querySelector('.app-ring .fg').setAttribute('stroke-dashoffset', C * (1 - u.left / 10));
      cur.querySelector('.app-ul').textContent = `${u.auto ? 'Wrong? ' : ''}Undo (${u.left})`;
      return;
    }
    if (cur) cur.remove();
    host.insertAdjacentHTML('beforeend', html);
  }
  /* Overlays: animate in when opened, out when closed; re-renders of an open overlay don't replay the entrance */
  function setLayer() {
    const host = document.getElementById('layer');
    const html = layer();
    const key = S.zoom ? 'zoom' : S.dlg ? 'd:' + S.dlg.kind : S.sheet ? 's:' + S.sheet.kind : '';
    if (html === lastLayerHTML && key === lastLayerKey) return;
    const old = Array.from(host.children).filter(el => !el.classList.contains('leaving'));
    if (!html) old.forEach(el => Shell.dismiss(el));
    else {
      const same = key === lastLayerKey, hadScrim = old.some(el => el.classList.contains('app-scrim'));
      old.forEach(el => el.remove());
      host.insertAdjacentHTML('beforeend', html);
      Array.from(host.children).forEach(el => {
        if (same || (hadScrim && el.classList.contains('app-scrim'))) el.classList.add('app-static');
      });
    }
    lastLayerKey = key; lastLayerHTML = html;
  }

  function lockLayer() {
    if (!locked()) return '';
    const run = Object.values(S.trips).find(t => t.step >= 1 && t.step <= 8);
    const note = { dr05: 'Photos you\'ve taken are kept.', dr06: 'The expense you\'re entering has been kept.', dr04: '"Arrived…" milestones still log automatically when the truck gets there.', dr07: 'Your draft incident report is kept. If it\'s urgent, call the dispatcher.' }[S.screen];
    return `<div class="app-lock" role="alertdialog" aria-label="Driving">
      <span class="app-speed">${ic('truck')}${S.speed > 10 ? 'Speed ' + S.speed + ' km/h' : 'Truck stopped'}</span>
      <div><div class="app-lk-t">You're driving</div><div class="app-lk-h">Stop the truck to use the app</div></div>
      ${run ? `<div class="app-lk-dest"><small>Heading to</small><b>${dest(run).short}</b><span>${run.id} · Step ${run.step + 1}/9: ${MS[run.step].next}</span></div>` : ''}
      ${note ? `<div class="app-lk-note">${ic('info')}${note}</div>` : ''}
      ${S.unlockLeft > 0 ? `<div class="app-unl">Truck stopped. Unlocking in ${S.unlockLeft} s…</div>` : ''}
      <button class="app-call" data-act="call">${ic('call')}Call dispatcher</button></div>`;
  }

  /* ================= Main render ================= */
  function render() {
    const scr = document.getElementById('screen');
    const dark = S.screen === 'dr05' && S.cam && !S.cam.pick && !S.cam.noperm;
    scr.classList.toggle('is-dark', !!dark);
    scr.classList.toggle('is-locked', locked());
    document.getElementById('sys').className = 'app-sys' + (dark || locked() ? ' is-dark' : '');
    document.getElementById('sys').innerHTML = `<span>${S.clock}</span><span class="app-sysr">${ic('signal')}${ic(S.offline ? 'noWifi' : 'wifi')}<span class="app-batt"><i></i></span></span>`;
    const view = document.getElementById('view');
    const swap = lastScreen && lastScreen !== S.screen; lastScreen = S.screen;
    view.className = 'app-view' + (dark ? ' is-dark' : '') + (swap ? ' swap' : '');
    view.innerHTML = { dr01: vDR01, dr02: vDR02, dr03: vDR03, dr04: vDR04, dr05: vDR05, dr06: vDR06, dr07: vDR07, dr08: vDR08, dr09: vDR09, dr10: vDR10, dr11: vDR11 }[S.screen]();
    setLayer();
    setUndo();
    document.getElementById('lock').innerHTML = lockLayer();
    const tb = ['dr03', 'dr09', 'dr11'].includes(S.screen) ? 100 : S.screen === 'dr01' ? (S.auth.step === 'otp' ? 300 : 120) : S.screen === 'dr02' ? 180 : (S.screen === 'dr07' || S.screen === 'dr10') ? 120 : S.undo && S.screen === 'dr04' ? 108 : (S.screen === 'dr08' || S.screen === 'dr06') ? 170 : S.screen === 'dr05' ? 120 : 28;
    document.getElementById('toasts').style.setProperty('--toast-b', tb + 'px');
    if (S.screen === 'dr05' && S.cam && S.cam.mode === 'sign' && !S.cam.pick) setupSig();
    renderPanel();
  }

  /* Signature pad */
  function demoStrokes() {
    const a = [], b = [], c = [];
    for (let x = 40; x <= 150; x += 4) a.push([x, 110 - 30 * Math.sin((x - 40) / 18) * Math.exp(-(x - 40) / 160)]);
    for (let x = 140; x <= 270; x += 4) b.push([x, 105 + 18 * Math.sin((x - 140) / 10) - (x - 140) * .12]);
    for (let x = 60; x <= 280; x += 8) c.push([x, 138 + (x - 60) * -.05]);
    return [a, b, c];
  }
  function setupSig() {
    const cv = document.getElementById('sig'); if (!cv) return;
    const r = cv.getBoundingClientRect(); const k = 2;
    cv.width = r.width * k; cv.height = r.height * k;
    const ctx = cv.getContext('2d'); ctx.scale(k, k);
    ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--info-fg').trim();
    const draw = s => { ctx.beginPath(); s.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke(); };
    S.cam.strokes.forEach(draw);
    let cur = null;
    const pt = e => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
    cv.onpointerdown = e => { if (locked()) return; cur = [pt(e)]; S.cam.strokes.push(cur); cv.setPointerCapture(e.pointerId); };
    cv.onpointermove = e => { if (!cur) return; cur.push(pt(e)); draw(cur.slice(-2)); };
    cv.onpointerup = () => { cur = null; updSign(); };
    const nm = document.getElementById('podName');
    if (nm) nm.oninput = () => { S.cam.name = nm.value; updSign(); };
  }
  function updSign() { const b = document.getElementById('signDone'); if (b) b.disabled = !(S.cam.strokes.length && S.cam.name.trim()); }

  /* Toast */
  function toast(msg, icon, ms) {
    const host = document.getElementById('toasts');
    const el = document.createElement('div'); el.className = 'app-toast'; el.innerHTML = ic(icon || 'info') + `<span>${msg}</span>`;
    host.appendChild(el);
    const live = () => Array.from(host.children).filter(x => !x.classList.contains('leaving'));
    while (live().length > 2) Shell.dismiss(live()[0]);
    setTimeout(() => Shell.dismiss(el), ms || 4000);
  }
  function clearToasts() { document.getElementById('toasts').innerHTML = ''; }

  /* ================= Reviewer panel ================= */
  function renderPanel() {
    const p = document.getElementById('panel');
    if (!p.dataset.built) {
      p.dataset.built = 1;
      p.innerHTML = `<div><h1>Driver app — prototype</h1><p>Covers DR_01–DR_11. Sample trip CH-0472, MSKU1234567, truck 51C-456.78, cash advance 3,000,000 ₫.</p></div>
        <div class="rv-now" id="rvNow"></div>
        <div class="rv-sec"><h2>Simulation</h2>
          <label class="rv-sw"><input type="checkbox" id="tgDrive"> Driving — 40 km/h (&gt; 10 km/h)</label>
          <label class="rv-sw"><input type="checkbox" id="tgOff"> Offline</label>
          <label class="rv-sw"><input type="checkbox" id="tgConsent"> Driver consented to location sharing (DR_02)</label>
          <div class="rv-row"><button class="btn btn-secondary btn-sm" id="evGeo">Truck enters location geofence</button><button class="btn btn-secondary btn-sm" id="evAcc">Accountant finalizes settlement</button><button class="btn btn-secondary btn-sm" id="evNeed">Accountant requests more info</button></div>
          <label class="rv-file">Real photo for the camera (optional) — replaces the drawn document<input type="file" accept="image/*" id="rvPhoto"></label>
        </div>
        <div class="rv-sec"><h2>Screens &amp; states</h2>${SCREENS.map(([k, l, sts]) => `<div class="rv-scr" data-scr="${k}"><h3>${l}</h3><div class="rv-chips">${sts.map(([s, sl]) => `<a href="#${k}-${s}" data-h="${k}-${s}">${sl}</a>`).join('')}</div></div>`).join('')}</div>
        <div class="rv-sec"><h2>Test flow</h2><p>DR_03 → Open trip → tap the big milestone button → Undo within 10 seconds. The "Container picked up", "Delivered" and "Empty returned" milestones open the camera (DR_05). Step 9 "Complete trip" asks you to confirm. In the icon row, "Expenses" opens DR_06, "Report incident" opens DR_07 and "Waybill" opens DR_10. Bottom bar: Pay (DR_09), Account (DR_11). DR_01: any OTP works except 111111; the phone number must end in 482.</p></div>`;
      p.querySelector('#tgDrive').onchange = e => {
        if (e.target.checked) { S.speed = 40; S.unlockLeft = 0; } else { S.speed = 0; S.unlockLeft = 5; }
        render();
      };
      p.querySelector('#tgOff').onchange = e => { S.offline = e.target.checked; if (!S.offline) flush(); render(); };
      p.querySelector('#tgConsent').onchange = e => { S.consent = e.target.checked; render(); };
      p.querySelector('#evGeo').onclick = () => {
        const t = trip();
        if (!S.consent) { toast('Driver declined location sharing: no auto-logging, milestones are tapped manually.', 'info'); return; }
        if (S.screen !== 'dr04' || !MS[t.step] || !MS[t.step].geo) { toast('Open DR_04 when the next milestone is "Arrived at …" to test auto-logging.', 'info'); return; }
        recordMs(true); render();
      };
      p.querySelector('#evAcc').onclick = () => { const T = t72(); if (!T || T.step !== 9) { toast('Complete trip CH-0472 first.', 'info'); return; } S.st.status = 'confirm'; S.st.other = 'ok'; render(); toast('Settlement CH-0472 is awaiting your confirmation.', 'bell'); };
      p.querySelector('#evNeed').onclick = () => { const T = t72(); if (!T || T.step !== 9) { toast('Complete trip CH-0472 first.', 'info'); return; } S.st.status = 'need'; S.st.other = 'need'; render(); toast('The accountant needs more documents for CH-0472.', 'bell'); };
      p.querySelector('#rvPhoto').onchange = e => readPhoto(e.target.files[0], false);
    }
    p.querySelector('#tgDrive').checked = S.speed > 10;
    p.querySelector('#tgOff').checked = S.offline;
    p.querySelector('#tgConsent').checked = S.consent;
    const curH = location.hash.slice(1);
    p.querySelectorAll('.rv-scr').forEach(x => x.classList.toggle('on', x.dataset.scr === S.screen));
    p.querySelectorAll('.rv-chips a').forEach(a => a.setAttribute('aria-current', a.dataset.h === curH && curH.startsWith(S.screen) ? 'true' : 'false'));
    const sn = SCREENS.find(x => x[0] === S.screen);
    const stl = (sn[2].find(x => curH === S.screen + '-' + x[0]) || [0, 'interactive'])[1];
    p.querySelector('#rvNow').innerHTML = `<b>Viewing:</b> ${sn[1]} — ${stl}`;
  }
  function readPhoto(file, captureNow) {
    if (!file) return;
    const r = new FileReader();
    r.onload = () => { photo = r.result; if (captureNow) capture(photo); else render(); };
    r.readAsDataURL(file);
  }

  /* ================= Events ================= */
  const scr = document.getElementById('screen');
  scr.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    if (el.dataset.act === 'scrollList') { const l = document.getElementById('xlist'); if (l) l.scrollIntoView({ behavior: 'smooth' }); return; }
    e.preventDefault();
    act(el.dataset.act, el.dataset.arg, el);
  });
  /* Top bar gets a soft edge only once the body has scrolled (v1.3 topbar rule) */
  scr.addEventListener('scroll', e => {
    const b = e.target; if (!b.classList || !b.classList.contains('app-body')) return;
    const top = b.parentElement && b.parentElement.querySelector('.app-top');
    if (top) top.classList.toggle('is-scrolled', b.scrollTop > 2);
  }, true);
  scr.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.file === 'cam') readPhoto(t.files[0], true);
    if (t.dataset.dis) { const sh = S.sheet; const k = t.dataset.dis; sh.sel = t.checked ? sh.sel.concat(k) : sh.sel.filter(x => x !== k); sh.err = ''; const n = document.getElementById('disNote'); if (n) sh.note = n.value; render(); }
  });
  scr.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'exOther') { S.ex.other = t.value; const b = document.getElementById('exOtherNext'); if (b) b.disabled = !t.value.trim(); }
    if (t.id === 'disNote' && S.sheet) S.sheet.note = t.value;
    if (t.id === 'authPhone') { const v = t.value.replace(/\D/g, '').slice(0, 10); if (v !== t.value) t.value = v; S.auth.phone = v; S.auth.err = ''; const b = document.getElementById('authSend'); if (b) b.disabled = !(/^0\d{9}$/.test(v) && !S.offline); }
    if (t.id === 'incNote' && S.inc) S.inc.note = t.value;
    if (t.id === 'newPhone' && S.sheet) S.sheet.val = t.value;
  });

  setInterval(() => {
    let dirty = false;
    if (S.unlockLeft > 0 && S.speed <= 10) { S.unlockLeft--; dirty = true; }
    if (S.undo && S.screen === 'dr04' && !locked()) {
      S.undo.left--;
      if (S.undo.left <= 0) { const end = S.undo.onEnd; S.undo = null; if (end) { end(); return; } dirty = true; }
      else setUndo();
    }
    if (S.screen === 'dr01' && S.auth.step === 'otp' && S.auth.resend > 0) {
      S.auth.resend--;
      const el = document.getElementById('otpResend');
      if (S.auth.resend <= 0) dirty = true; else if (el) el.textContent = `Didn't get it? Resend code in ${mmss(S.auth.resend)}`;
    }
    if (S.screen === 'dr07' && S.inc && S.inc.rec === 'on' && !locked()) {
      S.inc.recSec++;
      const el = document.getElementById('recT'); if (el) el.textContent = mmss(S.inc.recSec);
      if (S.inc.recSec >= 120) { S.inc.rec = 'done'; dirty = true; }
    }
    if (S.st.lockLeft > 0 && S.screen === 'dr08') { S.st.lockLeft--; if (!S.dlg && !S.sheet) dirty = true; }
    if (dirty) render();
  }, 1000);

  function fromHash() {
    const [scr0, st0] = location.hash.slice(1).split('-');
    const sc = SCREENS.find(x => x[0] === scr0) ? scr0 : 'dr03';
    const list = SCREENS.find(x => x[0] === sc)[2];
    preset(sc, list.some(x => x[0] === st0) ? st0 : 'default');
  }
  window.addEventListener('hashchange', fromHash);
  fromHash();
})();
</script>
