<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driver app (demo) · Đội Xe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap&subset=vietnamese">
<link rel="stylesheet" href="../assets/css/app.css">
<style>
  /* ---------- Reviewer layout (prototype only) ---------- */
  body { background: var(--surface-muted); }
  .rv { display: grid; grid-template-columns: 340px minmax(0, 1fr); height: 100vh; }
  .rv-panel { background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; padding: 16px 16px 32px; display: flex; flex-direction: column; gap: 14px; font-size: 13px; line-height: 18px; }
  .rv-panel h1 { font-size: 17px; line-height: 22px; }
  .rv-panel h2 { font: 600 11.5px/16px var(--font-body); text-transform: uppercase; letter-spacing: .05em; color: var(--fg-muted); margin-bottom: 6px; }
  .rv-panel p { color: var(--fg-muted); }
  .rv-sec { display: flex; flex-direction: column; gap: 6px; }
  .rv-scr { border: 1px solid var(--border); border-radius: var(--r-md); padding: 8px 10px; }
  .rv-scr.on { border-color: var(--primary); box-shadow: inset 3px 0 0 var(--primary); }
  .rv-scr h3 { font-size: 13.5px; line-height: 18px; }
  .rv-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .rv-chips a { font-size: 12px; line-height: 16px; padding: 3px 8px; border: 1px solid var(--border-strong); border-radius: 12px; color: var(--fg); text-decoration: none; }
  .rv-chips a:hover { background: var(--surface-muted); }
  .rv-chips a[aria-current="true"] { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); font-weight: 600; }
  .rv-sw { display: flex; gap: 8px; align-items: center; padding: 3px 0; cursor: pointer; }
  .rv-sw input { accent-color: var(--primary); width: 16px; height: 16px; }
  .rv-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .rv-file { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--fg-muted); }
  .rv-file input { font-size: 12px; }
  .rv-now { background: var(--surface-muted); border-radius: var(--r-md); padding: 8px 10px; color: var(--fg); }
  .rv-stage { display: flex; align-items: center; justify-content: center; padding: 20px; overflow: auto; min-width: 0; }

  /* ---------- Device ---------- */
  /* v1.3 language on mobile: borderless surfaces (--shadow-card) or tinted fills, spacing instead of rules.
     Borders stay only on interactive controls (inputs, Secondary buttons). Indigo accent via --primary. */
  .app-device { flex: none; width: 414px; height: 868px; padding: 12px; border-radius: 54px; background: var(--fg-strong); box-shadow: var(--shadow-overlay); }
  .app-screen { --safe-b: 34px; --press: scale(.97); position: relative; width: 390px; height: 844px; border-radius: 42px; overflow: hidden; background: var(--bg); display: flex; flex-direction: column; font: 400 16px/24px var(--font-body); color: var(--fg); }
  .app-screen .icon { width: 22px; height: 22px; }
  .app-screen .icon.app-i16 { width: 16px; height: 16px; }
  .app-screen .icon.app-i28 { width: 28px; height: 28px; }
  .app-screen .icon.app-i32 { width: 32px; height: 32px; }
  .app-screen .icon.app-i40 { width: 40px; height: 40px; stroke-width: 1.4; }
  .app-sys { flex: none; height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 34px; font: 600 15px/1 var(--font-body); color: var(--fg-strong); background: var(--bg); position: relative; z-index: 60; }
  .app-sys.is-dark { background: var(--fg-strong); color: var(--nav-active); }
  .app-sys::after { content: ""; position: absolute; left: 50%; top: 9px; width: 108px; height: 28px; border-radius: 14px; background: var(--fg-strong); transform: translateX(-50%); }
  .app-sys .app-sysr { display: flex; align-items: center; gap: 6px; }
  .app-sys .icon { width: 17px; height: 17px; stroke-width: 2.2; }
  .app-batt { width: 26px; height: 13px; border: 2px solid currentColor; border-radius: 4px; position: relative; padding: 1px; }
  .app-batt i { display: block; height: 100%; width: 72%; background: currentColor; border-radius: 1px; }
  .app-homebar { position: absolute; left: 50%; bottom: 7px; width: 134px; height: 5px; border-radius: 3px; background: var(--fg-strong); transform: translateX(-50%); z-index: 70; pointer-events: none; }
  .app-screen.is-dark .app-homebar, .app-screen.is-locked .app-homebar { background: var(--nav-active); }
  .app-view { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--bg); }
  .app-view.is-dark { background: var(--fg-strong); }

  /* Shared press feedback (DESIGN §9: scale .97 in 90ms, colour in --d-1) */
  .app-screen button, .app-screen .app-camact, .app-screen .app-opt, .app-screen .app-trip, .app-screen .app-xl { -webkit-tap-highlight-color: transparent; transition: background-color var(--d-1) var(--ease-std), color var(--d-1) var(--ease-std), box-shadow var(--d-2) var(--ease-std), transform 90ms var(--ease-std); }
  .app-btn:active:not([disabled]), .app-ia:active:not([disabled]), .app-gcell:active, .app-key:active, .app-camact:active, .app-thumb:active,
  .app-back:active, .app-sync:active, .app-link:active, .app-nav button:active, .app-tabs button:active, .app-opt:active, .app-seg button:active,
  .app-alert .app-alert-act button:active, .app-undo button:active, .app-edit:active, .app-lock .app-call:active, .app-fld:active { transform: var(--press); }
  .app-trip:active:not(:has(button:active)), .app-mrow:active:not([disabled]), .app-xl:active:not(:has(button:active)) { transform: scale(.99); }

  /* ---------- TopBar, SyncStatus, Banner ---------- */
  .app-top { flex: none; min-height: 64px; display: flex; align-items: center; gap: 4px; padding: 4px 12px 4px 4px; background: var(--bg); box-shadow: 0 1px 0 transparent; transition: box-shadow var(--d-2) var(--ease-std); position: relative; z-index: 2; }
  .app-top.is-scrolled { box-shadow: 0 1px 0 var(--border), 0 6px 16px -10px rgba(30,41,82,.18); }
  .app-top.is-dark { background: var(--fg-strong); color: var(--nav-active); box-shadow: none; }
  .app-top-pad { width: 12px; flex: none; }
  .app-back { flex: none; width: 66px; white-space: nowrap; letter-spacing: -.01em; min-height: 56px; border: 0; background: none; color: var(--primary); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font: 600 14px/16px var(--font-body); cursor: pointer; border-radius: var(--r-lg); }
  .app-back:hover { background: var(--primary-soft); }
  .app-top.is-dark .app-back { color: var(--nav-active); }
  .app-top.is-dark .app-back:hover { background: var(--nav-active-bg); }
  .app-title { flex: 1; min-width: 0; }
  .app-title h1 { font: 700 20px/26px var(--font-display); color: var(--fg-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .app-title h1.app-h-sm { font-size: 17px; line-height: 22px; letter-spacing: -.01em; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .app-title p { font-size: 14px; line-height: 19px; color: var(--fg-muted); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .app-top.is-dark h1 { color: var(--nav-active); }
  .app-top.is-dark .app-title p { color: var(--nav-fg); }
  .app-sync { flex: none; position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; min-width: 44px; padding: 0 12px; border-radius: 22px; border: 0; font: 600 14px/1 var(--font-body); cursor: pointer; white-space: nowrap; }
  .app-sync::before { content: ""; position: absolute; inset: -6px -4px; }
  .app-sync .icon { width: 18px; height: 18px; }
  .app-sync.s-ok { background: var(--success-soft); color: var(--success-fg); padding: 0; width: 44px; }
  .app-sync.s-wait { background: var(--warning-soft); color: var(--warning-fg); box-shadow: inset 0 0 0 1.5px var(--warning-solid); }
  .app-sync.s-send { background: var(--primary-soft); color: var(--side-active); padding: 0; width: 44px; }
  .app-sync .app-syncn { font: 700 16px/1 var(--font-body); font-variant-numeric: tabular-nums; }
  .app-sync.s-send .icon { animation: app-spin 1s linear infinite; }
  @keyframes app-spin { to { transform: rotate(360deg); } }
  .app-banner { flex: none; display: flex; align-items: center; gap: 10px; min-height: 52px; margin: 0 16px; padding: 0 4px 0 14px; border-radius: var(--r-lg); background: var(--primary-soft); color: var(--side-active); font: 600 16px/22px var(--font-body); }
  .app-banner span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .app-banner .icon { flex: none; }
  .app-banner button { flex: none; min-height: 52px; padding: 0 12px; border: 0; background: none; color: var(--side-active); font: 600 16px var(--font-body); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; border-radius: var(--r-md); }

  /* ---------- Body, cards, buttons ---------- */
  .app-body { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; scrollbar-width: none; }
  .app-body::-webkit-scrollbar { display: none; }
  .app-banner + .app-body { padding-top: 12px; }
  /* Safe bottom spacing: content never sits on the home indicator */
  .app-view > .app-body:last-child { padding-bottom: calc(var(--safe-b) + 8px); }
  .app-body.is-pad-b, .app-view > .app-body.is-pad-b:last-child { padding-bottom: 112px; }
  .app-card { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-card); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .app-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 56px; padding: 0 16px; border-radius: var(--r-lg); border: 1px solid transparent; font: 600 18px/22px var(--font-body); cursor: pointer; text-align: center; }
  .app-btn-primary { background: var(--primary); color: var(--on-primary); box-shadow: 0 1px 2px rgba(15,23,42,.08), 0 6px 16px -8px color-mix(in srgb, var(--primary) 60%, transparent); }
  .app-btn-primary:hover:not([disabled]) { background: var(--primary-hover); }
  .app-btn-primary:active:not([disabled]) { background: var(--primary-hover); box-shadow: 0 1px 2px rgba(15,23,42,.08); }
  .app-btn-secondary { background: var(--surface); color: var(--fg-strong); border-color: var(--border-strong); }
  .app-btn-secondary:active:not([disabled]) { background: var(--surface-muted); }
  .app-btn-danger-o { background: var(--surface); color: var(--danger-fg); border-color: var(--danger-solid); }
  .app-btn-danger-o:active { background: var(--danger-soft); }
  .app-btn-ghost { background: none; color: var(--primary); }
  .app-btn-ghost:active { background: var(--primary-soft); }
  .app-btn[disabled] { background: var(--surface-muted); color: var(--fg-subtle); border-color: transparent; box-shadow: none; cursor: not-allowed; }
  .app-btn-sm { min-height: 48px; font-size: 16px; width: auto; }
  .app-note { font-size: 14px; line-height: 20px; color: var(--fg-muted); text-align: center; }
  .app-badge { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 3px 10px; border-radius: var(--r-md); font: 600 14px/18px var(--font-body); }
  .app-badge .icon { width: 16px; height: 16px; }
  .app-code { font-variant-numeric: tabular-nums; font-weight: 600; letter-spacing: .02em; white-space: nowrap; }
  .app-money-v { font-variant-numeric: tabular-nums; }
  .app-alert { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-lg); box-shadow: inset 3px 0 0 var(--al, currentColor); font-size: 16px; line-height: 22px; }
  .app-alert .icon { margin-top: 1px; flex: none; }
  .app-alert .app-alert-b { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .app-alert .app-alert-act { display: flex; gap: 8px; flex-wrap: wrap; }
  .app-alert .app-alert-act button { min-height: 48px; padding: 0 14px; border-radius: var(--r-md); border: 1px solid currentColor; background: var(--surface); color: inherit; font: 600 16px var(--font-body); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .app-a-info { background: var(--primary-soft); --al: var(--primary); color: var(--side-active); }
  .app-a-warn { background: var(--warning-soft); --al: var(--warning-solid); color: var(--warning-fg); }
  .app-a-danger { background: var(--danger-soft); --al: var(--danger-solid); color: var(--danger-fg); }
  .app-a-neutral { background: var(--neutral-soft); --al: var(--neutral-solid); color: var(--neutral-fg); }
  .app-a-success { background: var(--success-soft); --al: var(--success-solid); color: var(--success-fg); }

  /* ---------- DR_03 ---------- */
  .app-money { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-card); flex: none; padding: 6px 6px 8px; display: flex; flex-direction: column; gap: 2px; }
  .app-money h2 { font: 700 17px/22px var(--font-display); padding: 8px 10px 4px; color: var(--fg-strong); }
  .app-mrow { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 60px; padding: 6px 8px 6px 10px; border: 0; border-radius: var(--r-lg); background: none; text-align: left; font: inherit; color: inherit; cursor: pointer; }
  .app-mrow:not([disabled]):hover { background: var(--surface-muted); }
  .app-mrow[disabled] { cursor: default; }
  .app-mrow.is-act { background: var(--primary-soft); }
  .app-mrow.is-act small { color: var(--side-active); }
  .app-mrow.is-act b, .app-mrow.is-act > .icon { color: var(--side-active); }
  .app-mrow .app-ml { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .app-mrow small { font-size: 14px; line-height: 19px; color: var(--fg-muted); }
  .app-mrow b { font: 700 24px/30px var(--font-display); color: var(--fg-strong); font-variant-numeric: tabular-nums; }
  .app-mrow b.app-mnone { font: 500 16px/24px var(--font-body); color: var(--fg-muted); }
  .app-mrow > .icon { color: var(--fg-muted); }
  /* Tabs: baseline is part of the control; Indigo underline grows from the centre (same as web .tabs) */
  .app-tabs { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); box-shadow: inset 0 -1px 0 var(--border); }
  .app-tabs button { position: relative; min-height: 56px; border: 0; border-radius: var(--r-md) var(--r-md) 0 0; background: none; font: 500 16px/20px var(--font-body); color: var(--fg-muted); cursor: pointer; padding: 0 2px; white-space: nowrap; }
  .app-tabs button:active { background: var(--surface-muted); }
  .app-tabs button[aria-selected="true"] { color: var(--side-active); font-weight: 700; }
  .app-tabs button::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--primary); transform: scaleX(0); transition: transform var(--d-3) var(--ease-out); }
  .app-tabs button[aria-selected="true"]::after { transform: scaleX(1); }
  .app-trip { cursor: pointer; gap: 6px; }
  .app-trip.is-hl { box-shadow: 0 0 0 2px var(--primary), 0 0 0 6px var(--primary-soft), var(--shadow-card); }
  .app-trip-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .app-trip-head .app-code { font-size: 16px; color: var(--fg-muted); }
  .app-route { font: 600 20px/27px var(--font-display); color: var(--fg-strong); }
  .app-kv { font-size: 16px; line-height: 24px; color: var(--fg); }
  .app-kv span { color: var(--fg-muted); }
  .app-kv b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .app-next { display: flex; align-items: center; gap: 8px; font: 600 16px/22px var(--font-body); color: var(--side-active); }
  .app-cd b { white-space: nowrap; font-weight: 800; }
  .app-cd { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: var(--r-md); background: var(--warning-soft); color: var(--warning-fg); font: 600 16px/22px var(--font-body); }
  .app-cd { flex-wrap: wrap; column-gap: 8px; row-gap: 0; }
  .app-cd .icon { flex: none; }
  .app-cd b { margin-left: auto; }
  .app-trip .app-btn { margin-top: 6px; }
  .app-mini { gap: 4px; }
  .app-mini .app-route { font-size: 18px; line-height: 24px; }
  .app-nav { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); box-shadow: 0 -1px 0 rgba(15,23,42,.04), 0 -8px 24px -12px rgba(30,41,82,.14); padding: 6px 8px var(--safe-b); position: relative; z-index: 2; }
  .app-nav button { min-height: 64px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font: 500 16px/20px var(--font-body); color: var(--fg-muted); cursor: pointer; border-radius: var(--r-lg); }
  .app-screen .app-nav button .icon { width: 56px; height: 32px; padding: 3px 14px; border-radius: 16px; transition: background-color var(--d-2) var(--ease-std); }
  .app-nav button[aria-current="page"] { color: var(--side-active); font-weight: 700; }
  .app-nav button[aria-current="page"] .icon { background: var(--primary-soft); }
  .app-emptystate { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 32px 12px; }
  .app-emptystate .icon { color: var(--fg-subtle); }
  .app-emptystate h3 { font: 700 20px/26px var(--font-display); }
  .app-emptystate p { color: var(--fg-muted); }
  .app-sk { display: flex; flex-direction: column; gap: 10px; }
  .app-sk .sk { height: 16px; border-radius: var(--r-sm); }
  .app-sk .sk.h24 { height: 26px; } .app-sk .sk.h56 { height: 56px; border-radius: var(--r-lg); }

  /* ---------- DR_04 ---------- */
  .app-dest { gap: 4px; }
  .app-dest .app-lbl { font: 600 14px/18px var(--font-body); color: var(--fg-muted); text-transform: uppercase; letter-spacing: .04em; }
  .app-dest h2 { font: 700 18px/24px var(--font-display); color: var(--fg-strong); }
  .app-dest p { font-size: 16px; line-height: 22px; }
  .app-dest .app-cd { margin-top: 6px; }
  .app-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .app-2 .app-btn { font-size: 16px; padding: 0 8px; flex-direction: row; }
  .app-2 .app-btn small { display: block; font-size: 14px; font-weight: 500; color: var(--fg-muted); line-height: 16px; }
  .app-big { flex: none; position: relative; width: 100%; min-height: 184px; border: 0; border-radius: 16px; background: var(--primary); color: var(--on-primary); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 18px 16px; cursor: pointer; text-align: center; overflow: hidden;
    box-shadow: 0 1px 2px rgba(15,23,42,.1), 0 14px 28px -14px color-mix(in srgb, var(--primary) 75%, transparent);
    transition: transform 90ms var(--ease-std), background-color var(--d-1) var(--ease-std), box-shadow var(--d-2) var(--ease-std); }
  .app-big:active:not([disabled]) { transform: var(--press); background: var(--primary-hover); box-shadow: 0 1px 2px rgba(15,23,42,.1), 0 6px 14px -10px color-mix(in srgb, var(--primary) 75%, transparent); }
  .app-big .app-step { font: 600 16px/20px var(--font-body); padding: 5px 12px; border-radius: 14px; background: color-mix(in srgb, var(--on-primary) 18%, transparent); }
  .app-big .app-bigt { font: 800 28px/34px var(--font-display); letter-spacing: .01em; }
  .app-big .app-bigs { font: 500 17px/23px var(--font-body); display: block; opacity: .92; }
  .app-big .app-bigs .icon { vertical-align: -6px; margin-right: 6px; }
  .app-big .icon { width: 26px; height: 26px; }
  .app-big[disabled] { background: var(--surface-muted); color: var(--fg-muted); box-shadow: inset 0 0 0 2px var(--border-strong); cursor: not-allowed; }
  .app-big[disabled] .app-step { background: var(--border); }
  /* After a milestone is recorded the next step's label slides in, so the driver sees the button changed */
  .app-big.is-next > span { animation: app-next-in var(--d-3) var(--ease-out) both; }
  .app-big.is-next > span:nth-child(2) { animation-delay: 40ms; }
  .app-big.is-next > span:nth-child(3) { animation-delay: 80ms; }
  @keyframes app-next-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .app-doneblock { flex: none; border-radius: var(--r-lg); background: var(--success-soft); color: var(--success-fg); padding: 24px 16px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; }
  .app-doneblock b { font: 700 22px/28px var(--font-display); }
  .app-doneblock > .icon { animation: app-pop 320ms var(--ease-out) both; }
  @keyframes app-pop { 0% { transform: scale(.6); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }
  .app-icons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; flex: none; }
  .app-icons.n2 { grid-template-columns: repeat(2, 1fr); }
  .app-icons.n1 { grid-template-columns: 1fr; }
  .app-ia { min-height: 88px; border: 0; border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow-card); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 8px 2px; font: 600 15px/18px var(--font-body); color: var(--fg-strong); cursor: pointer; text-align: center; }
  .app-ia .icon { width: 28px; height: 28px; color: var(--primary); }
  .app-ia:active:not([disabled]) { background: var(--primary-soft); }
  .app-ia[disabled] { color: var(--fg-subtle); background: var(--surface-muted); box-shadow: none; cursor: not-allowed; }
  .app-ia[disabled] .icon { color: var(--fg-subtle); }

  /* ---------- DR_05 camera ---------- */

      if (st === 'offline') S.offline = true;
      if (st === 'loading') S.flags.loading = true;
      if (st === 'error') S.flags.error = true;
      if (st === 'empty') S.flags.empty = true;
    }
    if (scr === 'dr10') {
      if (st === 'zoom') S.zoom = 'qr';
      if (st === 'offline') S.offline = true;
      if (st === 'loading') S.flags.loading = true;
      if (st === 'notrip') { finishTrip(T); S.trips = { 'CH-0472': T }; S.clock = '16:20'; }
    }
    if (scr === 'dr11') {
      if (st === 'gplx') S.acct.gplxSoon = true;
      if (st === 'phone') S.sheet = { kind: 'phone', val: '', err: '' };
      if (st === 'phonereq') S.acct.phoneReq = '0912 345 777';
      if (st === 'withdraw') S.dlg = { kind: 'withdraw' };
      if (st === 'nolocation') S.consent = false;
      if (st === 'policy') S.sheet = { kind: 'policy' };
      if (st === 'offline') S.offline = true;
      if (st === 'loading') S.flags.loading = true;
      if (st === 'error') S.flags.error = true;
    }
    if ((scr === 'dr06' || scr === 'dr05') && S.speed === 0 && st === 'lock') S.speed = 40;
    render();
    if (scr === 'dr08' && st === 'need') { const x = document.querySelector('[data-act="supplement"]'); if (x) x.scrollIntoView({ block: 'center' }); }
  }

  /* ================= Navigation & actions ================= */
  function commitUndo() { S.undo = null; }
  function go(scr, opts) {
    commitUndo(); S.screen = scr; S.flags = {}; S.dlg = null; S.sheet = null; S.zoom = false;
    if (scr === 'dr03') { S.tab = (opts && opts.tab) || null; S.hl = null; }
    if (scr !== 'dr05') S.cam = null;
    if (scr !== 'dr06') S.ex = null;
    if (scr !== 'dr07') S.inc = null;
    if (scr === 'dr09' && !(opts && opts.keepTab)) S.pay.tab = 'cur';
    render();
  }

  function recordMs(auto) {
    const t = trip(); const m = MS[t.step]; const prev = t.step;
    t.step++; t.times[m.k] = m.t; S.clock = m.t;
    if (auto) t.auto[m.k] = 1; else delete t.auto[m.k];
    const qid = S.offline ? q(`${m.long} · tapped at ${m.t}`) : null;
    S.undo = { text: (auto ? 'Auto-logged: ' : 'Logged: ') + `<b>${m.long}</b> · ${m.t}`, left: 10, auto, trip: t.id, prev, k: m.k, qid };
    if (m.k === 'finish') {
      S.st.status = 'pending'; S.dlg = null;
      S.undo.text = 'Logged: <b>Trip completed</b> · 14:30';
      S.undo.onEnd = () => { go('dr03'); toast('Trip CH-0472 is done. The accountant will settle it and let you know.', 'check'); };
    }
  }
  function doUndo() {
    const u = S.undo; if (!u) return;
    const t = S.trips[u.trip]; t.step = u.prev; delete t.times[u.k]; delete t.auto[u.k];
    if (u.qid) S.queue = S.queue.filter(x => x.id !== u.qid);
    if (u.k === 'finish') S.st.status = 'confirm';
    S.undo = null; render(); toast('Undone. Milestone not logged.', 'undo');
  }

  function missingDocs(t) { return ['eir1', 'pod', 'eir2'].filter(k => !t.docs[k]); }

  function camDone() {
    const c = S.cam, t = trip(), d = DOCS[c.type];
    const sign = c.mode === 'sign';
    const n = c.pages.length;
    const doc = sign ? { sign: c.name, short: c.name } : { pages: n };
    const what = sign ? 'the receiver\'s signature' : `${n} page(s) of ${d.short.charAt(0).toLowerCase() + d.short.slice(1)}`;
    if (S.offline) q(sign ? `Receiver's signature (POD) · ${S.clock}` : `Photos: ${d.short} · ${n} page(s) · ${S.clock}`);
    const msg = S.offline ? (sign ? 'Signature saved. Will send when you\'re back online.' : `Saved ${n} page(s). Will send when you're back online.`) : `Sent ${what}.`;
    const from = c.from;
    if (from === 'dr08') { S.st.other = 'supplied'; go('dr08'); toast(S.offline ? msg : 'Extra photo sent. The accountant will review it.', 'check'); return; }
    if (['eir1', 'eir2', 'pod'].includes(c.type)) t.docs[c.type] = doc;
    go('dr04');
    if (from === 'milestone') { recordMs(false); render(); }
    if (from === 'missing') toast('All documents are in. Tap "Complete trip" to finish.', 'check');
    else toast(msg, 'check');
  }

  function capture(src) {
    const c = S.cam || null;
    if (S.screen === 'dr06') { S.ex.pages++; S.ex.photo = src || photo; S.ex.step = 4; S.ex.noInv = false; render(); return; }
    if (!c) return;
    const pg = { n: c.pages.length + 1, src: src || photo };
    if (c.retake != null) { pg.n = c.retake + 1; c.pages[c.retake] = pg; c.retake = null; toast(`Page ${pg.n} retaken.`, 'check'); }
    else { if (c.pages.length >= 10) { toast('Up to 10 pages per document.', 'warn'); return; } c.pages.push(pg); }
    render();
  }

  function settle() {
    const status = S.st.status;
    const lines = S.exp.map(e => {
      let st = 'ok', reason = '';
      if (e.type === 'load') { st = 'rej'; reason = 'Reason: Under the contract, the customer pays the handling fee at the warehouse.'; }
      if (e.type === 'other') { st = S.st.other; if (st === 'need') reason = 'Accountant\'s note: Invoice photo is blurry, please retake.'; }
      if (status === 'pending') { st = 'wait'; reason = ''; }
      return Object.assign({}, e, { st, reason });
    });
    const appr = lines.filter(l => l.st === 'ok');
    const apprSum = appr.reduce((a, l) => a + l.amt, 0);
    const total = lines.reduce((a, l) => a + l.amt, 0);
    const open = lines.some(l => l.st === 'need' || l.st === 'supplied');
    return { lines, appr, apprSum, total, open, diff: S.adv - apprSum };
  }

  function act(a, arg, el) {
    if (locked() && a !== 'call') return;
    const t = trip();
    switch (a) {
      case 'go': go(arg); break;
      case 'openTrip': S.cur = arg; go('dr04'); break;
      case 'openOld': toast(`This prototype only has details for CH-0472. ${arg} is sample data.`, 'info'); break;
      case 'openSettle': go('dr08'); break;
      case 'tab': S.tab = arg; S.hl = null; render(); break;
      case 'salary': go('dr09'); break;
      case 'account': go('dr11'); break;
      case 'sync': S.sheet = { kind: 'queue' }; render(); break;
      case 'learn': S.sheet = { kind: 'loc' }; render(); break;
      case 'sendNow': if (S.offline) { toast('Still offline. It\'ll send automatically once you\'re back online.', 'warn'); } else flush(); S.sheet = null; render(); break;
      case 'close': S.dlg = null; S.sheet = null; S.zoom = false; if (S.st.lockLeft < 0) S.st.lockLeft = 0; render(); break;
      case 'retry': S.flags = {}; render(); toast('Reloaded.', 'check'); break;
      case 'call': toast(arg === 'acc' ? 'Calling accountant Khoa (speaker)…' : arg === '115' ? 'Calling 115 — ambulance…' : 'Calling dispatcher Hằng (speaker)…', 'call'); break;
      case 'maps': toast('Opening Google Maps directions to the destination.', 'nav'); break;
      /* DR_04 */
      case 'ms': {
        const m = MS[t.step];
        if (m.k === 'finish') { S.dlg = { kind: missingDocs(t).length ? 'missing' : 'finish' }; render(); break; }
        if (m.cam) { commitUndo(); S.cam = newCam(m.cam, 'milestone', { ms: t.step }); S.screen = 'dr05'; render(); break; }
        recordMs(false); render(); break;
      }
      case 'undo': doUndo(); break;
      case 'finishOk': recordMs(false); render(); break;
      case 'takeMissing': commitUndo(); S.dlg = null; S.cam = newCam(arg, 'missing'); S.screen = 'dr05'; render(); break;
      case 'expense': commitUndo(); S.ex = newEx(); S.screen = 'dr06'; S.dlg = null; S.sheet = null; render(); break;
      case 'editExp': { const e = S.exp.find(x => x.id === +arg); commitUndo(); S.sheet = null; S.ex = newEx({ step: 4, type: e.type, other: e.name || '', amt: e.amt, lit: e.lit || 0, km: e.km || 0, pages: e.inv ? 1 : 0, noInv: !e.inv, edit: e.id }); S.screen = 'dr06'; render(); break; }
      case 'freeCam': commitUndo(); S.cam = newCam(null, 'free'); S.screen = 'dr05'; render(); break;
      case 'incident': commitUndo(); S.inc = newInc(); S.screen = 'dr07'; S.dlg = null; S.sheet = null; render(); break;
      case 'permit': go('dr10'); break;
      case 'details': S.sheet = { kind: 'details' }; render(); break;
      /* DR_05 */
      case 'pickType': S.cam.type = arg; S.cam.pick = false; render(); break;
      case 'shoot': capture(); break;
      case 'flash': S.cam.flash = !S.cam.flash; render(); break;
      case 'thumb': S.cam.view = +arg; S.sheet = { kind: 'page' }; render(); break;
      case 'retake': S.cam.retake = S.cam.view; S.sheet = null; render(); toast(`Retake page ${S.cam.view + 1}: tap SNAP.`, 'camera'); break;
      case 'delPage': S.cam.pages.splice(S.cam.view, 1); S.cam.pages.forEach((p, i) => p.n = i + 1); S.sheet = null; render(); break;
      case 'blurRetake': S.cam.pages.pop(); S.cam.blur = false; render(); break;
      case 'blurKeep': S.cam.blur = false; render(); break;
      case 'seg': S.cam.mode = arg; render(); break;
      case 'signClear': S.cam.strokes = []; render(); break;
      case 'camCancel':
        if (S.cam && (S.cam.pages.length || S.cam.strokes.length)) { S.dlg = { kind: 'camDiscard' }; render(); }
        else camBack();
        break;
      case 'camDiscard': S.dlg = null; camBack(); break;
      case 'camDone': camDone(); break;
      case 'grant': S.cam.noperm = false; render(); toast('Camera access allowed.', 'check'); break;
      case 'storageFix': S.cam.storage = false; render(); break;
      /* DR_06 */
      case 'exType': S.ex.type = arg; if (arg !== 'other') { S.ex.step = 2; S.ex.field = 'amt'; } render(); if (arg === 'other') setTimeout(() => { const i = document.getElementById('exOther'); if (i) i.focus(); }, 30); break;
      case 'exOtherNext': S.ex.step = 2; S.ex.field = 'amt'; render(); break;
      case 'key': key(arg); break;
      case 'exField': S.ex.field = arg; render(); break;
      case 'exNext': exNext(); break;
      case 'exBack': exBack(); break;
      case 'zoom': S.zoom = true; render(); break;
      case 'noInv': S.dlg = { kind: 'noinv' }; render(); break;
      case 'noInvOk': S.dlg = null; S.ex.noInv = true; S.ex.pages = 0; S.ex.step = 4; render(); break;
      case 'exGoto': S.ex.step = +arg; if (+arg === 2) S.ex.field = 'amt'; render(); break;
      case 'exSave': exSave(); break;
      case 'exDel': S.dlg = { kind: 'del' }; render(); break;
      case 'exDelOk': { const e = S.exp.find(x => x.id === S.ex.edit); S.exp = S.exp.filter(x => x.id !== S.ex.edit); go('dr04'); toast(`Deleted: ${expLabel(e)} ${vnd(e.amt)}`, 'trash'); break; }
      case 'exDiscard': go('dr04'); break;
      /* DR_08 */
      case 'confirm': S.dlg = { kind: 'confirm' }; render(); break;
      case 'confirmOk':
        S.dlg = null; S.st.status = 'settled'; S.st.confirmedAt = '16:40 15/11';
        if (S.offline) { q('Confirm settlement CH-0472 · tapped at 16:40'); toast('Saved. Will send when you\'re back online.', 'clock'); }
        else toast('Settlement CH-0472 confirmed at 16:40.', 'lock');
        render(); break;
      case 'disagree': S.sheet = { kind: 'disagree', sel: [], note: '' }; render(); break;
      case 'disSend': {
        const sh = S.sheet; const err = !sh.sel.length ? 'Choose at least one reason.' : (sh.sel.includes('other') && !sh.note.trim() ? 'If you choose "Other reason", add a note for the accountant.' : '');
        if (err) { sh.err = err; render(); break; }
        S.sheet = null; S.st.status = 'reviewing';
        if (S.offline) { q('Disagree with settlement CH-0472 · 16:40'); toast('Saved. Will send when you\'re back online.', 'clock'); } else toast('Feedback sent to the accountant.', 'check');
        render(); break;
      }
      case 'supplement': commitUndo(); S.cam = newCam('inv', 'dr08'); S.screen = 'dr05'; render(); break;
      case 'viewInv': S.sheet = { kind: 'inv', id: +arg }; render(); break;
      /* DR_01 */
      case 'authStart': S.auth.step = 'phone'; render(); focusLater('authPhone'); break;
      case 'authBack': { const A = S.auth; if (A.step === 'otp') { A.step = 'phone'; A.otp = ''; A.otpErr = ''; } else if (A.step === 'phone') A.step = 'invite'; render(); break; }
      case 'authSend': {
        const A = S.auth;
        if (S.offline) { toast('No connection. Turn on mobile data and try again.', 'noWifi'); break; }
        if (!/482$/.test(A.phone)) { A.err = 'unknown'; render(); break; }
        Object.assign(A, { err: '', step: 'otp', otp: '', otpErr: '', resend: 30 }); render();
        toast(`6-digit code sent to ${ME.masked}.`, 'msg'); break;
      }
      case 'otpKey': otpKey(arg); break;
      case 'otpPaste': S.auth.otp = '482913'; S.auth.otpErr = ''; render(); verifyOtp(); break;
      case 'otpResend': S.auth.resend = 30; S.auth.otp = ''; S.auth.otpErr = ''; render(); toast(`Code resent to ${ME.masked}.`, 'msg'); break;
      /* DR_02 */
      case 'cAgree': S.dlg = { kind: 'sysperm' }; render(); break;
      case 'permAllow': S.consent = true; S.dlg = null; consentDone(true); break;
      case 'permDeny': S.consent = false; S.dlg = null; consentDone(false, true); break;
      case 'cDecline': S.consent = false; consentDone(false); break;
      case 'policy': S.sheet = { kind: 'policy' }; render(); break;
      /* DR_07 */
      case 'incType': S.inc.type = arg; render(); break;
      case 'incPic': if (S.inc.pics >= 6) { toast('Up to 6 photos per report.', 'warn'); break; } S.inc.pics++; render(); break;
      case 'incDelPic': S.inc.pics--; render(); break;
      case 'incMode': S.inc.mode = arg; render(); if (arg === 'note') focusLater('incNote'); break;
      case 'incRec': S.inc.rec = 'on'; S.inc.recSec = 0; render(); break;
      case 'incRecStop': S.inc.rec = 'done'; if (S.inc.recSec < 1) S.inc.recSec = 1; render(); break;
      case 'incRecDel': S.inc.rec = null; S.inc.recSec = 0; render(); break;
      case 'incPlay': toast(`Playing recording ${mmss(S.inc.recSec)}.`, 'play'); break;
      case 'incSend': incSend(); break;
      case 'incBack': {
        const i = S.inc;
        if (i.status === 'edit' && (i.type || i.pics || i.note.trim() || i.rec)) { S.dlg = { kind: 'incDiscard' }; render(); }
        else go('dr04');
        break;
      }
      case 'incDiscardOk': go('dr04'); break;
      /* DR_09 */
      case 'payTab': S.pay.tab = arg; render(); break;
      case 'payLine': S.sheet = { kind: 'payline', id: arg }; render(); break;
      case 'payAdj': S.sheet = { kind: 'payadj', id: +arg }; render(); break;
      case 'payPeriod': S.sheet = { kind: 'period', id: arg }; render(); break;
      /* DR_10 */
      case 'qrZoom': S.zoom = 'qr'; render(); break;
      /* DR_11 */
      case 'locToggle':
        if (S.consent) { S.dlg = { kind: 'withdraw' }; render(); }
        else { S.c2 = { from: 'dr11' }; go('dr02'); }
        break;
      case 'withdrawOk':
        S.consent = false; S.dlg = null;
        if (S.offline) q('Withdraw location sharing consent · ' + S.clock);
        render(); toast('Location sharing is off. You now tap the "Arrived…" milestones yourself.', 'check'); break;
      case 'changePhone': S.sheet = { kind: 'phone', val: '', err: '' }; render(); focusLater('newPhone'); break;
      case 'phoneSend': {
        const sh = S.sheet, v = sh.val.replace(/\D/g, '');
        if (!/^0\d{9}$/.test(v)) { sh.err = 'Phone number must be 10 digits, starting with 0.'; render(); break; }
        if (v === ME.phone.replace(/\s/g, '')) { sh.err = 'That\'s your current number. Enter a new one.'; render(); break; }
        S.acct.phoneReq = v.replace(/(\d{4})(\d{3})(\d{3})/, '$1 $2 $3'); S.sheet = null;
        if (S.offline) q('Phone change request · ' + S.clock);
        render(); toast(S.offline ? 'Saved. Will send when you\'re back online.' : 'Request sent. The admin will call your old number to confirm.', 'check'); break;
      }
      case 'gplxNew': toast('New driver\'s license photo sent to the admin. The admin will update the expiry after checking it.', 'check'); S.acct.gplxSent = true; render(); break;
      case 'logout': S.dlg = { kind: 'logout' }; render(); break;
      case 'logoutOk': S.auth = newAuth(); S.dlg = null; go('dr01'); toast('Logged out of this phone.', 'logout'); break;
    }
  }

  /* DR_01 / DR_02 helpers */
  function focusLater(id) { setTimeout(() => { const i = document.getElementById(id); if (i) i.focus(); }, 40); }
  function otpKey(k) {
    const A = S.auth; if (A.checking) return;
    if (A.otpErr) { A.otpErr = ''; A.otp = ''; }
    if (k === 'del') A.otp = A.otp.slice(0, -1);
    else if (A.otp.length < 6) A.otp += k;
    render();
    if (A.otp.length === 6) verifyOtp();
  }
  function verifyOtp() {
    const A = S.auth; A.checking = true; render();
    setTimeout(() => {
      A.checking = false;
      if (A.otp === '111111') { A.tries--; A.otpErr = `Incorrect code. Tries left: ${A.tries}.`; render(); return; }
      S.c2 = { from: 'dr01' }; S.screen = 'dr02'; S.consent = false; render();
      toast('Logged in. This phone stays logged in, so you won\'t need to log in again.', 'check', 5000);
    }, 700);
  }
  function consentDone(ok, sysDenied) {
    const back = S.c2.from === 'dr11' ? 'dr11' : 'dr03';
    go(back);
    if (ok) toast('Location sharing is on. It\'s shared only while a trip is in progress.', 'pin');
    else if (sysDenied) toast('This phone hasn\'t allowed location. You can still tap milestones yourself; turn it on in Account.', 'info', 5000);
    else toast('Location not shared. You\'ll tap milestones yourself; change this in Account.', 'info', 5000);
  }
  /* DR_07 helpers */
  const mmss = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  function incSummary(i) {
    const parts = [];
    if (i.pics) parts.push(`${i.pics} photo(s)`);
    if (i.rec === 'done') parts.push(`voice note ${mmss(i.recSec)}`);
    if (i.note.trim()) parts.push('note');
    return `Incident report: ${INC[i.type].l}${parts.length ? ' (' + parts.join(', ') + ')' : ''} · ${S.clock}`;
  }
  function incSend() {
    const i = S.inc; if (!i.type) return;
    if (i.rec === 'on') { i.rec = 'done'; }
    i.sentAt = S.clock;
    if (S.offline) { q(incSummary(i)); S.incPending = true; i.status = 'queued'; render(); return; }
    i.status = 'sending'; render();
    setTimeout(() => { if (S.inc === i && i.status === 'sending') { i.status = 'sent'; render(); toast('The dispatcher received your incident report.', 'check'); } }, 1200);
  }

  function camBack() {
    const c = S.cam;
    if (c.from === 'dr08') go('dr08');
    else { go('dr04'); if (c.from === 'milestone') toast('Capture cancelled. Milestone not logged.', 'info'); }
  }
  function flush() {
    if (!S.queue.length) return;
    const n = S.queue.length; S.sync = 'send'; render();
    setTimeout(() => {
      S.queue = []; S.sync = 'ok';
      const inc = S.incPending; S.incPending = false;
      if (inc && S.inc && S.inc.status === 'queued') S.inc.status = 'sent';
      render(); toast(`Sent ${n} action(s). Recorded times are when you tapped.`, 'check');
      if (inc) toast('The dispatcher received your incident report.', 'check');
    }, 1500);
  }

  /* DR_06 helpers */
  const expLabel = e => e.type === 'other' ? 'Other: ' + (e.name || e.other || '') : ET[e.type].label;
  function exFields() { return S.ex.type === 'fuel' ? ['amt', 'lit', 'km'] : ['amt']; }
  function key(k) {
    const ex = S.ex, f = ex.field, max = { amt: 99999999, lit: 999, km: 9999999 }[f];
    let s = String(ex[f] || '');
    if (k === 'del') s = s.slice(0, -1);
    else s = s + k;
    let v = parseInt(s || '0', 10); if (v > max) return;
    ex[f] = v; render();
  }
  function exNext() {
    const ex = S.ex, fs = exFields(), i = fs.indexOf(ex.field);
    if (!ex[ex.field]) return;
    if (i < fs.length - 1) { ex.field = fs[i + 1]; render(); return; }
    const missing = fs.find(f => !ex[f]);
    if (missing) { ex.field = missing; render(); return; }
    ex.step = ex.pages || ex.noInv ? 4 : 3; render();
  }
  function exBack() {
    const ex = S.ex;
    if (ex.edit && ex.step === 4) { go('dr04'); return; }
    if (ex.step > 1) { ex.step = ex.step === 4 ? 3 : ex.step - 1; if (ex.step === 1 && ex.type !== 'other') {} render(); return; }
    if (ex.type || ex.amt) { S.dlg = { kind: 'discard' }; render(); return; }
    go('dr04');
  }
  function exSave() {
    const ex = S.ex;
    if (ex.err) { ex.err = false; }
    const e = { id: ex.edit || ++uid, type: ex.type, amt: ex.amt, time: S.clock, inv: ex.pages ? 1 : 0 };
    if (ex.type === 'fuel') { e.lit = ex.lit; e.km = ex.km; }
    if (ex.type === 'other') e.name = ex.other || 'Other expense';
    if (ex.edit) S.exp = S.exp.map(x => x.id === ex.edit ? Object.assign({}, x, e, { time: x.time }) : x); else S.exp.push(e);
    const label = `${expLabel(e)} ${vnd(e.amt)}`;
    if (S.offline) q(`Expense: ${label} · ${S.clock}`);
    go('dr04');
    toast(S.offline ? 'Saved. Will send when you\'re back online.' : `Saved: ${label}`, 'check');
  }

  /* ================= Render helpers ================= */
  function syncChip(dark) {
    const n = S.queue.length;
    if (S.sync === 'send') return `<button class="app-sync s-send" data-act="sync" aria-label="Sending…" title="Sending…">${ic('refresh')}</button>`;
    if (n) return `<button class="app-sync s-wait" data-act="sync" aria-label="Waiting for connection, ${n} action(s) waiting to send" title="Waiting for connection">${ic('clock')}<span class="app-syncn">${n}</span></button>`;
    return `<button class="app-sync s-ok" data-act="sync" aria-label="All sent" title="All sent">${ic('check')}</button>`;
  }
  function topbar(o) {
    const back = o.back ? `<button class="app-back" data-act="${o.backAct || 'go'}" data-arg="${o.backArg || ''}">${ic(o.backIcon || 'back')}<span>${o.backLabel || 'Back'}</span></button>` : '<span class="app-top-pad"></span>';
    return `<header class="app-top ${o.dark ? 'is-dark' : ''}">${back}<div class="app-title"><h1 class="${o.sm ? 'app-h-sm' : ''}">${o.title}</h1>${o.sub ? `<p>${o.sub}</p>` : ''}</div>${syncChip()}</header>`;
  }
  const banner = () => sharing() ? `<div class="app-banner" role="status">${ic('pin')}<span>Sharing location</span><button data-act="learn">Learn more</button></div>` : '';
  const alert = (kind, icon, body, actions) => `<div class="app-alert app-a-${kind}" role="${kind === 'danger' ? 'alert' : 'status'}">${ic(icon)}<div class="app-alert-b"><div>${body}</div>${actions ? `<div class="app-alert-act">${actions}</div>` : ''}</div></div>`;
  const badge = (kind, icon, text, extra) => `<span class="app-badge b-${kind}">${extra || ''}${ic(icon)}${text}</span>`;
  function countdown() {
    const left = (24 * 60 - mins(S.clock)) + 8 * 60; const h = Math.floor(left / 60);
    return `<div class="app-cd">${ic('clock')}<span>Empty return due: ${h} h left</span><b>Due soon</b></div>`;
  }
  function art(kind, n, blur) {
    const T = { eir: 'EQUIPMENT INTERCHANGE RECEIPT (EIR)', pod: 'DELIVERY RECEIPT', inv: 'VAT INVOICE', load: 'LOADING CONFIRMATION', other: 'DOCUMENT' }[kind];
    const sub = kind === 'eir' ? 'Container no.: MSKU1234567' : kind === 'inv' ? COMPANY : 'CH-0472 · Tân Uyên Industrial Park';
    return `<div class="app-paper ${blur ? 'is-blur' : ''}"><b>${T}</b><span class="app-psub">${sub}${n ? ' · Page ' + n : ''}</span><i></i><i class="s"></i><div class="app-ptab"><i></i><i></i><i></i><i></i></div><i></i><i class="s"></i><i></i><div class="app-psign"></div></div>`;
  }
  const skel = (rows) => `<div class="app-card app-sk">${rows.map(r => `<span class="sk ${r[1] || ''}" style="width:${r[0]}%"></span>`).join('')}</div>`;

  /* ================= DR_03 ================= */
  function tripStatus(t) {
    if (t.step === 0) return badge('info', 'bell', 'New trip — please accept');
    if (t.step === 1) return badge('info', 'check', 'Accepted');
    if (t.step <= 8) return badge('info', 'play', 'En route', '<span class="pulse"></span>');
    return settleBadge();
  }
  function settleBadge() {
    const s = S.st.status;
    if (s === 'pending') return badge('neutral', 'clock', 'Completed — awaiting accountant');
    if (s === 'need') return badge('warning', 'warn', 'More documents needed');
    if (s === 'confirm') return badge('info', 'hand', 'Settlement awaiting your confirmation');
    if (s === 'reviewing') return badge('neutral', 'clock', 'Accountant re-reviewing');
    return badge('success', 'lock', 'Settled');
  }
  function tripCard(t) {
    const I = INFO[t.id];
    if (t.step === 9) {
      const tot = S.exp.reduce((a, e) => a + e.amt, 0);
      const btn = ['confirm', 'need'].includes(S.st.status) ? `<button class="app-btn app-btn-primary" data-act="openSettle">View settlement ${ic('chevR')}</button>` : '';
      return `<article class="app-card app-trip app-mini" data-act="openSettle"><div class="app-trip-head"><span class="app-code">${t.id} · ${I.kind}</span>${tripStatus(t)}</div><div class="app-route">Cát Lái port → Tân Uyên Industrial Park</div><div class="app-kv"><span>Done:</span> <b>14:30 13/11</b></div><div class="app-kv"><span>Expenses logged:</span> <b>${vnd(tot)}</b></div>${btn}</article>`;
    }
    const isNew = t.step === 0;
    return `<article class="app-card app-trip ${S.hl === t.id ? 'is-hl' : ''}" data-act="openTrip" data-arg="${t.id}">
      <div class="app-trip-head"><span class="app-code">${t.id} · ${I.kind}</span>${tripStatus(t)}</div>
      <div class="app-route">${I.route}</div>
      ${isNew ? `<div class="app-kv"><b>${I.pick}</b></div>` : `<div class="app-next">${ic('chevR')}Next step: ${MS[t.step].next}</div>`}
      <div class="app-kv"><span>Container no.:</span> <b class="app-code">${I.cont}</b></div>
      ${isNew ? '<div class="app-kv"><span>Vehicle:</span> <b>51C-456.78 · Trailer 51R-123.45</b></div>' : ''}
      <div class="app-kv"><span>Cash advance:</span> <b>${vnd(I.adv)}</b></div>
      ${!isNew && t.step <= 7 ? countdown() : ''}
      <button class="app-btn app-btn-primary" data-act="openTrip" data-arg="${t.id}">${isNew ? 'View and accept trip' : 'Open trip'} ${ic('chevR')}</button>
    </article>`;
  }
  const oldCard = o => `<article class="app-card app-trip app-mini" data-act="openOld" data-arg="${o.id}"><div class="app-trip-head"><span class="app-code">${o.id} · ${o.kind}</span>${badge(o.b[0], o.b[1], o.b[2])}</div><div class="app-route">${o.route}</div><div class="app-kv"><span>${o.done.split(':')[0]}:</span> <b>${o.done.slice(o.done.indexOf(':') + 2)}</b></div><div class="app-kv"><span>Expenses logged:</span> <b>${vnd(o.cost)}</b></div></article>`;

  function vDR03() {
    const f = S.flags;
    let h = topbar({ title: 'My trips', sub: 'Nguyễn Văn Tuấn · 51C-456.78' });
    if (f.loading) {
      return h + `<div class="app-body">${skel([[40, 'h24'], [70], [55, 'h24'], [80], [50, 'h24']])}<div class="app-tabs" style="border-radius:var(--r-lg)"><button disabled>…</button><button disabled>…</button><button disabled>…</button></div>${skel([[45], [90, 'h24'], [70], [60], [100, 'h56']])}${skel([[45], [85, 'h24'], [65], [100, 'h56']])}<p class="app-note">Loading trips…</p></div>` + nav();
    }
    h += banner();
    const trips = Object.values(S.trips);
    const lists = { new: trips.filter(t => t.step === 0), run: trips.filter(t => t.step >= 1 && t.step <= 8), done: trips.filter(t => t.step === 9) };
    const doneAll = S.empty ? [] : lists.done.map(tripCard).concat(OLD.map(oldCard));
    if (!S.tab) S.tab = lists.run.length ? 'run' : lists.new.length ? 'new' : 'done';
    const T = t72();
    const holding = T && T.step >= 1 && S.st.status !== 'settled' ? INFO['CH-0472'].adv : 0;
    const waiting = T && T.step === 9 && S.st.status === 'confirm';
    const sd = settle().diff;
    let body = '';
    if (S.offline) body += alert('warn', 'noWifi', 'No connection. Showing data from 09:05. Your actions are still saved.');
    if (f.error) body += alert('danger', 'warn', 'Couldn\'t load trips. Showing the copy saved at 09:05.', '<button data-act="retry">Retry</button>');
    body += `<section class="app-money" aria-label="My money"><h2>My money</h2>
      <button class="app-mrow" disabled><span class="app-ml"><small>Cash advance held</small><b>${vnd(holding)}</b></span></button>
      ${waiting ? `<button class="app-mrow is-act" data-act="openSettle"><span class="app-ml"><small>Settlement awaiting your confirmation — 1 trip</small><b>${sd >= 0 ? 'Pay back ' + vnd(sd) : 'Receive ' + vnd(-sd)}</b></span>${ic('chevR')}</button>`
        : `<button class="app-mrow" disabled><span class="app-ml"><small>Settlements awaiting your confirmation</small><b class="app-mnone">None yet</b></span></button>`}
      <button class="app-mrow" data-act="salary"><span class="app-ml"><small>Trip pay this period (01–15/11)</small><b>${vnd(4850000)}</b></span>${ic('chevR')}</button>
    </section>`;
    if (S.empty) {
      body += `<div class="app-emptystate">${ic('truck', 'app-i40')}<h3>No trips yet</h3><p>When the dispatcher assigns you a trip, you'll get a notification here.</p><button class="app-btn app-btn-primary" data-act="call">${ic('call')}Call dispatcher</button></div>`;
      return h + `<div class="app-body">${body}</div>` + nav();
    }
    const tabs = `<div class="app-tabs" role="tablist">${[['new', 'New', lists.new.length], ['run', 'En route', lists.run.length], ['done', 'Done', doneAll.length]].map(([k, l, n]) => `<button role="tab" aria-selected="${S.tab === k}" data-act="tab" data-arg="${k}">${l} (${n})</button>`).join('')}</div>`;
    let cards = S.tab === 'done' ? doneAll.join('') : lists[S.tab].map(tripCard).join('');
    if (!cards) cards = `<div class="app-emptystate">${ic('truck', 'app-i40')}<h3>${S.tab === 'new' ? 'No new trips' : 'No trips in progress'}</h3><p>${S.tab === 'new' ? 'New trips will show up here with a notification.' : 'Open the "New" tab to accept trips.'}</p></div>`;
    return h + `<div class="app-body">${body}${tabs}${cards}</div>` + nav();
  }
  const nav = () => { const c = k => S.screen === k ? 'aria-current="page"' : ''; return `<nav class="app-nav" aria-label="Main navigation"><button ${c('dr03')} data-act="go" data-arg="dr03">${ic('truck', 'app-i28')}Trips</button><button ${c('dr09')} data-act="salary">${ic('wallet', 'app-i28')}Pay</button><button ${c('dr11')} data-act="account">${ic('user', 'app-i28')}Account</button></nav>`; };

  /* ================= DR_04 ================= */
  function dest(t) {
    const s = t.step;
    if (s <= 3) return { lbl: s === 0 ? 'Pick up at' : 'Heading to', name: 'Cát Lái port', lines: ['Nguyễn Thị Định Street, Thủ Đức City, TP.HCM', INFO[t.id].pick], short: 'Cát Lái port, Thủ Đức City' };
    if (s <= 5) return { lbl: 'Heading to', name: 'Hưng Thịnh warehouse — Lot C5, Tân Uyên Industrial Park, Bình Dương', lines: ['Delivery time: 11:00 today', 'Receiver: Ms Mai · 0908 xxx 215'], short: 'Hưng Thịnh warehouse, Tân Uyên Industrial Park' };
    return { lbl: 'Heading to', name: 'Phước Long depot — empty return yard', lines: ['Đỗ Xuân Hợp Street, Thủ Đức City, TP.HCM', 'Empty return due: 08:00 14/11'], short: 'Phước Long depot, Thủ Đức City' };
  }
  function vDR04() {
    const t = trip(), I = INFO[t.id], f = S.flags;
    let h = topbar({ back: true, backArg: 'dr03', title: `${t.id} · ${I.kind}`, sub: `${I.cont} · 51C-456.78`, sm: true });
    if (f.loading) return h + `<div class="app-body">${skel([[30], [90, 'h24'], [70], [60], [100, 'h56']])}<span class="sk" style="height:236px;border-radius:12px"></span><p class="app-note">Loading trip…</p></div>`;
    h += banner();
    let b = '';
    if (S.offline) b += alert('warn', 'noWifi', 'No connection. Milestones are still logged at the time you tap and sent automatically once you\'re back online.');
    if (f.error) b += alert('danger', 'block', '<b>The dispatcher changed this trip.</b> The milestone button is locked for now.', '<button data-act="call">Call dispatcher</button>');
    if (t.step === 9) {
      b += `<div class="app-doneblock">${ic('check', 'app-i40')}<b>Trip done — awaiting settlement by the accountant</b><span>Completed at 14:30 · Expenses logged: ${S.exp.length} items · ${vnd(S.exp.reduce((a, e) => a + e.amt, 0))}</span></div>`;
      b += `<div class="app-icons n2"><button class="app-ia" data-act="expense">${ic('plus')}Expenses</button><button class="app-ia" data-act="freeCam">${ic('camera')}Capture documents</button></div>`;
      b += `<button class="app-link" data-act="details">View trip details ${ic('chevR')}</button>`;
      return h + `<div class="app-body">${b}</div>`;
    }
    const d = dest(t), m = MS[t.step];
    b += `<section class="app-card app-dest"><span class="app-lbl">${d.lbl}</span><h2>${d.name}</h2>${d.lines.map(l => `<p>${l}</p>`).join('')}${t.step >= 1 && t.step <= 7 && t.id === 'CH-0472' ? countdown() : ''}
      <div class="app-2"><button class="app-btn app-btn-secondary" data-act="maps">${ic('nav')}Directions</button><button class="app-btn app-btn-secondary" data-act="call">${ic('call')}<span>Call dispatcher<small>Hằng</small></span></button></div></section>`;
    const bigKey = t.id + ':' + t.step, isNext = lastBig && lastBig !== bigKey && lastBig.split(':')[0] === t.id; lastBig = bigKey;
    b += `<button class="app-big ${isNext ? 'is-next' : ''}" data-act="ms" ${f.error ? 'disabled' : ''} aria-label="Step ${t.step + 1} of 9: ${m.btn}. ${m.sub}">
      <span class="app-step">Step ${t.step + 1}/9</span><span class="app-bigt">${m.btn}</span><span class="app-bigs">${m.cam ? ic('camera') : ''}${f.error ? 'Locked for now — call dispatcher' : m.sub}</span></button>`;
    b += t.step === 0
      ? `<div class="app-icons n1"><button class="app-ia" data-act="permit">${ic('doc')}Waybill</button></div>`
      : `<div class="app-icons"><button class="app-ia" data-act="expense" ${f.error ? 'disabled' : ''}>${ic('plus')}Expenses</button><button class="app-ia" data-act="freeCam" ${f.error ? 'disabled' : ''}>${ic('camera')}Capture documents</button><button class="app-ia" data-act="incident">${ic('warn')}Report incident</button><button class="app-ia" data-act="permit">${ic('doc')}Waybill</button></div>`;
    b += `<button class="app-link" data-act="details">View trip details ${ic('chevR')}</button>`;
    return h + `<div class="app-body ${S.undo ? 'is-pad-b' : ''}">${b}</div>`;
  }

  /* ================= DR_05 ================= */
  function vDR05() {
    const c = S.cam;
    if (c.pick) {
      return topbar({ back: true, backIcon: 'x', backLabel: 'Cancel', backAct: 'camCancel', title: 'Capture documents', sub: 'CH-0472 · MSKU1234567' }) +
        `<div class="app-body"><h2 class="app-h">Which document are you capturing?</h2><div class="app-grid">${['eir1', 'eir2', 'pod', 'load'].map(k => `<button class="app-gcell" data-act="pickType" data-arg="${k}">${ic(DOCS[k].icon)}${DOCS[k].grid}</button>`).join('')}<button class="app-gcell is-wide" data-act="pickType" data-arg="other">${ic('clip')}Other</button></div></div>`;
    }
    const d = DOCS[c.type];

    if (c.noperm) {
      return top + `<div class="app-body"><div class="app-emptystate" style="padding-top:80px">${ic('camera', 'app-i40')}<h3>Allow camera access to capture documents</h3><p>Tap the button below, then choose "Allow".</p></div></div><div class="app-camdone is-light"><button class="app-btn app-btn-primary" data-act="grant">${ic('gear')}Open camera settings</button></div>`;
    }

    if (c.type === 'pod') h += `<div class="app-seg" role="group" aria-label="How to capture proof of delivery"><button aria-pressed="${c.mode === 'photo'}" data-act="seg" data-arg="photo">${c.mode === 'photo' ? ic('check') : ic('camera')}Take photo</button><button aria-pressed="${c.mode === 'sign'}" data-act="seg" data-arg="sign">${c.mode === 'sign' ? ic('check') : ic('pen')}Sign on phone</button></div>`;
    if (c.from === 'dr08') h += alert('warn', 'info', '<b>Accountant needs:</b> A photo of the 50,000 ₫ parking invoice — the old one is blurry, please retake.');
    if (c.storage) h += alert('danger', 'warn', 'Phone storage is full. Delete some old photos, then try again.', '<button data-act="storageFix">Deleted, try again</button>');
    if (c.blur) h += alert('warn', 'warn', 'Photo is a bit blurry. Retake so the text is clear?', '<button data-act="blurRetake">Retake</button><button data-act="blurKeep">Use anyway</button>');
    if (c.mode === 'sign') {
      h += `<div class="app-signwrap"><p>Hand the phone to the receiver to sign here</p><div class="app-pad"><div class="app-padl"><span>Signature</span></div><canvas id="sig" aria-label="Signature area"></canvas></div>
        <button class="app-btn app-btn-secondary app-btn-sm" data-act="signClear" style="align-self:flex-start">${ic('refresh')}Sign again</button>
        <label class="app-field"><span>Receiver's full name</span><input class="app-input" id="podName" value="${esc(c.name)}" placeholder="e.g. Trần Thị Mai" autocomplete="off"></label></div>`;
      h += `</div><div class="app-camdone"><button class="app-btn app-btn-primary" id="signDone" data-act="camDone" ${c.strokes.length && c.name.trim() ? '' : 'disabled'}>${ic('check')}Done — send signature</button></div>`;
      return h;

    h += `<div class="app-vf ${c.flash ? 'flash' : ''}">${photo ? `<img class="app-photo" src="${photo}" alt="Photo from phone">` : art(d.art, c.retake != null ? c.retake + 1 : c.pages.length + 1)}
      ${d.art === 'eir' ? `<div class="app-vftop">${ic('info')}Check the container no. on the EIR: MSKU1234567</div>` : ''}
      <div class="app-frame"><i></i><i></i><i></i><i></i></div><div class="app-vfhint">${c.retake != null ? `Retake page ${c.retake + 1}` : `Fit the whole ${d.art === 'inv' ? 'invoice' : 'document'} inside the frame`}</div></div>`;

    h += `<div class="app-cambar"><button class="app-camact" data-act="flash" aria-pressed="${c.flash}">${ic('flash')}${c.flash ? 'Turn off flash' : 'Turn on flash'}</button>
      <button class="app-shutter" data-act="shoot" ${c.storage ? 'disabled' : ''} aria-label="Capture page">${ic('camera')}SNAP</button>
      <label class="app-camact" style="position:relative">${ic('image')}Gallery<input type="file" accept="image/*" capture="environment" data-file="cam"></label></div>`;
    h += '</div>';

    else h += '<div class="app-camdone" style="padding-bottom:28px"></div>';
    return h;
  }

  /* ================= DR_06 ================= */
  function vDR06() {
    const ex = S.ex;
    const others = S.exp.filter(e => e.id !== ex.edit);
    const spent = others.reduce((a, e) => a + e.amt, 0), left = S.adv - spent;
    let h = topbar({ back: true, backAct: 'exBack', title: ex.edit ? 'Edit expense' : 'Log costs', sub: 'CH-0472 · 51C-456.78' });
    h += left >= 0 ? `<div class="app-adv">${ic('wallet')}<span>Advance <b>${vnd(S.adv)}</b> · logged <b>${vnd(spent)}</b> · left <b>${vnd(left)}</b></span></div>`
      : `<div class="app-adv is-over">${ic('warn')}<span>Spent <b>${vnd(-left)}</b> over your cash advance</span></div>`;
    const stepper = n => `<div class="app-stepper">Step ${n}/4 · ${['Choose type', 'Amount', 'Capture invoice', 'Review & save'][n - 1]}</div>`;
    let b = '';
    if (ex.step === 1) {
      b += stepper(1) + `<h2 class="app-h">What did you pay for?</h2><div class="app-grid">${['fuel', 'toll', 'lift', 'load'].map(k => `<button class="app-gcell" data-act="exType" data-arg="${k}" aria-pressed="${ex.type === k}">${ic(ET[k].icon)}${ET[k].label}</button>`).join('')}<button class="app-gcell is-wide" data-act="exType" data-arg="other" aria-pressed="${ex.type === 'other'}">${ic('plus')}Other</button></div>`;
      if (ex.type === 'other') b += `<label class="app-field"><span>What for?</span><input class="app-input" id="exOther" value="${esc(ex.other)}" placeholder="e.g. Overnight parking" autocomplete="off"></label><button class="app-btn app-btn-primary" id="exOtherNext" data-act="exOtherNext" ${ex.other.trim() ? '' : 'disabled'}>Next ${ic('chevR')}</button>`;
      return h + `<div class="app-body">${b}</div>`;
    }
    if (ex.step === 2) {
      const fs = exFields();
      const fmtF = (f, v) => !v ? (f === 'amt' ? '0 ₫' : f === 'lit' ? '— l' : '— km') : f === 'amt' ? vnd(v) : f === 'lit' ? `${grp(v)} l` : `${grp(v)} km`;
      b += `<div class="app-stepper">Step 2/4 · Amount · <b style="color:var(--fg-strong)">${esc(expLabel(ex))}</b></div>`;
      if (fs.length === 1) b += `<div class="app-amt"><small>Amount</small><b class="${ex.amt ? '' : 'is-empty'}">${fmtF('amt', ex.amt)}</b></div>`;
      else {
        b += `<div class="app-fields">${fs.map(f => `<button class="app-fld ${ex.field === f ? 'is-on' : ''}" data-act="exField" data-arg="${f}"><span class="app-arrow">${ex.field === f ? '▶' : ''}</span><span class="app-fl">${{ amt: 'Amount', lit: 'Liters', km: 'Odometer km' }[f]}</span><span class="app-fv ${ex[f] ? '' : 'is-empty'}">${fmtF(f, ex[f])}</span></button>`).join('')}</div>`;
        const info = [];
        if (ex.amt && ex.lit) info.push(`≈ <b>${grp(Math.round(ex.amt / ex.lit))} ₫/l</b>`);
        if (ex.km && ex.km < PREV_KM) b += alert('warn', 'warn', `Odometer is lower than at the last refuel (${grp(PREV_KM)} km). Check again?`);
        else if (ex.km) info.push(`${grp(ex.km - PREV_KM)} km since the last refuel`);
        if (info.length) b += `<div class="app-alert app-a-info" style="padding:8px 12px">${ic('info')}<div>${info.join(' · ')}</div></div>`;
      }
      const keys = `<div class="app-keys">${['1', '2', '3', '4', '5', '6', '7', '8', '9'].map(k => `<button class="app-key" data-act="key" data-arg="${k}">${k}</button>`).join('')}<button class="app-key" data-act="key" data-arg="000">000</button><button class="app-key" data-act="key" data-arg="0">0</button><button class="app-key is-fn" data-act="key" data-arg="del" aria-label="Delete one digit">${ic('bksp')}Delete</button></div>`;
      const last = ex.field === fs[fs.length - 1];
      return h + `<div class="app-body" style="gap:8px">${b}</div><div class="app-foot is-pad">${keys}<button class="app-btn app-btn-primary" data-act="exNext" ${ex[ex.field] ? '' : 'disabled'}>${last ? 'Next' : 'Next field'} ${ic('chevR')}</button></div>`;
    }
    if (ex.step === 3) {

      <div class="app-li ${ex.pages ? '' : 'is-warn'}">${ic(ex.pages ? 'receipt' : 'warn', 'app-i28')}<div class="app-lt"><b>${ex.pages ? `${ex.pages}-page invoice ✓` : 'Missing invoice'}</b><small>${ex.pages ? 'Made out to ' + COMPANY.replace('CÔNG TY TNHH ', 'Cty ').toLowerCase().replace(/(^|\s)\S/g, s => s.toUpperCase()) : 'The accountant may not approve this item'}</small></div>${edit(3)}</div>
      <div class="app-li">${ic('clock', 'app-i28')}<div class="app-lt"><b>Logged at ${S.clock} today</b><small>The recorded time is when you tap Save</small></div></div></section>`;

  }

  /* ================= DR_08 ================= */
  function vDR08() {

      : st.status === 'need' ? (s.lines.some(l => l.st === 'need') ? badge('warning', 'warn', 'More documents needed (1 item)') : badge('neutral', 'clock', 'Resubmitted — awaiting accountant'))
      : st.status === 'reviewing' ? badge('neutral', 'clock', 'Awaiting accountant re-review')
      : st.status === 'pending' ? badge('neutral', 'clock', 'Awaiting accountant check')
      : badge('success', 'lock', 'Settled');
    b += `<div>${statusBadge}</div>`;
    const concluded = st.status !== 'pending' && !s.open;
    let concl = `<section class="app-card" style="padding:0"><div class="app-concl">
      <div class="app-cr"><span>Cash advance received</span><b>${vnd(S.adv)}</b></div>`;
    if (st.status === 'pending') {
      concl += `<div class="app-cr"><span>Logged (${s.lines.length} items)</span><b>${vnd(s.total)}</b></div><div class="app-result is-none"><p>⏳ The accountant is checking each item.</p><small>You'll get a notification to confirm once it's done.</small></div>`;
    } else if (!concluded) {
      concl += `<div class="app-cr"><span>Logged (${s.lines.length} items)</span><b>${vnd(s.total)}</b></div><div class="app-result is-none"><p>Not finalized yet. Add the missing documents so they can be counted.</p><small>The amount to pay back or receive will show once the accountant finalizes.</small></div>`;
    } else {
      const out = s.diff >= 0;
      concl += `<button class="app-cr ${st.changed ? 'is-changed' : ''}" data-act="scrollList"><span>Approved (${s.appr.length} items)</span><b>− ${vnd(s.apprSum)}</b></button>
        <div class="app-result ${out ? '' : 'is-in'} ${st.changed ? 'is-changed' : ''}"><p>${out ? 'You owe the company:' : 'The company owes you:'}</p><b>${vnd(Math.abs(s.diff))}</b>
        <span class="app-formula">${vnd(S.adv)} − ${vnd(s.apprSum)} = ${s.diff < 0 ? '−' : ''}${vnd(Math.abs(s.diff))}</span>
        <small>${out ? 'Pay at the Thủ Đức office or by bank transfer as the accountant instructs.' : 'The accountant pays you by bank transfer or in cash at the Thủ Đức office.'}</small></div>`;
    }
    concl += '</div></section>';
    b += concl;
    const stB = l => l.st === 'ok' ? badge('success', 'check', 'Approved') : l.st === 'rej' ? badge('danger', 'x', 'Not approved') : l.st === 'need' ? badge('warning', 'warn', 'Needs more info') : l.st === 'supplied' ? badge('neutral', 'clock', 'Resubmitted — awaiting accountant') : badge('neutral', 'clock', 'Awaiting accountant check');
    b += `<section class="app-card app-xlist" id="xlist"><h2 class="app-h">Logged expenses</h2>${s.lines.map(l => `<div class="app-xl" data-act="viewInv" data-arg="${l.id}">

      ${l.type === 'fuel' ? `<small>${l.lit} l · odometer ${grp(l.km)} km</small>` : ''}${stB(l)}
      ${l.reason ? `<div class="app-reason ${l.st === 'rej' ? 'r-danger' : 'r-warn'}">${l.reason}${l.st === 'rej' ? '<br><b>Not counted in approved expenses.</b>' : ''}</div>` : ''}
      ${l.st === 'need' ? `<button class="app-btn app-btn-primary" data-act="supplement">${ic('camera')}Take new photo</button>` : ''}</div>`).join('')}</section>`;
    b += `<button class="app-btn app-btn-secondary" data-act="call" data-arg="acc">${ic('call')}<span>Call accountant · Khoa</span></button>`;
    let foot = '';
    if (st.status === 'confirm' || st.status === 'need') {
      const canConfirm = st.status === 'confirm' && !s.open && st.lockLeft <= 0;
      foot = `<button class="app-btn app-btn-primary" id="btnConfirm" data-act="confirm" ${canConfirm ? '' : 'disabled'}>${ic('check')}${st.lockLeft > 0 ? `Check the new figures (${st.lockLeft})` : 'Confirm settlement'}</button>`;

      foot += `<button class="app-btn app-btn-secondary" data-act="disagree">Disagree</button>`;
    } else if (st.status === 'reviewing') foot = alert('neutral', 'clock', 'The accountant is reviewing your feedback.');
    else if (st.status === 'settled') foot = alert('success', 'lock', `You confirmed at ${st.confirmedAt}. Questions? Call the accountant.`);
    return h + `<div class="app-body">${b}</div>${foot ? `<div class="app-foot">${foot}</div>` : ''}`;
  }

  function qrSvg(seed, label) {
    const N = 29, m = [];
    let x = seed >>> 0; const rnd = () => (x = (Math.imul(x, 1664525) + 1013904223) >>> 0) / 4294967296;
    for (let r = 0; r < N; r++) { m[r] = []; for (let c = 0; c < N; c++) m[r][c] = rnd() < .47; }
    const pat = (R, C, size, dark) => { for (let r = -1; r <= size; r++) for (let c = -1; c <= size; c++) { const rr = R + r, cc = C + c; if (rr < 0 || cc < 0 || rr >= N || cc >= N) continue; m[rr][cc] = dark(Math.max(Math.abs(r - (size - 1) / 2), Math.abs(c - (size - 1) / 2))); } };
    const finder = ring => ring === 3 || ring <= 1;
    pat(0, 0, 7, finder); pat(0, N - 7, 7, finder); pat(N - 7, 0, 7, finder);
    for (let i = 8; i < N - 8; i++) { m[6][i] = i % 2 === 0; m[i][6] = i % 2 === 0; }
    for (let r = -2; r <= 2; r++) for (let c = -2; c <= 2; c++) { const ring = Math.max(Math.abs(r), Math.abs(c)); m[22 + r][22 + c] = ring !== 1; }
    let d = '';
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (m[r][c]) d += `M${c} ${r}h1v1h-1z`;
    return `<svg class="app-qr" viewBox="-3 -3 ${N + 6} ${N + 6}" shape-rendering="crispEdges" role="img" aria-label="${esc(label)}"><path d="${d}"/></svg>`;
  }
