<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Import data from Excel · Đội Xe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700&family=Inter:wght@400;500;600;700&display=swap&subset=vietnamese">
<link rel="stylesheet" href="../assets/css/app.css">
<style>
  [hidden] { display: none !important; }
  .stepper { display: flex; align-items: center; gap: 0; padding: 2px 0; }
  .stepper button { border: 0; background: none; display: flex; align-items: center; gap: 8px; font: 500 13.5px var(--font-body); color: var(--fg-muted); padding: 4px 6px; border-radius: var(--r-sm); cursor: default; white-space: nowrap; }
  .stepper button .n { width: 24px; height: 24px; border-radius: 50%; background: var(--surface); box-shadow: inset 0 0 0 1px var(--border-strong); display: grid; place-items: center; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stepper button.done { color: var(--fg); cursor: pointer; }
  .stepper button.done:hover { background: var(--surface-muted); }
  .stepper button.done .n { background: var(--success-soft); box-shadow: none; color: var(--success-fg); }
  .stepper button.cur { color: var(--primary); font-weight: 600; }
  .stepper button.cur .n { background: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); color: var(--on-primary); }
  .stepper .line { flex: 1; height: 2px; border-radius: 1px; background: var(--border); margin: 0 12px; min-width: 24px; }
  .stepper .line.done { background: var(--success-solid); }
  .s1 { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: var(--s-4); align-items: stretch; }
  .s1 > .card { display: flex; flex-direction: column; min-width: 0; }
  .s1 > .card > .card-body { flex: 1; }
  .rcards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .rc { border: 1px solid var(--border); border-radius: var(--r-md); padding: 10px 12px; display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 2px 8px; cursor: pointer; font-size: 13.5px; background: var(--surface); }
  .rc input { margin: 2px 0 0; accent-color: var(--primary); }
  .rc b { font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .rc small { grid-column: 2; color: var(--fg-muted); font-size: 12.5px; line-height: 16px; }
  .rc:hover { border-color: var(--border-strong); }
  .rc:has(input:checked) { border-color: var(--primary); background: var(--primary-soft); box-shadow: inset 0 0 0 1px var(--primary); }
  .drop { border: 1.5px dashed var(--border-strong); border-radius: var(--r-lg); background: var(--surface-muted); padding: 32px 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; transition: border-color .12s, background-color .12s; }
  .drop.over { border-color: var(--primary); background: var(--primary-soft); }
  .drop > .icon { width: 36px; height: 36px; stroke-width: 1.25; color: var(--fg-muted); }
  .drop.err { border: 0; padding: 0; background: none; }
  .filechip { display: flex; align-items: center; gap: 10px; border: 0; border-radius: 8px; padding: 10px 12px; background: var(--surface-muted); }
  .filechip .ficon { width: 34px; height: 34px; border-radius: var(--r-md); background: var(--success-soft); color: var(--success-fg); display: grid; place-items: center; }
  .exits a, .exits button { justify-content: flex-start; align-items: flex-start; width: 100%; height: auto; padding: 10px; border-radius: 8px; text-align: left; white-space: normal; line-height: 18px; }
  .exits .icon { margin-top: 1px; flex: none; }
  .exits .cell-sub { font-weight: 400; color: var(--fg-muted); margin-top: 2px; }
  .field .input { width: 100%; }
  .map td { padding: 6px 12px; height: 58px; }
  .map td.samples { color: var(--fg-muted); font-size: 12.5px; }
  .map .samples .code { color: var(--fg); background: var(--surface-muted); border: 0; border-radius: var(--r-sm); padding: 1px 6px; margin-right: 4px; font-size: 12px; font-weight: 500; }
  .map select.input { width: 240px; height: 30px; }
  .map tr.need td:first-child { box-shadow: inset 3px 0 0 var(--warning-solid); }
  .map tr.dupmap select { border-color: var(--danger-solid); }
  .pv-wrap { max-height: calc(100vh - 380px); min-height: 280px; overflow: auto; }
  .pv td { height: 62px; padding: 6px 10px; vertical-align: middle; }
  .pv th { padding-left: 10px; padding-right: 10px; }
  .pv .cell-in { width: 116px; }
  .pv th:nth-child(1), .pv td:nth-child(1) { position: sticky; left: 0; z-index: 1; width: 64px; }
  .pv th:nth-child(2), .pv td:nth-child(2) { position: sticky; left: 64px; z-index: 1; box-shadow: inset -1px 0 0 var(--border); }
  .pv th:nth-child(1), .pv th:nth-child(2) { z-index: 3; }
  .pv td:nth-child(1), .pv td:nth-child(2) { background: var(--surface); }
  .pv tr:hover td { background: var(--surface-muted); }
  .cellv { display: inline-block; min-width: 72px; border: 1px solid transparent; border-radius: var(--r-sm); padding: 2px 6px; margin: 0 -6px; cursor: text; min-height: 24px; line-height: 20px; }
  .cellv:hover { border-color: var(--border-strong); background: var(--surface); }
  .cellv.bad { border-color: var(--danger-solid); background: var(--surface); color: var(--danger-fg); }
  .cellv.empty-v { color: var(--fg-subtle); font-style: italic; }
  .pv .cell-in { height: 28px; width: 130px; border: 1px solid var(--primary); border-radius: var(--r-sm); padding: 0 6px; font: 13.5px var(--font-body); outline: 2px solid var(--ring); outline-offset: 1px; }
  .pv .cell-in.bad { border-color: var(--danger-solid); outline-color: var(--danger-solid); }
  .emsg { display: flex; align-items: flex-start; gap: 4px; font-size: 11.5px; line-height: 14px; color: var(--danger-fg); margin-top: 2px; white-space: normal; max-width: 170px; }
  .emsg .icon { margin-top: 1px; flex: none; }
  .pv td:nth-child(3) { min-width: 116px; }
  .pv td.right .emsg { display: block; margin-left: auto; text-align: right; }
  .pv td.right .emsg .icon { display: inline-block; vertical-align: -2px; margin: 0 3px 0 0; }
  .emsg .icon { width: 12px; height: 12px; }
  .xb { display: flex; align-items: center; gap: 3px; font-size: 11.5px; line-height: 15px; margin-top: 2px; white-space: nowrap; }
  .xb .icon { width: 12px; height: 12px; }
  .xb.d { color: var(--danger-fg); } .xb.w { color: var(--warning-fg); }
  .pv select.input { height: 30px; width: 170px; }
  .gridfoot { padding: 12px 16px 14px; }
  .manual td { padding: 6px 8px; vertical-align: top; }
  .manual .input { height: 30px; width: 100%; }
  .manual .input.bad { border-color: var(--danger-solid); }
  .footbar { position: sticky; bottom: 0; z-index: 15; margin: 0 calc(-1 * var(--s-6)) calc(-1 * var(--s-6)); padding: 12px var(--s-6); background: var(--bg); border-top: 1px solid transparent; display: flex; gap: 8px; align-items: center; justify-content: flex-end; transition: border-color var(--d-2, 180ms), background-color var(--d-2, 180ms); }
  .footbar.stuck { border-top-color: var(--border); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: saturate(1.2) blur(8px); }
  .summary { display: grid; grid-template-columns: minmax(300px, 1.6fr) repeat(3, minmax(0, 1fr)); gap: 6px; padding: 6px; background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-card); }
  .sum-main { padding: 18px 22px; background: var(--primary-soft); border-radius: 8px; display: flex; flex-direction: column; gap: 4px; }
  .sum-main .k { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--side-active); }
  .sum-main .v { font: 700 var(--text-display)/40px var(--font-display); color: var(--fg-strong); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .sum-main .v small, .sum-item .v small { font: 600 15px var(--font-body); color: var(--fg-muted); margin-left: 2px; }
  .sum-main .d { font-size: 12.5px; color: var(--fg-muted); }
  .sum-item { padding: 18px 16px; display: flex; flex-direction: column; justify-content: center; gap: 4px; min-width: 0; border: 0; background: none; border-radius: 8px; text-align: left; font: inherit; color: inherit; }
  button.sum-item { cursor: pointer; }
  button.sum-item:hover { background: var(--surface-muted); }
  .sum-item .k { font-size: 12.5px; color: var(--fg-muted); font-weight: 500; }
  .sum-item .v { font: 700 24px/30px var(--font-display); color: var(--fg-strong); font-variant-numeric: tabular-nums; }
  .sum-item .d { font-size: 12.5px; color: var(--fg-muted); display: inline-flex; gap: 4px; align-items: center; }
  .sum-item.is-err .v { color: var(--danger-fg); }
  .sum-item.is-err .d { color: var(--primary); font-weight: 500; }
  #app-content > * { flex: none; }
  @media (max-width: 1100px) { .s1 { grid-template-columns: 1fr; } .rcards { grid-template-columns: repeat(2, minmax(0, 1fr)); } .summary { grid-template-columns: repeat(3, minmax(0, 1fr)); } .sum-main { grid-column: 1 / -1; } }
</style>
</head>
<body>
<div id="app-content">
  <div class="page-header">
    <div>
      <div class="crumb" id="crumb">Fleet / Import data</div>
      <h1>Import data from Excel</h1>
    </div>
    <div class="actions"><button class="btn btn-secondary" type="button" id="btnExit">${'Exit'}</button></div>
  </div>
  <nav class="stepper" id="stepper" aria-label="Import steps"></nav>
  <div id="stepBody" class="stack" style="gap:16px"></div>
  <div class="footbar" id="footbar"></div>
</div>

<script src="../assets/js/shell.js"></script>
<script src="../assets/js/data.js"></script>
<script>
const { icon, fmt, toast } = Shell;
Shell.mount({ active: 'FM_14', title: 'Import data from Excel' });
document.getElementById('btnExit').textContent = 'Exit';
const NA = 'href="javascript:void(0)" title="not in this prototype"';
const $ = id => document.getElementById(id);
const TODAY = new Date(2026, 10, 12);

const TYPES = [
  ['vehicle', 'Vehicles & trailers', 'License plate, vehicle type, capacity, inspection, insurance and operating badge expiry', 'truck'],
  ['driver', 'Driver', 'Name, phone, license class, license expiry', 'user'],
  ['doc', 'Documents', 'Holder, document type, number, expiry date', 'doc'],
  ['customer', 'Customer', 'Name, tax ID, address, contact person', 'users'],
  ['place', 'Location', 'Warehouses, ports, depots, coordinates', 'map'],
  ['route', 'Routes', 'Origin, destination, standard km, toll stations', 'route']
];
const SHEETS = [['Vehicle list 2026', 126], ['Trailers', 40], ['Driver', 31]];
const FIELDS = ['License plate', 'Vehicle type', 'Capacity (t)', 'Inspection expiry', 'Insurance expiry', 'Operating badge expiry', 'Make', 'Year of manufacture', 'Chassis number', 'Regular driver', 'Branch'];
const REQUIRED = ['License plate', 'Vehicle type', 'Capacity (t)'];
const COLS0 = [
  ['Plate No.', ['51C12345', '51C 678.90'], 'License plate'],
  ['Truck type', ['Tractor unit', 'Truck'], ''],
  ['Tonnage', ['30', '15'], 'Capacity (t)'],
  ['Insp. expiry', ['15/03/2027', '46100'], 'Inspection expiry', 'Date format: dd/mm/yyyy and Excel serial dates'],
  ['Ins. expiry', ['02/11/2026', '12/25/2027'], 'Insurance expiry', 'Date format: dd/mm/yyyy'],
  ['Operating badge expiry', ['20/12/2026', '30/06/2027'], 'Operating badge expiry', 'Date format: dd/mm/yyyy'],
  ['Make', ['Hyundai', 'Hino'], 'Make'],
  ['Mfg. year', ['2019', '2021'], 'Year of manufacture'],
  ['Chassis number', ['KMFGA17PPLC0…', 'JHDFG8JN…'], 'Chassis number'],
  ['Driver name', ['Nguyễn Văn Tuấn', 'Lê Hoàng Phúc'], ''],
  ['Note', ['New tires fitted', '—'], '__skip']
];
const ROWS0 = [
  [12, '51C12345', 'Tractor unit', '30', '15/03/2027', '02/11/2026', '20/12/2026'],
  [13, '51C-602.17', 'Tractor unit', '30', '08/06/2027', '14/01/2027', '30/06/2027'],
  [14, '51D 456.78', 'Tractor unit', '30', '19/01/2027', '22/02/2027', '15/04/2027'],
  [15, '51C-618.40', 'Truck', '15', '21/11/2026', '05/05/2027', '12/08/2027'],
  [18, '51C-745.12', 'Tractor unit', '30', '31/02/2027', '11/03/2027', '30/09/2027'],
  [19, '61C-118.56', 'Tractor unit', '30', '46100', '18/07/2027', '18/07/2027'],
  [23, '51D-233.09', '', '15', '02/04/2027', '09/12/2026', '09/12/2026'],
  [27, '51C-099.21', 'Tractor unit', '30', '02/11/2026', '25/04/2027', '25/04/2027'],
  [31, '51C-820.33', 'Tractor unit', '30', '17/05/2027', '04/11/2026', '10/10/2027'],
  [45, '51C-588.02', 'Truck', '15', '13/02/2027', '13/02/2027', '13/02/2027'],
  [52, '51D-517.64', 'Truck', 'thirty', '06/09/2027', '06/09/2027', '06/09/2027'],
  [58, '61C 220.14', 'Tractor unit', '30', '28/12/2026', '28/12/2026', '28/12/2026'],
  [67, '51C 588.02', 'Truck', '15', '13/02/2027', '13/02/2027', '13/02/2027'],
  [71, '51C-904.28', 'Tractor unit', '30', '01/08/2027', '12/25/2027', '01/08/2027'],
  [88, '50H-112.07', '', '15', '30/02/2027', '19/06/2027', '19/06/2027'],
  [103, '51C12', 'Tractor unit', '30', '03/03/2027', '03/03/2027', '03/03/2027'],
  [104, '51C-377.91', 'Tractor unit', '30', '27/11/2026', '14/09/2027', '14/09/2027'],
  [109, '51D-640.25', 'Truck', '15', '11/10/2027', '11/10/2027', '11/10/2027']
];
const TOTAL = 126, HIDDEN_VALID = TOTAL - ROWS0.length;
const EXISTING = new Set(FM.vehicles.map(v => v.plate));

let S;
function reset() {
  S = { step: 1, type: 'vehicle', branch: 'TP.HCM', file: null, sheet: 'Vehicle list 2026', fileErr: false, readErr: false, sheetEmpty: false, loading: false,
    cols: COLS0.map(c => ({ name: c[0], samples: c[1], field: c[2], hint: c[3], auto: !!c[2] })), dateMode: null,
    rows: ROWS0.map(r => ({ r: r[0], plate: r[1], type: r[2], cap: r[3], dk: r[4], bh: r[5], ph: r[6], action: 'skip' })),
    filter: 'all', editing: null, manual: null, bigImport: false, importing: false, result: null };
}

/* ---------- Validation ---------- */
function normPlate(v) { const x = String(v || '').replace(/[\s.\-]/g, '').toUpperCase(); const m = x.match(/^(\d{2}[A-Z]{1,2})(\d{3})(\d{2})$/); if (m) return `${m[1]}-${m[2]}.${m[3]}`; const m4 = x.match(/^(\d{2}[A-Z]{1,2})(\d{4})$/); return m4 ? `${m4[1]}-${m4[2]}` : null; }
function parseDate(v, md) {
  v = String(v || '').trim(); if (!v) return { empty: true };
  if (/^\d{5}$/.test(v)) { const d = new Date(1899, 11, 30); d.setDate(d.getDate() + +v); return { d }; }
  const m = v.match(/^(\d{1,4})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/); if (!m) return { err: `Date '${v}' is in the wrong format` };
  let a = +m[1], b = +m[2], y = +m[3];
  if (m[1].length === 4) { y = a; a = +m[3]; }
  if (y < 100) y += 2000;
  let day = md ? b : a, mon = md ? a : b;
  if (mon > 12 || mon < 1) return { err: `Date '${v}' doesn't exist (month ${mon})` };
  const d = new Date(y, mon - 1, day);
  if (d.getMonth() !== mon - 1) return { err: `Date '${v}' doesn't exist` };
  return { d };
}
const fmtD = d => `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
function validate(row, idx) {
  const e = {};
  const p = normPlate(row.plate);
  if (!row.plate) e.plate = 'Missing license plate';
  else if (!p) e.plate = `License plate '${row.plate}' is in the wrong format`;
  else { const first = S.rows.findIndex((x, i) => i < idx && normPlate(x.plate) === p); if (first >= 0) e.plate = `Same license plate as row ${S.rows[first].r}`; }
  if (!row.type) e.type = 'Missing vehicle type'; else if (!['Tractor unit', 'Truck'].includes(row.type)) e.type = `Vehicle type '${row.type}' is not in master data`;
  const c = parseFloat(String(row.cap).replace(',', '.'));
  if (!row.cap) e.cap = 'Missing capacity'; else if (isNaN(c) || !/^[\d.,]+$/.test(row.cap)) e.cap = `Capacity '${row.cap}' is not a number`;
  const dates = {};
  [['dk', false], ['bh', S.dateMode === 'md'], ['ph', false]].forEach(([k, md]) => { const r = parseDate(row[k], md); if (r.err) e[k] = r.err; else dates[k] = r.d; });
  const n = Object.keys(e).length;
  return { e, n, plate: p, dates, dup: !n && p && EXISTING.has(p) };
}
function stats() {
  const v = S.rows.map((r, i) => validate(r, i));
  const err = v.filter(x => x.n).length, dup = v.filter(x => x.dup).length;
  const valid = TOTAL - err - dup;
  const upd = S.rows.filter((r, i) => v[i].dup && r.action === 'update').length;
  return { v, err, dup, valid, upd, importN: valid + upd };
}
function expBadge(d) {
  if (!d) return '';
  const days = Math.round((d - TODAY) / 864e5);
  if (days < 0) return `<span class="xb d">${icon('block')}Expired ${-days} days ago</span>`;
  if (days <= 30) return `<span class="xb w">${icon('warn')}${days} days left</span>`;
  return '';
}

/* ---------- Stepper & frame ---------- */
const STEPS = ['Choose file', 'Map columns', 'Preview & fix', 'Result'];
function renderStepper() {
  $('stepper').innerHTML = STEPS.map((t, i) => {
    const n = i + 1, cls = n < S.step ? 'done' : n === S.step ? 'cur' : '';
    return `${i ? `<span class="line ${n <= S.step ? 'done' : ''}"></span>` : ''}<button type="button" class="${cls}" ${n < S.step && S.step < 4 ? `data-go="${n}"` : 'tabindex="-1"'} ${n === S.step ? 'aria-current="step"' : ''}><span class="n">${n < S.step ? icon('check') : n}</span>${t}</button>`;
  }).join('');
  $('stepper').querySelectorAll('[data-go]').forEach(b => b.onclick = () => { S.step = +b.dataset.go; render(); });
}
function render() {
  renderStepper();
  [step1, step2, step3, step4][S.step - 1]();
}
function foot(html) { $('footbar').innerHTML = html; requestAnimationFrame(syncFoot); }
function syncFoot() { const se = document.scrollingElement; $('footbar').classList.toggle('stuck', se.scrollHeight - se.scrollTop - se.clientHeight > 2); }
addEventListener('scroll', syncFoot, { passive: true }); addEventListener('resize', syncFoot);

/* ---------- Bước 1 ---------- */
function step1() {
  const t = TYPES.find(x => x[0] === S.type);
  let zone;
  if (S.readErr) zone = `<div class="drop err"><div class="alert alert-danger" role="alert" style="width:100%;text-align:left">${icon('block')}<div>Couldn't read '<b>DS xe.xlsx</b>'. The file may be password-protected or corrupted.</div><div class="alert-actions"><button class="btn btn-secondary btn-sm" type="button" id="pickAgain">Choose another file</button><button class="btn btn-ghost btn-sm" type="button" data-support>Send file to support</button></div></div></div>`;
  else if (S.fileErr) zone = dropHtml(`<div class="alert alert-danger" role="alert" style="text-align:left">${icon('block')}<div>'<b>${S.fileErr}</b>' is not an Excel or CSV file. Choose a .xlsx, .xls or .csv file.</div></div>`);
  else if (S.file) {
    const sh = SHEETS.find(s => s[0] === S.sheet);
    zone = `<div class="stack" style="gap:12px"><div class="filechip"><span class="ficon">${icon('doc', 'lg')}</span><div class="grow"><b>${S.file}</b><span class="cell-sub">${SHEETS.length} sheets · 84 KB · uploaded at 08:51</span></div><button class="btn btn-ghost btn-sm" type="button" id="removeFile">${icon('x')}Remove file</button></div>
      <label class="field" style="max-width:340px"><span>Sheet</span><select class="input" id="fSheet">${SHEETS.map(s => `<option value="${s[0]}" ${S.sheet === s[0] ? 'selected' : ''}>${s[0]} (${s[1]} rows)</option>`).join('')}</select></label>
      ${S.sheetEmpty ? `<div class="card"><div class="empty" style="padding:28px 16px">${icon('tray')}<h3>Sheet '${S.sheet}' has no data</h3><p>Choose another sheet or check the file.</p><button class="btn btn-secondary" type="button" id="otherSheet">Choose another sheet</button></div></div>` : `<p class="sm muted">Header row detected at row 3 (skipping the company name and blank rows above). ${sh[1]} data rows.</p>`}</div>`;
  } else zone = dropHtml('');
  $('stepBody').innerHTML = `<div class="s1">
    <section class="card"><div class="card-head"><h2 style="font-size:15px">What do you want to import?</h2></div><div class="card-body stack" style="gap:16px">
      <div class="rcards" role="radiogroup" aria-label="Data type">${TYPES.map(([k, l, s, ic]) => `<label class="rc"><input type="radio" name="dtype" value="${k}" ${S.type === k ? 'checked' : ''}><b>${icon(ic)}${l}</b><small>${s}</small></label>`).join('')}</div>
      <label class="field" style="max-width:280px"><span>Import into branch</span><select class="input"><option selected>TP.HCM</option><option>Bình Dương</option></select></label>
      ${zone}
    </div></section>
    <aside class="card"><div class="card-head"><h2 style="font-size:15px">No file ready?</h2></div><div class="card-body stack exits" style="gap:4px;padding:10px">
      <button class="btn btn-ghost" type="button" id="dlTpl">${icon('download')}<span>Download template (optional)<span class="cell-sub">With expiry columns for inspection, insurance, operating badge and driver's license</span></span></button>
      <button class="btn btn-ghost" type="button" id="manualBtn">${icon('pen')}<span>Quick-enter your first 5 vehicles<span class="cell-sub">Type directly, no file needed</span></span></button>

}
function supportModal() {
  modal(`<h2>Send the file to our support team to import?</h2><p class="muted">Our support team will import '<b>${S.file || 'DS xe 2026.xlsx'}</b>' into the HCMC branch and call you back on <span class="num">0903 xxx 128</span> within 1 business day.</p>
    <label class="field"><span>Note for the support team (optional)</span><textarea class="input" rows="3" placeholder="e.g. Sheet Mooc: trailers are matched by tractor unit plate in column B"></textarea></label>
    <div class="row" style="justify-content:flex-end"><button class="btn btn-secondary" type="button" data-x>Back</button><button class="btn btn-primary" type="button" data-ok>Send file</button></div>`, () => toast('File sent. Our support team will contact you within 1 business day.'));
}
$('btnExit').onclick = () => {
  if (S.step === 2 || S.step === 3) modal(`<h2>Exit before the import is finished?</h2><p class="muted">Your edits in the preview grid will be lost. The column mapping has been saved.</p><div class="row" style="justify-content:flex-end"><button class="btn btn-secondary" type="button" data-x>Stay</button><button class="btn btn-danger" type="button" data-ok>Exit</button></div>`, () => location.href = 'fm-04-tong-quan.html');
  else location.href = 'fm-04-tong-quan.html';
};
document.addEventListener('keydown', e => { if (e.key === 'Escape') { const m = document.querySelector('.modal:not(.leaving)'); if (m) { Shell.dismiss(m); Shell.dismiss(document.querySelector('.modal-scrim:not(.leaving)')); } } });

/* ---------- Prototype states ---------- */
Shell.states([['default', 'Default'], ['sheets', 'Multiple sheets'], ['mapping', 'Map columns'], ['preview', 'Preview with errors'], ['manual', 'Quick manual entry'], ['big', 'Importing (large file)'], ['loading', 'Reading file'], ['success', 'Result'], ['empty', 'Empty sheet'], ['error', 'File read error']], st => {
  document.querySelectorAll('.modal:not(.leaving), .modal-scrim:not(.leaving)').forEach(x => Shell.dismiss(x));
  reset();
  if (st !== 'default' && st !== 'error') S.file = 'DS xe 2026.xlsx';
  if (st === 'mapping') S.step = 2;
  if (st === 'loading') { S.step = 2; S.loading = true; }
  if (st === 'preview') { S.step = 3; S.dateMode = 'dm'; S.cols[1].field = 'Vehicle type'; S.cols[9].field = '__skip'; S.filter = 'error'; S.editing = { i: 4, k: 'dk' }; }
  if (st === 'big') { S.step = 3; S.dateMode = 'dm'; S.cols[1].field = 'Vehicle type'; S.cols[9].field = '__skip'; S.bigImport = true; }
  if (st === 'manual') { S.step = 3; S.manual = blankManual(); Object.assign(S.manual[0], { plate: '51C-602.17', type: 'Tractor unit', cap: '30', dk: '08/06/2027', bh: '14/01/2027', ph: '30/06/2027' }); Object.assign(S.manual[1], { plate: '51D-233.09', type: 'Truck', cap: '15', dk: '02/04/2027', bh: '09/12/2026', ph: '' }); }
  if (st === 'success') { S.step = 4; S.result = { ins: 115, upd: 4, skip: 0, err: 7 }; }
  if (st === 'empty') { S.sheet = 'Trailers'; S.sheetEmpty = true; }
  if (st === 'error') S.readErr = true;
  render();
});
</script>
