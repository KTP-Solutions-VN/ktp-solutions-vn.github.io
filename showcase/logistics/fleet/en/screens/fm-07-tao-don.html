<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create shipping order · Đội Xe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700&family=Inter:wght@400;500;600;700&display=swap&subset=vietnamese">
<link rel="stylesheet" href="../assets/css/app.css">
<style>
  /* FM_07 v2 — form: section không viền (tiêu đề + khoảng trắng), panel giá một thẻ, một số lãi nổi bật (checklist B1–B9) */
  .form-grid { display: grid; grid-template-columns: minmax(0, 1fr) 384px; gap: var(--s-4); align-items: start; }
  .form-card { display: flex; flex-direction: column; padding: 6px 0 10px; min-width: 0; }
  .fsec { padding: 18px 24px 22px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .fsec + .fsec { padding-top: 14px; }
  .fsec-head { display: flex; align-items: center; gap: 10px; min-height: 26px; }
  .fsec-head h2 { font-size: 16px; }
  .fsec-head .step { width: 24px; height: 24px; border-radius: 50%; background: var(--primary-soft); color: var(--side-active); font-size: 12px; font-weight: 600; display: grid; place-items: center; font-variant-numeric: tabular-nums; flex: none; }
  .fsec-head .aside { margin-left: auto; }
  .fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 16px; }
  .fields .span2 { grid-column: span 2; } .fields .span3 { grid-column: 1 / -1; }
  .field .input { width: 100%; }
  .field .hint { font-size: 12px; line-height: 16px; color: var(--fg-muted); }
  .field .hint.warn { color: var(--warning-fg); display: flex; gap: 4px; align-items: center; }
  .field .hint.err { color: var(--danger-fg); display: flex; gap: 4px; align-items: center; }
  /* Ô nhập có đơn vị: cùng cao 34, cùng trạng thái hover/focus với .input */
  .unit-in { display: flex; align-items: center; box-sizing: border-box; border: 1px solid var(--border-strong); border-radius: var(--r-md); background: var(--surface); height: 34px; overflow: hidden; transition: border-color var(--d-1, 120ms), box-shadow var(--d-1, 120ms); }
  .unit-in:hover { border-color: var(--fg-subtle); }
  .unit-in input { border: 0; height: 100%; flex: 1; min-width: 0; padding: 0 4px 0 10px; font: 13.5px var(--font-body); text-align: right; font-variant-numeric: tabular-nums; background: transparent; color: var(--fg); }
  .unit-in input:focus { outline: none; }
  .unit-in:focus-within { border-color: var(--ring); box-shadow: 0 0 0 3px var(--primary-soft); }
  .unit-in span { padding: 0 10px 0 6px; color: var(--fg-muted); font-size: 12.5px; height: 100%; display: flex; align-items: center; white-space: nowrap; }
  .input:disabled, .unit-in.is-locked, select.input:disabled { background: var(--surface-muted); color: var(--fg-muted); border-color: var(--border); }
  .lockic { color: var(--fg-muted); display: inline-flex; vertical-align: -2px; }
  .lockic .icon { width: 13px; height: 13px; }
  .rcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
  .rc { border: 1px solid var(--border-strong); border-radius: var(--r-md); padding: 10px 12px; display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 2px 8px; cursor: pointer; font-size: 13.5px; background: var(--surface); transition: border-color var(--d-1, 120ms), background-color var(--d-1, 120ms); }
  .rc:hover { border-color: var(--fg-subtle); }
  .rc input { margin: 2px 0 0; accent-color: var(--primary); }
  .rc b { font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .rc small { grid-column: 2; color: var(--fg-muted); font-size: 12.5px; line-height: 16px; }
  .rc:has(input:checked) { border-color: var(--primary); background: var(--primary-soft); box-shadow: inset 0 0 0 1px var(--primary); }
  .rc:has(input:disabled) { cursor: not-allowed; opacity: .7; }
  /* Bảng trong form: giữ kẻ hàng, đầu bảng bo góc, không khung ngoài */
  .fsec .grid th:first-child { border-radius: var(--r-md) 0 0 var(--r-md); }
  .fsec .grid th:last-child { border-radius: 0 var(--r-md) var(--r-md) 0; }
  .fsec .grid th { border-bottom: 0; }
  .fsec .grid tbody tr:last-child td { border-bottom: 0; }
  .fsec .seg { height: 34px; }
  .legs td { padding: 6px 8px; }
  .legs td .input { height: 30px; width: 100%; }
  .legs .grip { color: var(--fg-subtle); cursor: grab; }
  .legs tr.dragging td { opacity: .4; }
  .linkbtn { border: 0; background: none; color: var(--primary); font: 500 13px var(--font-body); padding: 4px 0; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
  .linkbtn:hover:not(:disabled) { text-decoration: underline; }
  .linkbtn:disabled { color: var(--fg-subtle); cursor: not-allowed; }
  .note { display: flex; gap: 6px; align-items: flex-start; font-size: 12.5px; line-height: 17px; color: var(--fg-muted); }
  .note .icon { width: 14px; height: 14px; margin-top: 1px; flex: none; }
  /* Panel giá: một thẻ, nhóm tách bằng khoảng trắng */
  .panel { position: sticky; top: calc(var(--header-h) + 16px); max-height: calc(100vh - var(--header-h) - 96px); overflow-y: auto; padding-bottom: 8px; }
  .panel-title { display: flex; align-items: center; gap: 10px; padding: 16px 18px 4px; }
  .panel-title h2 { font-size: 16px; }
  .panel section { padding: 12px 18px; display: flex; flex-direction: column; gap: 10px; }
  .panel section + section { padding-top: 14px; }
  .panel .label { display: block; }
  .bk { width: 100%; border-collapse: collapse; font-size: 13px; }
  .bk td { padding: 4px 0; vertical-align: middle; }
  .bk td:last-child { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bk tr.sub td { border-top: 1px solid var(--border); padding-top: 7px; font-weight: 600; color: var(--fg-strong); }
  .bk tr.off td { color: var(--fg-subtle); }
  .bk tr.off td:last-child { text-decoration: line-through; }
  .bk label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .bk input[type=checkbox] { accent-color: var(--primary); margin: 0; }
  .bk .tip .icon-btn { width: 20px; height: 20px; }
  .bk .tip .icon { width: 14px; height: 14px; }
  /* Kết quả biên: đúng một số nổi bật */
  .margin-box { background: var(--primary-soft); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
  .margin-box .k { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--side-active); }
  .margin-box .hero { font: 700 30px/36px var(--font-display); color: var(--fg-strong); font-variant-numeric: tabular-nums; letter-spacing: -.01em; white-space: nowrap; }
  .margin-box .hero.neg { color: var(--danger-fg); }
  .margin-box .hero small { font: 600 15px var(--font-display); color: var(--fg-muted); margin-left: 4px; }
  .margin-box .row { gap: 6px; flex-wrap: wrap; font-size: 12.5px; color: var(--fg-muted); }
  .margin-box .sec { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--fg-muted); padding-top: 4px; }
  .margin-box .sec b { font-weight: 600; color: var(--fg); font-variant-numeric: tabular-nums; }
  .footbar { position: sticky; bottom: 0; z-index: 15; margin: 0 calc(-1 * var(--s-6)) calc(-1 * var(--s-6)); padding: 12px var(--s-6); background: var(--surface); border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; justify-content: flex-end; }
  .split td { padding: 6px 10px; }
  .split td .input { height: 30px; width: 120px; text-align: right; }
  .field.is-error .input, .field.is-error .unit-in { border-color: var(--danger-solid); box-shadow: 0 0 0 1px var(--danger-solid); }
  [hidden] { display: none !important; }
  .conts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  @media (max-width: 1180px) { .form-grid { grid-template-columns: 1fr; } .panel { position: static; max-height: none; } .fields { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
</head>
<body>
<div id="app-content">
  <div class="page-header">
    <div>
      <div class="crumb" id="crumb">Operations / Shipping orders / New</div>
      <div class="row"><h1 id="h1">Create shipping order</h1><span id="h1badge"></span></div>
    </div>
  </div>
  <div id="topAlerts" class="stack" style="gap:8px"></div>
  <div class="form-grid">
    <div class="card form-card">
      <section class="fsec" id="secInfo" aria-label="Order details"></section>
      <section class="fsec" id="secCont" aria-label="Container"></section>
      <section class="fsec" id="secLegs" aria-label="Legs"></section>
      <section class="fsec" id="secCargo" aria-label="Cargo"></section>
      <section class="fsec" id="secTrip" aria-label="Plan trips"></section>
    </div>
    <aside class="card panel" id="panel" aria-label="Freight rate and estimated cost"></aside>
  </div>
  <div class="footbar">
    <span class="sm muted" id="footNote" style="margin-right:auto"></span>
    <button class="btn btn-ghost" type="button" id="btnCancel">Cancel <kbd>Esc</kbd></button>
    <button class="btn btn-secondary" type="button" id="btnDraft">Save draft</button>
    <span class="tip"><button class="btn btn-primary" type="button" id="btnSave"></button><span class="tip-body right" id="saveTip"></span></span>
  </div>
</div>

<script src="../assets/js/shell.js"></script>
<script src="../assets/js/data.js"></script>
<script>
const { icon, fmt, toast } = Shell;
Shell.mount({ active: 'FM_06', title: 'Create order' });
const NA = 'href="javascript:void(0)" title="not in this prototype"';
const $ = id => document.getElementById(id);
const num = v => { const n = parseFloat(String(v).replace(/,/g, '')); return isNaN(n) ? null : n; };
const r100 = n => Math.round(n / 100) * 100;
const kg = n => fmt.vnd(n, { bare: 1 });

/* ---------- Danh mục mẫu ---------- */
const CUSTOMERS = [
  { id: 'tcl', name: 'Tân Cảng Logistics', mst: '0312345678' },
  { id: 'ndt', name: 'Nhựa Duy Tân', mst: '0301234567' },
  { id: 'bbpn', name: 'Bao bì Phương Nam', mst: '0309876543' },
  { id: 'gml', name: 'Gỗ Minh Long', mst: '3700123456' }
];
const LOC = {
  icd: ['ICD Phước Long (Thủ Đức City)', 'ICD Phước Long'],
  khotn: ['Tân Cảng warehouse — Phước Đông Industrial Park, Gò Dầu, Tây Ninh', 'Phước Đông Industrial Park'],
  catlai: ['Cát Lái port (Thủ Đức City)', 'Cát Lái'],
  ndt: ['Nhựa Duy Tân warehouse — 298 Hồ Học Lãm, Bình Tân', 'Bình Tân'],
  mytho: ['Mỹ Tho Industrial Park, Tiền Giang', 'Mỹ Tho'],
  songthan: ['Sóng Thần Industrial Park, Dĩ An, Bình Dương', 'Sóng Thần Industrial Park'],
  benluc: ['Thuận Đạo Industrial Park, Bến Lức, Long An', 'Bến Lức']
};
const CONT_TYPES = [["20DC", "20' dry (20DC)", 2650000, 34], ["40DC", "40' dry (40DC)", 3350000, 38], ["40HC", "40' high cube (40HC)", 3450000, 38], ["45HC", "45' high cube (45HC)", 3700000, 40], ["20RF", "20' reefer (20RF)", 3100000, 36], ["40RF", "40' reefer (40RF)", 4050000, 40]];
const ROUTE = {
  tcl: { km: 230, code: 'TPHCM–TN-02', toll: [140000, 180000, 100000], grp: 5, wage: 600000, dep: 520000, depDays: .5, liftOn: true },
  ndt: { km: 150, code: 'TPHCM–TG-01', toll: [75000, 52000], grp: 3, wage: 450000, dep: 380000, depDays: .5, norm: 25 },
  bbpn: { km: 90, code: null, toll: [52000], grp: 3, wage: 400000, dep: 380000, depDays: .5, norm: 25 },
  gml: { km: 230, code: null, toll: [140000, 180000, 100000], grp: 5, wage: 600000, dep: 520000, depDays: .5 }
};
const PRICE_TABLE = { tcl: { cont: 'TCL-2026', until: '31/12/2026' }, ndt: { thuong: 'NDT-2026', until: '31/03/2027', price: 1800000 } };
const ATTACH = [
  { id: 'CH-0471', route: 'Bình Tân → Cái Bè', plate: '51D-702.33', pick: '07:00 13/11', load: 11.0, cap: 15.0, status: 'assigned', gvt: true },
  { id: 'CH-0473', route: 'Bình Tân → Bến Lức', plate: '51C-588.02', pick: '08:00 13/11', load: 6.5, cap: 15.0, status: 'wait', gvt: false },
  { id: 'CH-0475', route: 'Sóng Thần Industrial Park → Bến Lức', plate: null, pick: '13:00 13/11', load: 3.5, cap: null, status: 'wait', gvt: false }
];
const DIESEL = 20150;

/* ---------- State ---------- */
let S;
function base() {
  return { type: 'thuong', dir: 'xuat', customer: '', ref: '', booking: '', line: 'Evergreen', ctype: '40DC', qty: 5, conts: [''], cutoff: '', deposit: '2.000.000',
    legs: [{ k: 'Pickup point', loc: '', t: '07:00 13/11', note: '' }, { k: 'Delivery point', loc: '', t: '', note: '' }],
    cargo: '', weight: '', pieces: '', driverNote: '', price: null, manual: false, reason: '',
    sur: null, mode: 'new', trips: 2, splitBy: 'kg', split: null, attach: '', edit: false, loading: false, saveError: false, dirty: false, tried: false };
}
function legsFor() {
  if (S.type === 'cont') {
    if (S.dir === 'xuat') return [{ k: 'Empty pickup', loc: 'icd', t: '05:30 13/11', note: '' }, { k: 'Stuffing', loc: 'khotn', t: '09:00 13/11', note: 'Call the warehouse 30 min ahead' }, { k: 'Drop at port', loc: 'catlai', t: 'by 14:00 14/11', note: '' }];
    return [{ k: 'Port pickup', loc: 'catlai', t: '06:00 13/11', note: '' }, { k: 'Warehouse delivery', loc: 'khotn', t: '10:30 13/11', note: '' }, { k: 'Empty return', loc: 'icd', t: 'by 17:00 15/11', note: '' }];
  }
  if (S.customer === 'ndt') return [{ k: 'Pickup point', loc: 'ndt', t: '07:00 13/11', note: '' }, { k: 'Delivery point', loc: 'mytho', t: '11:30 13/11', note: '' }];
  if (S.customer === 'bbpn') return [{ k: 'Pickup point', loc: 'songthan', t: '08:00 13/11', note: '' }, { k: 'Delivery point', loc: 'benluc', t: '11:00 13/11', note: '' }];
  return [{ k: 'Pickup point', loc: '', t: '07:00 13/11', note: '' }, { k: 'Delivery point', loc: '', t: '', note: '' }];
}
function surFor() {
  const s = [];
  if (S.type === 'cont') s.push({ n: 'Lift-on/lift-off fee', a: 680000, on: true });
  s.push({ n: 'Fuel surcharge 3%', pct: .03, on: true });
  if (S.type === 'thuong') s.push({ n: 'Multi-stop delivery', a: 200000, unit: '₫/stop', on: false });
  s.push({ n: 'Detention', a: 500000, unit: '₫/day', on: false });
  return s;
}
function tablePrice() {
  const t = PRICE_TABLE[S.customer]; if (!t) return null;
  if (S.type === 'cont' && t.cont) return CONT_TYPES.find(c => c[0] === S.ctype)[2];
  if (S.type === 'thuong' && t.thuong) return t.price;
  return null;
}
function tableLabel() { const t = PRICE_TABLE[S.customer]; return t ? `${S.type === 'cont' ? t.cont : t.thuong} · valid until ${t.until}` : ''; }
function applyCustomer() {
  S.legs = legsFor(); S.sur = surFor(); S.manual = false; S.reason = '';
  S.price = tablePrice();
  if (S.type === 'cont') { S.cargo = S.cargo || 'Electronic components'; S.weight = S.weight || '24.500'; S.pieces = S.pieces || '1.200'; S.cutoff = S.dir === 'xuat' ? '14:00 14/11/2026' : '17:00 15/11/2026'; S.booking = S.booking || 'HCM2611-0457'; }
  else if (S.customer) { S.cargo = S.cargo || 'Household plastic products'; S.weight = S.weight || '24.500'; S.pieces = S.pieces || '1.200'; }
  S.split = null;
}
function wKg() { return num(S.weight) || 0; }
function totalKg() { return S.type === 'cont' ? wKg() * S.qty : wKg(); }
function splitRows() {
  if (!S.split || S.split.length !== S.trips) {
    const n = S.trips, w = wKg(), p = num(S.pieces) || 0;
    S.split = Array.from({ length: n }, (_, i) => ({ kg: Math.round(w / n / 100) * 100 + (i === n - 1 ? w - Math.round(w / n / 100) * 100 * n : 0), pcs: Math.round(p / n) + (i === n - 1 ? p - Math.round(p / n) * n : 0), t: ['07:00 13/11', '13:00 13/11', '07:00 14/11', '13:00 14/11'][i] || '07:00 14/11' }));
  }
  return S.split;
}
function units() {
  if (S.type === 'cont') return S.qty;
  if (S.mode === 'new') return splitRows().filter(r => r.kg > 0).length || 1;
  return 1;
}

/* ---------- Giá thành ---------- */
function calc() {
  const R = ROUTE[S.customer]; if (!R) return null;
  const ct = CONT_TYPES.find(c => c[0] === S.ctype);
  const norm = S.type === 'cont' ? ct[3] : (R.norm || 25);
  const dau = r100(R.km * norm / 100 * DIESEL), toll = R.toll.reduce((a, b) => a + b, 0);
  const lift = S.type === 'cont' ? 680000 : 0, dep = Math.round(R.depDays * R.dep), fix = R.km * 1000;
  const rows = [
    ['Fuel', dau, `<span class="formula">${R.km} km × ${norm} l/100km × ${fmt.vnd(DIESEL, { bare: 1 })} ₫/l = ${fmt.vnd(dau)}</span><br>Fuel norm: ${S.type === 'cont' ? `Tractor unit ${ct[1].slice(0, 3)}, loaded` : '15 t box truck, loaded'} · Reference fuel price updated 06/11/2026`],
    ['Tolls', toll, `<span class="formula">${R.toll.length} toll station(s) × vehicle class ${R.grp}: ${R.toll.map(t => fmt.vnd(t, { bare: 1 })).join(' + ')} = ${fmt.vnd(toll)}</span>`],
    ['Trip pay', R.wage, `Per trip pay table (${R.code || 'estimated'} route): <span class="formula">${fmt.vnd(R.wage)}</span>`]
  ];
  if (lift) rows.push(['Lift-on/lift-off fee', lift, `Empty lift-on at depot + laden lift-off at port: <span class="formula">${fmt.vnd(lift)}</span>`]);
  const variable = rows.reduce((a, r) => a + r[1], 0);
  const fixed = [['Depreciation', dep, `<span class="formula">${fmt.dec(R.depDays)} days × ${fmt.vnd(R.dep, { bare: 1 })} ₫/day = ${fmt.vnd(dep)}</span>`], ['Fixed costs', fix, `<span class="formula">${R.km} km × 1,000 ₫/km = ${fmt.vnd(fix)}</span>`]];
  const total = variable + dep + fix;
  const p = S.price;
  let rev = null, surAmt = 0, rate = 0, fixedSur = 0;
  S.sur.forEach(s => { if (!s.on) return; if (s.pct) { rate += s.pct; surAmt += p ? Math.round(p * s.pct) : 0; } else { fixedSur += s.a; surAmt += s.a; } });
  if (p) rev = p + surAmt;
  const gross = rev != null ? rev - variable : null, net = rev != null ? rev - total : null;
  const minP = Math.ceil(((total / 0.95) - fixedSur) / (1 + rate) / 1000) * 1000;
  return { R, rows, variable, fixed, total, rev, gross, net, gm: rev ? gross / rev * 100 : null, nm: rev ? net / rev * 100 : null, minP, surAmt };
}

/* ---------- Render sections ---------- */
const lock = () => S.edit ? `<span class="lockic" title="Locked because the order has a trip in progress">${icon('lock')}</span>` : '';
const dis = () => S.edit ? 'disabled' : '';
function head(n, t, extra) { return `<div class="fsec-head"><span class="step">${n}</span><h2>${t}</h2>${extra || ''}</div>`; }

function renderInfo() {
  $('secInfo').innerHTML = head(1, 'Order details') + `<div class="stack" style="gap:14px">
    <div class="fields">
      <label class="field span2 ${S.tried && !S.customer ? 'is-error' : ''}"><span>Customer * ${lock()}</span>
        <select class="input" id="fCust" ${dis()} aria-describedby="custErr">
          <option value="">Search customer name or tax ID…</option>
          ${CUSTOMERS.map(c => `<option value="${c.id}" ${S.customer === c.id ? 'selected' : ''}>${c.name} · Tax ID ${c.mst}</option>`).join('')}
          <option value="__new">+ Add new customer</option>
        </select>${S.tried && !S.customer ? '<span class="hint err" id="custErr">Select a customer</span>' : ''}</label>
      <label class="field"><span>Customer reference no.</span><input class="input" id="fRef" placeholder="VD: PO-2026-1188" value="${S.ref}"></label>
    </div>
    <div class="rcards" role="radiogroup" aria-label="Order type">
      <label class="rc"><input type="radio" name="otype" value="thuong" ${S.type === 'thuong' ? 'checked' : ''} ${dis()}><b>${icon('box')}General cargo</b><small>Boxes, packages, loose goods</small></label>
      <label class="rc"><input type="radio" name="otype" value="cont" ${S.type === 'cont' ? 'checked' : ''} ${dis()}><b>${icon('container')}Container</b><small>Booking, port/depot, empty return deadline</small></label>
    </div></div>`;
  $('fCust').onchange = e => { if (e.target.value === '__new') { e.target.value = S.customer; toast('Adding a new customer is not in this prototype'); return; } S.customer = e.target.value; S.dirty = true; applyCustomer(); recalcWithLoading(); renderAll(); };
  $('fRef').oninput = e => { S.ref = e.target.value; S.dirty = true; };
  document.querySelectorAll('input[name=otype]').forEach(r => r.onchange = () => { S.type = r.value; if (S.type === 'cont' && !S.customer) S.customer = 'tcl'; S.mode = 'new'; S.trips = S.type === 'cont' ? S.qty : 2; S.dirty = true; applyCustomer(); renderAll(); });
}

function contValid(v) { const x = v.replace(/[\s-]/g, '').toUpperCase(); return !x || /^[A-Z]{4}\d{7}$/.test(x); }
function renderCont() {
  const el = $('secCont');
  if (S.type !== 'cont') { el.style.display = 'none'; el.innerHTML = ''; return; }
  el.style.display = '';
  const xuat = S.dir === 'xuat';

function parseDT(s) { const m = String(s).match(/(\d{1,2}):(\d{2})\s+(\d{1,2})\/(\d{1,2})/); return m ? new Date(2026, +m[4] - 1, +m[3], +m[1], +m[2]) : null; }

    <section>
      <label class="field ${reasonNeed && !S.reason.trim() && S.tried ? 'is-error' : ''}"><span>Freight rate</span><div class="unit-in"><input id="fPrice" value="${S.price != null ? fmt.vnd(S.price, { bare: 1 }) : ''}" placeholder="Enter freight rate" aria-label="Freight rate"><span>₫/${u}</span></div></label>
      <div class="row wrap" style="gap:6px">${priceBadge}${S.manual && tbl ? `<button class="linkbtn" type="button" id="resetPrice">${icon('undo')}Use rate card price</button>` : ''}</div>
      ${reasonNeed ? `<label class="field ${!S.reason.trim() && S.tried ? 'is-error' : ''}"><span>Reason for price change *</span><textarea class="input" id="fReason" rows="2" placeholder="e.g. Special negotiated price for a 5-container lot, approved by Mr Minh by phone">${S.reason}</textarea>${!S.reason.trim() && S.tried ? '<span class="hint err">Give a reason when the price differs from the rate card</span>' : ''}</label>` : ''}
      <div class="margin-box">${marginHtml}</div>
    </section>
    <section>
      <div class="label">Surcharges</div>
      <table class="bk">${S.sur.map((s, i) => `<tr class="${s.on ? '' : 'off'}"><td><label><input type="checkbox" data-sur="${i}" ${s.on ? 'checked' : ''}>${s.n}</label></td><td>${s.pct ? (S.price ? fmt.vnd(Math.round(S.price * s.pct)) : '—') : fmt.vnd(s.a) + (s.unit ? '/' + s.unit.split('/')[1] : '')}</td></tr>`).join('')}
        <tr class="sub"><td>Total revenue</td><td>${c.rev != null ? `${fmt.vnd(c.rev)} / ${u}` : '—'}</td></tr></table>
      ${c.rev != null ? `<span class="sm muted right num">${fmt.vnd(c.rev * n)} whole order (${n} × ${u})</span>` : ''}
      ${n > 1 && c.rev != null ? `<div class="note">${icon('info')}<span>Order revenue is allocated across ${n} trips by weight carried.</span></div>` : ''}
    </section>
    <section>
      <div class="row wrap" style="gap:6px"><div class="label">Estimated cost / ${u}</div><span class="tip" style="margin-left:auto"><span class="badge b-neutral" tabindex="0">${icon('formula')}Using default values</span><span class="tip-body right">Fuel norm, depreciation and fixed costs are using the system's default values</span></span></div>
      <table class="bk">${c.rows.map(r => tipRow(r[0], r[1], r[2])).join('')}
        <tr class="sub"><td>Variable costs</td><td>${fmt.vnd(c.variable)}</td></tr>
        ${c.fixed.map(r => tipRow(r[0], r[1], r[2])).join('')}
        <tr class="sub"><td>Total cost</td><td>${fmt.vnd(c.total)}</td></tr></table>
      <a class="btn btn-ghost btn-sm" style="align-self:flex-start" ${NA}>${icon('formula')}View detailed cost estimate</a>
    </section>`;
  const fp = $('fPrice');
  fp.oninput = () => { const v = num(fp.value); S.price = v; S.manual = v !== tbl; S.dirty = true; const pos = fp.selectionStart; renderPanel(); renderFoot(); const f = $('fPrice'); f.focus(); try { f.setSelectionRange(pos, pos); } catch (e) {} };
  fp.onblur = () => { if (S.price != null) fp.value = fmt.vnd(S.price, { bare: 1 }); };
  const rr = $('fReason'); if (rr) rr.oninput = () => { S.reason = rr.value; renderFoot(); };
  const rp = $('resetPrice'); if (rp) rp.onclick = () => { S.price = tbl; S.manual = false; S.reason = ''; renderPanel(); renderFoot(); };
  document.querySelectorAll('[data-sur]').forEach(cb => cb.onchange = () => { S.sur[+cb.dataset.sur].on = cb.checked; renderPanel(); });
}

/* ---------- Footer ---------- */
function blockers() {
  const b = [];
  if (!S.customer) b.push('customer');
  if (!S.legs.every(l => l.loc)) b.push('leg locations');
  if (!wKg()) b.push('weight');
  if (S.manual && S.price != null && !S.reason.trim()) b.push('price change reason');
  if (S.mode === 'attach') { const a = attachInfo(); if (!a) b.push('trip to add to'); else if (a.over > 0) b.push('trip with enough capacity (currently over by ' + fmt.dec(a.over) + ' t)'); }
  return b;
}
function saveLabel() {
  if (S.edit) return 'Save changes';
  if (S.mode === 'attach') return `Save &amp; add to ${S.attach || 'trip'}`;
  if (S.mode === 'later') return 'Save order';
  return `Save &amp; plan ${units()} trip(s)`;
}
function renderFoot() {
  const b = blockers(), btn = $('btnSave');
  btn.innerHTML = saveLabel() + ' <kbd>Ctrl+Enter</kbd>';
  const hardBlock = S.mode === 'attach' && attachInfo() && attachInfo().over > 0;
  btn.disabled = hardBlock || (S.tried && b.length > 0);
  $('saveTip').innerHTML = b.length ? 'Missing: ' + b.join(', ') + '.' : '';
  $('saveTip').style.display = b.length ? '' : 'none';
  $('btnDraft').style.display = S.edit ? 'none' : '';
  $('footNote').innerHTML = S.edit ? `${icon('lock')} Fields with a lock icon can't be edited while a trip is in progress` : `Order belongs to the HCMC branch · order ID is generated on save`;
}
function renderHeader() {
  $('h1').textContent = S.edit ? 'Order DH-1132' : 'Create shipping order';
  $('crumb').textContent = S.edit ? 'Operations / Shipping orders / DH-1132' : 'Operations / Shipping orders / New';
  $('h1badge').innerHTML = S.edit ? `<span class="badge b-info">${icon('truck')}Planned · 1 trip in progress</span>` : '';
  const a = [];
  if (S.saveError) a.push(`<div class="alert alert-danger" role="alert">${icon('block')}<div>Couldn't save the order. Check your connection and try again. Your entries are still here.</div><div class="alert-actions"><button class="btn btn-secondary btn-sm" type="button" id="retrySave">${icon('refresh')}Retry</button></div></div>`);
  if (S.edit) a.push(`<div class="alert alert-info">${icon('lock')}<div>This order has a trip in progress. Only the freight rate, surcharges, notes and container numbers can be edited.</div></div>`);
  if (S.success) a.push(`<div class="alert alert-success">${icon('check')}<div>Created <b>DH-1132</b> and ${units()} Unassigned trip(s).</div><div class="alert-actions"><a class="btn btn-primary btn-sm" href="fm-08-dieu-phoi.html">Open dispatch board</a></div></div>`);
  $('topAlerts').innerHTML = a.join('');
  const r = $('retrySave'); if (r) r.onclick = save;
}
function renderAll() { renderHeader(); renderInfo(); renderCont(); renderLegs(); renderCargo(); renderTrip(); renderPanel(); renderFoot(); }

function save() {
  S.tried = true;
  const b = blockers();
  if (b.length) { renderAll(); const first = document.querySelector('.is-error, .alert-danger'); if (first) first.scrollIntoView({ block: 'center', behavior: 'smooth' }); toast('Missing: ' + b.join(', ')); return; }
  const n = units();
  const msg = S.edit ? 'Saved changes to order DH-1132.' : S.mode === 'attach' ? `Created DH-1132 and added it to ${S.attach}.` : S.mode === 'later' ? 'Saved DH-1132 to Unassigned orders.' : `Created DH-1132 and ${n} Unassigned trip(s).`;
  toast(msg); S.dirty = false;
  if (!S.edit) setTimeout(() => location.href = 'fm-08-dieu-phoi.html', 1400);
}
$('btnSave').onclick = save;
$('btnDraft').onclick = () => { if (!S.customer) { S.tried = true; renderInfo(); toast('Select a customer before saving a draft'); return; } S.dirty = false; toast('Draft DH-1132 saved (status New)'); };
function cancel() {
  if (!S.dirty) { location.href = 'fm-08-dieu-phoi.html'; return; }
  const s = document.createElement('div'); s.className = 'scrim modal-scrim';
  const m = document.createElement('div'); m.className = 'modal'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true');
  m.innerHTML = `<h2>Discard changes?</h2><p class="muted">Order DH-1132 has unsaved changes.</p><div class="row" style="justify-content:flex-end"><button class="btn btn-secondary" type="button" data-x>Keep editing</button><button class="btn btn-danger" type="button" data-ok>Discard changes</button></div>`;
  document.body.append(s, m); const close = () => { Shell.dismiss(s); Shell.dismiss(m); };
  m.querySelector('[data-x]').onclick = close; s.onclick = close; m.querySelector('[data-ok]').onclick = () => { location.href = 'fm-08-dieu-phoi.html'; }; m.querySelector('[data-x]').focus();
}
$('btnCancel').onclick = cancel;
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); if (!$('btnSave').disabled) save(); }
  if (e.key === 'Escape') { const m = document.querySelector('.modal:not(.leaving)'); if (m) { Shell.dismiss(m); Shell.dismiss(document.querySelector('.modal-scrim:not(.leaving)')); } else cancel(); }
});

/* ---------- Prototype states ---------- */
Shell.states([['default', 'Default'], ['xuat', 'Export container'], ['nhap', 'Import container'], ['noprice', 'No rate'], ['split', 'Split cargo'], ['overload', 'Consolidation overload'], ['edit', 'Edit in-progress order'], ['loading', 'Calculating'], ['error', 'Save error'], ['success', 'Saved']], st => {
  document.querySelectorAll('.modal, .modal-scrim').forEach(x => x.remove());
  S = base(); S.sur = surFor();
  const cont = dir => { S.type = 'cont'; S.customer = 'tcl'; S.dir = dir; S.qty = 5; S.trips = 5; applyCustomer(); };
  if (st === 'xuat' || st === 'loading' || st === 'error' || st === 'success') cont('xuat');
  if (st === 'nhap') { cont('nhap'); S.booking = 'EGLV 142600871'; }
  if (st === 'noprice') { S.customer = 'bbpn'; applyCustomer(); S.weight = '8.000'; S.pieces = '320'; S.cargo = 'Carton packaging'; S.trips = 1; S.split = null; }
  if (st === 'split') { S.customer = 'ndt'; applyCustomer(); S.trips = 2; S.split = [{ kg: 15000, pcs: 700, t: '07:00 13/11' }, { kg: 0, pcs: 0, t: '13:00 13/11' }]; }
  if (st === 'overload') { S.customer = 'ndt'; applyCustomer(); S.weight = '8.000'; S.pieces = '400'; S.mode = 'attach'; S.attach = 'CH-0471'; }
  if (st === 'edit') { cont('xuat'); S.edit = true; S.conts = ['EGHU 912345-6', 'EGHU 912351-0', 'EGHU 91236']; }
  if (st === 'loading') S.loading = true;
  if (st === 'error') { S.saveError = true; S.dirty = true; }
  if (st === 'success') S.success = true;
  renderAll();
  if (st === 'overload' || st === 'split') setTimeout(() => window.scrollTo(0, $('secTrip').getBoundingClientRect().top + window.scrollY - 300), 50);
  if (st === 'success') toast('Created DH-1132 and 5 Unassigned trips.');
});
</script>
</body>
</html>
