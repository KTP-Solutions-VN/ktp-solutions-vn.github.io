<style>

  .stepper button .n { width: 24px; height: 24px; border-radius: 50%; background: var(--surface); box-shadow: inset 0 0 0 1px var(--border-strong); display: grid; place-items: center; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stepper button.done { color: var(--fg); cursor: pointer; }
  .stepper button.done:hover { background: var(--surface-muted); }
  .stepper button.done .n { background: var(--success-soft); box-shadow: none; color: var(--success-fg); }
  .stepper button.skip .n { background: var(--surface-muted); box-shadow: none; color: var(--fg-muted); }

  .s1 { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: var(--s-4); align-items: stretch; }

  .rc { border: 1px solid var(--border); border-radius: var(--r-md); padding: 10px 12px; display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 2px 8px; cursor: pointer; font-size: 13.5px; background: var(--surface); }
  .rc input { margin: 2px 0 0; accent-color: var(--primary); }

  .rc:hover { border-color: var(--border-strong); }
  .rc:has(input:checked) { border-color: var(--primary); background: var(--primary-soft); box-shadow: inset 0 0 0 1px var(--primary); }
  .tplline { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; background: var(--surface-muted); font-size: 13px; }

  .drop { border: 1.5px dashed var(--border-strong); border-radius: var(--r-lg); background: var(--surface-muted); padding: 28px 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; transition: border-color .12s, background-color .12s; }
  .drop.over { border-color: var(--primary); background: var(--primary-soft); }
  .drop > .icon { width: 36px; height: 36px; stroke-width: 1.25; color: var(--fg-muted); }
  .filechip { display: flex; align-items: center; gap: 10px; border-radius: 8px; padding: 10px 12px; background: var(--surface-muted); }
  .filechip .ficon { width: 34px; height: 34px; border-radius: var(--r-md); background: var(--success-soft); color: var(--success-fg); display: grid; place-items: center; }

  .cellv { display: inline-block; min-width: 60px; border: 1px solid transparent; border-radius: var(--r-sm); padding: 2px 6px; margin: 0 -6px; cursor: text; line-height: 20px; }
  .cellv:hover { border-color: var(--border-strong); background: var(--surface); }
  .cellv.bad { border-color: var(--danger-solid); color: var(--danger-fg); }
  .cellv.empty-v { color: var(--fg-subtle); font-style: italic; }
  .cell-in { height: 28px; width: 150px; border: 1px solid var(--primary); border-radius: var(--r-sm); padding: 0 6px; font: 13.5px var(--font-body); outline: 2px solid var(--ring); outline-offset: 1px; }
  .emsg { display: flex; align-items: flex-start; gap: 4px; font-size: 11.5px; line-height: 14px; color: var(--danger-fg); margin-top: 3px; white-space: normal; max-width: 220px; }
  .emsg .icon { width: 12px; height: 12px; margin-top: 1px; flex: none; }
  td.right .emsg { margin-left: auto; justify-content: flex-end; }
  .gridfoot { padding: 12px 16px 14px; }
  .footbar { position: sticky; bottom: 0; z-index: 15; margin: 0 calc(-1 * var(--s-6)) calc(-1 * var(--s-6)); padding: 12px var(--s-6) 12px var(--s-6); background: var(--bg); border-top: 1px solid transparent; display: flex; gap: 8px; align-items: center; justify-content: flex-end; transition: border-color var(--d-2), background-color var(--d-2); }
  .footbar.stuck { border-top-color: var(--border); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: saturate(1.2) blur(8px); }
  .summary { display: grid; grid-template-columns: minmax(300px, 1.6fr) repeat(3, minmax(0, 1fr)); gap: 6px; padding: 6px; background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-card); }
  .sum-main { padding: 18px 22px; background: var(--primary-soft); border-radius: 8px; display: flex; flex-direction: column; gap: 4px; }
  .sum-main .k { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--side-active); }
  .sum-main .v { font: 700 var(--text-display)/40px var(--font-display); color: var(--fg-strong); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .sum-main .v small, .sum-item .v small { font: 600 15px var(--font-body); color: var(--fg-muted); margin-left: 4px; }
  .sum-main .d { font-size: 12.5px; color: var(--fg-muted); }
  .sum-item { padding: 18px 16px; display: flex; flex-direction: column; justify-content: center; gap: 4px; min-width: 0; border: 0; background: none; border-radius: 8px; text-align: left; font: inherit; color: inherit; text-decoration: none !important; }
  a.sum-item:hover { background: var(--surface-muted); }
  .sum-item .k { font-size: 12.5px; color: var(--fg-muted); font-weight: 500; }
  .sum-item .v { font: 700 24px/30px var(--font-display); color: var(--fg-strong); font-variant-numeric: tabular-nums; }
  .sum-item .d { font-size: 12.5px; color: var(--fg-muted); display: inline-flex; gap: 4px; align-items: center; }
  a.sum-item .d { color: var(--primary); font-weight: 500; }
  .hist td { height: 52px; }
  .hist .fname { display: block; max-width: 170px; overflow: hidden; text-overflow: ellipsis; }
  .hist td:last-child { padding-left: 4px; }
  .hist tr.undone td { color: var(--fg-muted); }
  .hist tr.undone td .code { text-decoration: line-through; }
  .src { display: inline-flex; align-items: center; gap: 6px; }
  .src .icon { color: var(--fg-muted); }
  .tpls { display: flex; flex-direction: column; gap: 2px; padding: 4px 8px 10px; }
  .tpl { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 8px; font-size: 13px; }
  .tpl:hover { background: var(--surface-muted); }
  .tpl .grow b { font-weight: 600; }
  .card-title { display: flex; align-items: center; gap: 8px; padding: 16px 18px 6px; }
  .card-title h2 { font-size: 16px; }
  .card-title .meta { margin-left: auto; display: inline-flex; gap: 8px; align-items: center; }
  .modal .sumlist { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; }
  .modal .field .select { width: 100%; }
  @media (max-width: 1200px) { .s1 { grid-template-columns: 1fr; } .rcards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>

<body>
<div id="app-content">
  <div class="page-header">
    <div>
      <div class="crumb">Finance / Import costs</div>
      <h1>Import costs</h1>
      <div class="sub">ETC statements, fuel cards, purchase invoices → matched to trips automatically by plate and time</div>
    </div>
    <div class="actions"><a class="btn btn-ghost" href="fm-39-tich-hop.html">${'link'}</a><a class="btn btn-secondary" href="fm-24-khop-giao-dich.html" id="toMatch"></a></div>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <nav class="stepper" id="stepper" aria-label="Import steps"></nav>
  <div id="body" class="stack" style="gap:16px"></div>
  <div class="footbar" id="footbar"></div>
</div>

<script src="../assets/js/shell.js"></script>
<script src="../assets/js/data.js"></script>
<script>
const { icon, fmt, toast } = Shell;
Shell.mount({ active: 'FM_23', title: 'Import costs' });
const $ = id => document.getElementById(id);
document.querySelector('.actions a.btn-ghost').innerHTML = `${icon('link')}Auto-connect`;
$('toMatch').innerHTML = `${icon('check')}Transaction matching <span class="count-pill">15</span>`;

const SRC = [
  { k: 'etc', l: 'ETC statement', s: 'VETC and ePass toll accounts', ic: 'toll', vendors: ['VETC', 'ePass'] },
  { k: 'fuel', l: 'Fuel cards', s: 'Petrolimex FleetCard, PVOil Easy statements', ic: 'fuel', vendors: ['Petrolimex FleetCard', 'PVOil Easy'] },
  { k: 'xml', l: 'Purchase e-invoices', s: 'XML files in the General Department of Taxation format', ic: 'invoice', vendors: ['Auto-read (standard XML)'] },
  { k: 'tpl', l: 'Template file', s: 'Repairs, tires, cash fees…', ic: 'doc', vendors: ['System template'] }
];
const TPL = { 'VETC': { name: 'VETC statement', used: 6, last: '08/11/2026' }, 'Petrolimex FleetCard': { name: 'Petrolimex – card statement', used: 9, last: '11/11/2026' } };
const HOWTO = {
  'VETC': ['Sign in to the VETC app or vetc.com.vn with your business account', 'Go to Transaction history → choose the period → Export to Excel', 'Drag the downloaded file into the box on the left'],
  'ePass': ['Sign in to epass-vdtc.com.vn with your business account', 'Lookup → Toll passage history → select all vehicles → Export file', 'Drag the downloaded file into the box on the left'],
  'Petrolimex FleetCard': ['Sign in to the FleetCard portal', 'Reports → Transaction statement → Export to Excel', 'Drag the file into the box on the left'],
  'PVOil Easy': ['Sign in to the PVOil Easy app for businesses', 'Transaction history → Download statement', 'Drag the file into the box on the left'],
  'Auto-read (standard XML)': ['Download the invoice XML files from the supplier\'s email or the hoadondientu.gdt.gov.vn portal', 'Select several XML files at once (or one .zip file)', 'The system reads the plate number from the item lines or notes'],
  'System template': ['Download the template file below', 'Enter one expense per row: date, plate, cost type, amount', 'Drag the file into the box on the left']
};
const LAST = { 'VETC': ['01/11 – 07/11', '08/11/2026'], 'ePass': ['01/11 – 09/11', '10/11/2026'], 'Petrolimex FleetCard': ['04/11 – 10/11', '11/11/2026'] };
const FIELDS = ['Transaction time', 'License plate', 'Amount', 'Location', 'Transaction ID', 'Fee type', 'Card number'];
const REQUIRED = ['Transaction time', 'License plate', 'Amount'];
const COLS0 = [
  ['Passage time', ['12/11/2026 06:48:12', '12/11/2026 09:12:40'], 'Transaction time'],
  ['License plate', ['51C12345T', '51D45678T'], 'License plate', 'Plate color suffix (T, V, X) is dropped when reading'],
  ['Toll station', ['ĐT741 toll station', 'Long Phước toll station'], 'Location'],
  ['Lane', ['L03', 'L05'], ''],
  ['Amount (₫)', ['40.000', '120.000'], 'Amount'],
  ['Txn ID', ['EP26111206…', 'EP26111209…'], 'Transaction ID', 'Used to prevent duplicate imports'],
  ['Ticket type', ['Single pass', 'Single pass'], ''],
  ['Balance', ['3.420.000', '3.300.000'], '__skip']
];
const ROWS0 = [
  [4, '12/11/2026 06:48', '51C12345T', 'ĐT741 toll station', '40000', 'EP2611120648'],
  [5, '12/11/2026 09:12', '51C12345T', 'Long Phước toll station', '120000', 'EP2611120912'],
  [6, '12/11/2026 05:20', '51D45678T', 'An Phú toll station', '75000', 'EP2611120520'],
  [7, '12/11/2026 06:30', '51D45678T', 'Hà Nội Highway toll station', '40000', 'EP2611120630'],
  [9, '31/11/2026 07:35', '51D70233T', 'QL1A Bình Chánh toll station', '52000', 'EP2611120735'],
  [12, '12/11/2026 08:10', '61C22014T', 'An Phú toll station', '75000', 'EP2611120810'],
  [15, '12/11/2026 10:02', '51C12T', 'ĐT743 toll station', '40000', 'EP2611121002'],
  [18, '11/11/2026 21:30', '51C77710T', 'Long Phước toll station', '120000', 'EP2611112130'],
  [21, '12/11/2026 13:05', '51D70233T', 'QL1A Bình Chánh toll station', '', 'EP2611121305'],
  [26, '10/11/2026 07:15', '51C12345T', 'ĐT741 toll station', '40000', 'EP2611100715'],
  [27, '10/11/2026 09:40', '51C12345T', 'Long Phước toll station', '120000', 'EP2611100940'],
  [31, '12/11/2026 02:15', '51C09921T', 'Hà Nội Highway toll station', '40000', 'EP2611120215']
];
const PREV = new Set(['EP2611100715', 'EP2611100940', 'EP2611100802']); // đã import ở IMP-0084
const TOTAL = 192, PREV_HIDDEN = 1;
const HIST0 = [
  { id: 'IMP-0088', at: '12/11/2026 08:58', src: 'etc', vendor: 'ePass', file: 'Sao ke ePass 10-12.11.xlsx', by: 'Mai Hồng', period: '10/11 – 12/11', n: 186, ok: 171, todo: 15, st: 'todo' },
  { id: 'IMP-0087', at: '11/11/2026 17:20', src: 'fuel', vendor: 'Petrolimex FleetCard', file: 'FleetCard_T11_tuan2.xlsx', by: 'Mai Hồng', period: '04/11 – 10/11', n: 64, ok: 61, todo: 0, st: 'done' },
  { id: 'IMP-0086', at: '11/11/2026 09:05', src: 'xml', vendor: 'XML', file: '23 file XML', by: 'Mai Hồng', period: '01/11 – 10/11', n: 23, ok: 21, todo: 0, st: 'done' },
  { id: 'IMP-0085', at: '08/11/2026 15:42', src: 'etc', vendor: 'VETC', file: 'VETC_sao_ke_thang10.xlsx', by: 'Mai Hồng', period: '01/10 – 31/10', n: 205, ok: 0, todo: 0, st: 'undone', note: 'Undone 08/11 16:10 · wrong period selected' },
  { id: 'IMP-0084', at: '08/11/2026 15:55', src: 'etc', vendor: 'VETC', file: 'VETC_sao_ke_01-07.11.xlsx', by: 'Mai Hồng', period: '01/11 – 07/11', n: 198, ok: 190, todo: 0, st: 'done' },
  { id: 'IMP-0081', at: '05/11/2026 10:12', src: 'etc', vendor: 'VETC', file: 'VETC_sao_ke_25-31.10.xlsx', by: 'Mai Hồng', period: '25/10 – 31/10', n: 177, ok: 169, todo: 0, st: 'locked', locked: 41 },
  { id: 'IMP-0079', at: '03/11/2026 14:30', src: 'tpl', vendor: 'Template', file: 'Sua chua thang 10.xlsx', by: 'Phan Thắng', period: '01/10 – 31/10', n: 18, ok: 18, todo: 0, st: 'locked', locked: 6 }
];

let S;
function reset() {
  S = { tab: 'new', step: 1, src: 'etc', vendor: 'VETC', file: null, loading: false, readErr: false, saveTpl: true, tplName: 'ePass statement',
    cols: COLS0.map(c => ({ name: c[0], samples: c[1], field: c[2], hint: c[3], auto: !!c[2] })),
    rows: ROWS0.map(r => ({ r: r[0], t: r[1], plate: r[2], place: r[3], amt: r[4], code: r[5] })),
    filter: 'all', editing: null, hist: HIST0.map(h => ({ ...h })), histSrc: 'all', histLoading: false, histEmpty: false };
}
const hasTpl = () => !!TPL[S.vendor] || S.src === 'xml' || S.src === 'tpl';

/* ---------- Kiểm tra dòng ---------- */
function normPlate(v) { const x = String(v || '').replace(/[\s.\-]/g, '').toUpperCase().replace(/[TVX]$/, ''); const m = x.match(/^(\d{2}[A-Z]{1,2})(\d{3})(\d{2})$/); return m ? `${m[1]}-${m[2]}.${m[3]}` : null; }
function parseDT(v) {
  const m = String(v || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4}) (\d{1,2}):(\d{2})$/); if (!m) return { err: `Time '${v}' is not in a valid format` };
  const d = new Date(+m[3], +m[2] - 1, +m[1], +m[4], +m[5]); if (d.getMonth() !== +m[2] - 1) return { err: `Date '${m[1]}/${m[2]}/${m[3]}' doesn't exist` }; return { d };
}
function validate(r) {
  const e = {};
  const p = parseDT(r.t); if (p.err) e.t = p.err;
  if (!r.plate) e.plate = 'Missing plate'; else if (!normPlate(r.plate)) e.plate = `License plate '${r.plate}' is in the wrong format`;
  if (!r.amt) e.amt = 'Missing amount'; else if (!/^\d+$/.test(r.amt.replace(/,/g, ''))) e.amt = `Amount '${r.amt}' isn't a number`;
  const n = Object.keys(e).length;
  return { e, n, plate: normPlate(r.plate), prev: !n && PREV.has(r.code) };
}
function stats() {
  const v = S.rows.map(validate); const err = v.filter(x => x.n).length, prev = v.filter(x => x.prev).length + PREV_HIDDEN;
  return { v, err, prev, ok: TOTAL - err - prev };
}

/* ---------- Khung ---------- */
function renderTabs() {
  $('tabs').innerHTML = `<button role="tab" aria-selected="${S.tab === 'new'}" data-tab="new">${icon('upload')}New import</button><button role="tab" aria-selected="${S.tab === 'history'}" data-tab="history">${icon('clock')}Import history <span class="count-pill">${S.histEmpty ? 0 : S.hist.length}</span></button>`;
  $('tabs').querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; render(); });
}
const STEPS = ['Choose source & file', 'Map columns', 'Preview & fix', 'Result'];
function renderStepper() {
  const st = $('stepper'); st.hidden = S.tab !== 'new'; if (st.hidden) return;
  const skip2 = hasTpl() && S.step > 1;
  st.innerHTML = STEPS.map((t, i) => {
    const n = i + 1, isSkip = n === 2 && skip2, cls = isSkip ? 'skip' : n < S.step ? 'done' : n === S.step ? 'cur' : '';
    const label = isSkip ? `${t} <span class="via">· using saved template</span>` : t;
    return `${i ? `<span class="line ${n <= S.step ? 'done' : ''}"></span>` : ''}<button type="button" class="${cls}" ${n < S.step && S.step < 4 && !isSkip ? `data-go="${n}"` : 'tabindex="-1"'} ${n === S.step ? 'aria-current="step"' : ''}><span class="n">${n < S.step ? icon(isSkip ? 'copy' : 'check') : n}</span>${label}</button>`;
  }).join('');
  st.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { S.step = +b.dataset.go; render(); });
}
function render() { renderTabs(); renderStepper(); if (S.tab === 'history') return renderHistory(); [step1, step2, step3, step4][S.step - 1](); }
function foot(html) { $('footbar').hidden = !html; $('footbar').innerHTML = html || ''; requestAnimationFrame(syncFoot); }
function syncFoot() { const se = document.scrollingElement; $('footbar').classList.toggle('stuck', se.scrollHeight - se.scrollTop - se.clientHeight > 2); }
addEventListener('scroll', syncFoot, { passive: true }); addEventListener('resize', syncFoot);

/* ---------- Bước 1 ---------- */
function step1() {
  const src = SRC.find(s => s.k === S.src), tpl = TPL[S.vendor];
  let tplLine = '';
  if (S.src === 'etc' || S.src === 'fuel') tplLine = tpl
    ? `<div class="tplline"><span class="ic">${icon('copy')}</span><div class="grow">Using saved mapping template <b>"${tpl.name}"</b><span class="cell-sub">Used ${tpl.used}× · last on ${tpl.last}. The Map columns step is skipped.</span></div><button class="btn btn-ghost btn-sm" type="button" id="editTpl">Remap columns</button></div>`
    : `<div class="tplline new"><span class="ic">${icon('pen')}</span><div class="grow">First import from <b>${S.vendor}</b><span class="cell-sub">You map the columns once in the next step, and the system saves them as a template for future imports.</span></div></div>`;
  let zone;
  if (S.readErr) zone = `<div class="alert alert-danger" role="alert">${icon('block')}<div>Couldn't read '<b>LichSuQuaTram.xls</b>'. The file downloaded from ${S.vendor} is an HTML file renamed to .xls. Open it in Excel, choose Save as .xlsx, then upload it again.</div><div class="alert-actions"><button class="btn btn-secondary btn-sm" type="button" id="pickAgain">Choose another file</button></div></div>`;

function modal(html) {

  const m = document.createElement('div'); m.className = 'modal'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true'); m.style.width = 'min(520px, calc(100vw - 32px))';

  s.onclick = close; m.querySelectorAll('[data-x]').forEach(b => b.onclick = close); (m.querySelector('[data-x]')).focus();
  return { m, close };
}
function rollback(h) {
  if (h.st === 'locked') {
    const { m, close } = modal(`<h2>Can't fully undo <span class="code">${h.id}</span></h2>
      <div class="alert alert-warning">${icon('lock')}<div><b>${h.locked} transactions</b> are on settled trips (CH-0431 and ${h.id === 'IMP-0081' ? '11' : '3'} other trips). Costs of settled trips are locked.</div></div>
      <p class="muted">You can undo the unlocked part (<b class="num">${h.n - h.locked}</b> transactions), or reopen the settlements of these trips on the Settlement screen and then undo the whole import.</p>
      <div class="row" style="justify-content:flex-end;flex-wrap:wrap"><a class="btn btn-ghost" href="fm-22-quyet-toan.html" style="margin-right:auto">Open Settlement</a><button class="btn btn-secondary" type="button" data-x>Close</button><button class="btn btn-danger" type="button" id="part">Undo ${h.n - h.locked} transactions</button></div>`);
    m.querySelector('#part').onclick = () => { close(); toast(`Undid ${h.n - h.locked} unlocked transactions from ${h.id}`); };
    return;
  }
  const trips = h.src === 'etc' ? 52 : h.src === 'fuel' ? 23 : 18;
  const { m, close } = modal(`<h2>Undo import <span class="code">${h.id}</span>?</h2>
    <p class="muted">${h.file} · ${h.vendor} · period ${h.period}</p>
    <ul class="sumlist"><li>Delete <b class="num">${h.n}</b> imported transactions</li><li>Remove <b class="num">${h.ok}</b> cost lines from <b class="num">${trips}</b> unsettled trips</li>${h.st === 'todo' ? `<li>Drop ${h.todo} transactions pending in Transaction matching</li>` : ''}<li>The column mapping template is kept</li></ul>
    <label class="field"><span>Reason *</span><select class="select" id="why"><option value="">Choose a reason…</option><option>Wrong period selected</option><option>Wrong file / provider selected</option><option>Wrong column mapping</option><option>Other</option></select></label>
    <p class="sm muted">This can't be restored once you confirm. You can import the original file again.</p>
    <div class="row" style="justify-content:flex-end"><button class="btn btn-secondary" type="button" data-x>Keep</button><button class="btn btn-danger" type="button" id="doRb" disabled>Undo import</button></div>`);
  const why = m.querySelector('#why'), ok = m.querySelector('#doRb');
  why.onchange = () => ok.disabled = !why.value;
  ok.onclick = () => { close(); h.st = 'undone'; h.note = `Undone 12/11 ${new Date().toTimeString().slice(0, 5)} · ${why.value.toLowerCase()}`; if (S.tab === 'new') { S.tab = 'history'; } render(); toast(`Undid ${h.id}: deleted ${h.n} transactions`); };
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.modal:not(.leaving), .modal-scrim:not(.leaving)').forEach(x => Shell.dismiss(x)); });

/* ---------- States ---------- */
Shell.states([['default', 'Default'], ['file', 'File selected (with template)'], ['mapping', 'First time: map columns'], ['preview', 'Preview with errors'], ['result', 'Result'], ['history', 'Import history'], ['blocked', 'Undo blocked'], ['loading', 'Loading'], ['empty', 'Empty'], ['error', 'File read error']], st => {
  document.querySelectorAll('.modal, .modal-scrim').forEach(x => x.remove());
  reset();
  if (st === 'file') S.file = 'VETC_sao_ke_10-12.11.xlsx';
  if (['mapping', 'preview', 'result'].includes(st)) { S.vendor = 'ePass'; S.file = 'Sao ke ePass 10-12.11.xlsx'; }
  if (st === 'mapping') { S.step = 2; S.cols[3].field = ''; S.cols[3].auto = false; S.cols[6].field = ''; S.cols[6].auto = false; }
  if (st === 'preview') { S.step = 3; S.cols[3].field = '__skip'; S.cols[6].field = 'Fee type'; S.filter = 'err'; }
  if (st === 'result') S.step = 4;
  if (st === 'history' || st === 'blocked' || st === 'empty') S.tab = 'history';
  if (st === 'loading') { S.tab = 'history'; S.histLoading = true; }
  if (st === 'empty') S.histEmpty = true;
  if (st === 'error') S.readErr = true;
  render();
  if (st === 'blocked') rollback(S.hist.find(h => h.id === 'IMP-0081'));
});
</script>
