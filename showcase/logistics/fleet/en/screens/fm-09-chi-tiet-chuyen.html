      <tbody>${T.lines.map(l => `<tr data-line="${l.id}">
        <td><span class="src">${icon(SRC[l.src][0])}${SRC[l.src][1]}</span></td><td>${l.type}</td><td style="white-space:normal">${l.desc}</td>
        <td class="right num">${S.unlocked && l.src !== 'formula' ? `<input class="input amt-input num" value="${V(l.amt)}" data-amt="${l.id}" aria-label="Amount ${l.desc}">` : V(l.amt)}</td>
        <td>${l.doc ? `<button class="docbtn" type="button" data-view="${l.id}" aria-label="View document ${l.desc}">${icon(l.doc === 'img' ? 'camera' : 'doc')}${l.doc === 'img' ? 'Photo' : 'PDF'}</button>` : '<span class="muted">—</span>'}</td>
        <td><span class="badge ${AP[l.ap][0]}">${icon(AP[l.ap][1])}${AP[l.ap][2]}</span></td></tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="3">Total</td><td class="right num">${V(c.act)}</td><td colspan="2"></td></tr></tfoot></table></div>
  </section>`;
  p.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { S.mode = b.dataset.mode; renderPL(p); });
  p.querySelectorAll('[data-exp]').forEach(b => b.onclick = () => { S.expand = S.expand === b.dataset.exp ? null : b.dataset.exp; renderPL(p); });
  p.querySelectorAll('[data-view]').forEach(b => b.onclick = () => openDocViewer(b.dataset.view));
  p.querySelectorAll('[data-amt]').forEach(inp => inp.onchange = () => { const l = T.lines.find(x => x.id === inp.dataset.amt); const v = +inp.value.replace(/\D/g, ''); if (!isNaN(v)) { l.amt = v; renderPL(p); toast(`Updated ${l.desc}: ${V(v)} ₫`); } });
  p.querySelectorAll('[data-go]').forEach(b => b.onclick = () => setTab(b.dataset.go));
  p.querySelectorAll('[data-scroll]').forEach(b => b.onclick = () => { const r = document.getElementById('pl-' + b.dataset.scroll); if (r) r.scrollIntoView({ block: 'start', behavior: 'smooth' }); });
  const ub = document.getElementById('unlockBtn'); if (ub) ub.onclick = openUnlock;
  const rl = document.getElementById('relockBtn'); if (rl) rl.onclick = () => { S.unlocked = false; render(); toast('Trip costs locked again'); };
  const ac = document.getElementById('addCost'); if (ac) ac.onclick = () => { T.lines.push({ id: 'N' + T.lines.length, src: 'pen', cat: 'other', type: 'Other', desc: 'New manual line', amt: 0, doc: null, ap: 'wait' }); renderPL(p); const ins = p.querySelectorAll('[data-amt]'); if (ins.length) ins[ins.length - 1].focus(); else toast('Manual line added'); };
}

/* ---------- Tab: Chứng từ ---------- */
function paperHtml(d, line) {
  if (line && line.inv) return `<h4>${line.inv[0].split(' · ')[1] || 'Invoices'}</h4><div class="muted" style="text-align:center;margin-bottom:6px">${line.inv[0].split(' · ')[0]}</div>${line.inv[1].map(([a, b]) => `<div class="ln"><span>${a}</span><span class="num">${b}</span></div>`).join('')}<div class="ln tot"><span>Total</span><span class="num">${V(line.inv[2])} ₫</span></div><div class="sig"><span>Buyer: Transport Co.</span><span>Paid</span></div>`;
  if (!d) return '';
  if (d.f === 'pod') return `<h4>Delivery receipt</h4><div class="ln"><span>Trip</span><span class="code">${T.id}</span></div><div class="ln"><span>Receiver</span><span>${T.id === 'CH-0458' ? 'Tân Cảng Logistics' : d.name.slice(-7)}</span></div><div class="ln"><span>Cargo</span><span class="num">${T.id === 'CH-0458' ? "1×40' · 24.5 t" : 'complete, packaging intact'}</span></div><div class="ln"><span>Delivery time</span><span class="num">${d.at}</span></div><div class="sig"><span>Delivered by</span><span>Received by</span></div><svg viewBox="0 0 220 40" width="100%" height="40" aria-label="Signature"><path d="M8,30 C20,8 30,34 42,18 S60,26 70,14" stroke="var(--fg-muted)" fill="none" stroke-width="1.5"/><path d="M140,28 C150,6 162,32 172,16 S190,30 206,12" stroke="var(--primary)" fill="none" stroke-width="1.5"/></svg>`;
  if (d.f === 'gvt') return `<h4>Waybill</h4><div class="muted" style="text-align:center;margin-bottom:6px" class="code">${d.name}</div><div class="ln"><span>Vehicle</span><span class="code">${T.id === 'CH-0458' ? '51C-123.45' : '61C-245.18'}</span></div><div class="ln"><span>Driver</span><span>${T.id === 'CH-0458' ? 'Nguyễn Văn Tuấn' : 'Trần Văn Hùng'}</span></div><div class="ln"><span>Route</span><span>${T.route.split(' → ')[0]} →</span></div><div class="ln"><span>Issued</span><span class="num">${d.at}</span></div><div class="sig"><span>Lookup QR code</span><span>System</span></div>`;
  if (d.f === 'eir') return `<h4>EIR</h4><div class="ln"><span>Container</span><span class="code">TCLU 4421087</span></div><div class="ln"><span>Type</span><span>40' HC</span></div><div class="ln"><span>Condition</span><span>Good, no damage</span></div><div class="ln"><span>Time</span><span class="num">${d.at}</span></div><div class="sig"><span>Driver</span><span>Surveyor</span></div>`;
  const l = T.lines.find(x => x.docId === d.id && x.inv); if (l) return paperHtml(null, l);
  return `<h4>ETC statement</h4>${T.lines.filter(x => x.src === 'tray').map(x => `<div class="ln"><span>${x.desc}</span><span class="num">${V(x.amt)}</span></div>`).join('')}<div class="ln tot"><span>Total</span><span class="num">${V(T.lines.filter(x => x.src === 'tray').reduce((s, x) => s + x.amt, 0))} ₫</span></div>`;
}
let zoom = 1, rot = 0;
function viewerBar() { return `<button class="icon-btn" type="button" data-z="-1" aria-label="Zoom out">−</button><span class="num sm muted" style="min-width:40px;text-align:center">${Math.round(zoom * 100)}%</span><button class="icon-btn" type="button" data-z="1" aria-label="Zoom in">${icon('plus')}</button><button class="icon-btn" type="button" data-rot aria-label="Rotate">${icon('refresh')}</button>`; }
function bindViewer(root, rerender) {
  root.querySelectorAll('[data-z]').forEach(b => b.onclick = () => { zoom = Math.min(2, Math.max(.6, zoom + (+b.dataset.z) * .2)); rerender(); });
  root.querySelectorAll('[data-rot]').forEach(b => b.onclick = () => { rot = (rot + 90) % 360; rerender(); });
}
function renderDocs(p) {
  if (S.noDocs) { p.innerHTML = `<div class="card"><div class="empty">${icon('camera')}<h3>No documents yet</h3><p>PODs, EIRs and cost invoices will appear here once the driver photographs them in the app.</p></div></div>`; return; }
  const types = ['All', 'Waybill', 'POD', 'EIR', 'Cost invoice'];
  const list = T.docs.filter(d => S.docF === 'All' || d.type.startsWith(S.docF));
  const sel = T.docs.find(d => d.id === S.docSel) || T.docs[0];
  p.innerHTML = `<div class="docs-split">
    <section class="card" aria-label="Document list" style="min-width:0">
      <div class="card-head" style="flex-wrap:wrap">${types.map(t => `<button class="chip ${S.docF === t ? 'on' : ''}" type="button" data-df="${t}">${t}</button>`).join('')}<div class="tools"><button class="btn btn-secondary btn-sm" type="button" id="zipBtn">${icon('download')}Download all (.zip)</button></div></div>
      <div class="grid-wrap"><table class="grid"><thead><tr><th>Type</th><th>Name / number</th><th class="right">Time</th><th>Uploaded by</th><th>Status</th></tr></thead>
      <tbody>${list.map(d => `<tr class="clickable ${d.id === sel.id ? 'selected' : ''}" data-dsel="${d.id}" tabindex="0"><td>${d.type}</td><td class="dname" title="${d.name}">${d.f === 'gvt' || d.f === 'eir' ? `<span class="code">${d.name}</span>` : d.name}</td><td class="right num">${d.at}</td><td>${d.by}</td><td>${d.st}</td></tr>`).join('')}</tbody></table></div>
      <p class="sm muted" style="padding:12px 18px 16px;margin:auto 0 0">Waybills and their superseded versions are kept for at least 3 years and can't be deleted.</p>
    </section>
    <section class="card viewer" aria-label="Document viewer">
      <div class="card-head"><h2 style="font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${sel.type} · ${sel.name}</h2></div>
      <div class="paper-stage"><div class="paper" style="transform:scale(${zoom}) rotate(${rot}deg)">${paperHtml(sel)}</div></div>
      <div class="viewer-bar">${viewerBar()}<span style="flex:1"></span><button class="btn btn-secondary btn-sm" type="button" id="dlOne">${icon('download')}Download</button><button class="btn btn-secondary btn-sm" type="button" id="printOne">Print</button></div>
    </section>
  </div>`;
  p.querySelectorAll('[data-df]').forEach(b => b.onclick = () => { S.docF = b.dataset.df; renderDocs(p); });
  p.querySelectorAll('[data-dsel]').forEach(r => { r.onclick = () => { S.docSel = r.dataset.dsel; renderDocs(p); }; r.onkeydown = e => { if (e.key === 'Enter') r.click(); }; });
  bindViewer(p, () => renderDocs(p));
  document.getElementById('zipBtn').onclick = () => toast(`Generating ${T.id}_chung-tu.zip (${T.docs.length} files)…`);
  document.getElementById('dlOne').onclick = () => toast(`Downloaded ${sel.name}`);
  document.getElementById('printOne').onclick = () => toast('Sent to printer');
}

/* ---------- Drawer: xem chứng từ dòng chi phí (EL-28) ---------- */
function closeOverlays() { document.querySelectorAll('.drawer:not(.leaving), .scrim:not(.leaving), .modal:not(.leaving)').forEach(x => { x.removeAttribute('id'); Shell.dismiss(x); }); }
function openDocViewer(lineId) {
  closeOverlays(); zoom = 1; rot = 0;
  const withDoc = T.lines.filter(l => l.doc); let i = withDoc.findIndex(l => l.id === lineId);
  const s = document.createElement('div'); s.className = 'scrim'; s.onclick = closeOverlays;
  const d = document.createElement('aside'); d.className = 'drawer doc'; d.setAttribute('role', 'dialog'); d.setAttribute('aria-modal', 'true');
  document.body.append(s, d);
  const draw = () => { const l = withDoc[i]; const doc = T.docs.find(x => x.id === l.docId);
    d.innerHTML = `<div class="drawer-head"><div class="row"><h2>${l.inv ? l.inv[0] : doc.name} · <span class="num">${V(l.amt)} ₫</span></h2><button class="icon-btn" id="dvClose" aria-label="Close (Esc)" style="margin-left:auto">${icon('x', 'lg')}</button></div><div class="row sm muted"><span class="src">${icon(SRC[l.src][0])}${SRC[l.src][1]}</span> · ${l.type} · ${l.desc}</div></div>
      <div class="drawer-body" style="padding:0"><div class="paper-stage" style="height:100%;min-height:420px"><div class="paper" style="transform:scale(${zoom}) rotate(${rot}deg)">${paperHtml(doc, l)}</div></div></div>
      <div class="drawer-foot" style="justify-content:space-between">${`<div class="row">${viewerBar()}</div>`}<div class="row"><button class="btn btn-secondary btn-sm" type="button" id="dvPrev" ${i === 0 ? 'disabled' : ''}>← Previous</button><span class="sm muted num">${i + 1}/${withDoc.length}</span><button class="btn btn-secondary btn-sm" type="button" id="dvNext" ${i === withDoc.length - 1 ? 'disabled' : ''}>Next →</button></div></div>`;
    d.querySelector('#dvClose').onclick = closeOverlays; d.querySelector('#dvPrev').onclick = () => { i--; draw(); }; d.querySelector('#dvNext').onclick = () => { i++; draw(); }; bindViewer(d, draw); };
  draw(); d.querySelector('#dvClose').focus();
}

/* ---------- Drawer: chia sẻ link (EL-40) ---------- */
function openShare() {
  closeOverlays();
  const s = document.createElement('div'); s.className = 'scrim'; s.onclick = closeOverlays;
  const d = document.createElement('aside'); d.className = 'drawer narrow'; d.setAttribute('role', 'dialog'); d.setAttribute('aria-modal', 'true'); d.setAttribute('aria-labelledby', 'shTitle');
  document.body.append(s, d);
  const draw = () => {
    d.innerHTML = `<div class="drawer-head"><div class="row"><h2 id="shTitle">Share tracking link</h2><button class="icon-btn" id="shClose" aria-label="Close (Esc)" style="margin-left:auto">${icon('x', 'lg')}</button></div><p class="sm muted">${T.id} · ${T.route}</p></div>
    <div class="drawer-body">
      ${S.linkRevoked ? `<div class="alert alert-warning">${icon('warn')}<div>The old link has been revoked. Customers who open it will see "Link expired".</div><div class="alert-actions"><button class="btn btn-secondary btn-sm" type="button" id="newLink">Create new link</button></div></div>` : ''}
      <label class="field"><span>Tracking link</span><div class="share-url"><input class="input" readonly value="https://theodoi.fleet.vn/t/${S.linkRevoked ? '—' : '8KQ2-X7PM'}" aria-label="Tracking link" ${S.linkRevoked ? 'style="text-decoration:line-through"' : ''}><button class="btn btn-secondary" type="button" id="copyLink" ${S.linkRevoked ? 'disabled' : ''}>${icon('copy')}Copy link</button></div></label>
      <div class="kv">
        <div><h4><span class="pos">${icon('check')}</span>Customer sees</h4><ul><li>Milestone status</li><li>Estimated arrival time</li><li>POD once completed</li></ul></div>
        <div><h4><span class="neg">${icon('block')}</span>Customer doesn't see</h4><ul><li>Exact vehicle location</li><li>Driver phone</li></ul></div>
      </div>
      <div class="row sm"><span class="muted">${icon('clock')}</span><span>Link expires: 7 days after the trip is completed (<b class="num">19/11/2026</b>)</span></div>
    </div>
    <div class="drawer-foot" style="justify-content:space-between"><a class="btn btn-ghost" ${NA}>${icon('external')}View as customer</a><button class="btn btn-danger" type="button" id="revoke" ${S.linkRevoked ? 'disabled' : ''}>Revoke link</button></div>`;
    d.querySelector('#shClose').onclick = closeOverlays;
    const cp = d.querySelector('#copyLink'); cp.onclick = () => { try { navigator.clipboard.writeText('https://theodoi.fleet.vn/t/8KQ2-X7PM'); } catch (e) {} toast('Tracking link copied'); };
    d.querySelector('#revoke').onclick = () => confirmModal('Revoke tracking link?', 'Customers holding this link will no longer be able to view it. You can create a new link later.', 'Revoke link', () => { S.linkRevoked = true; draw(); toast('Tracking link revoked'); }, true);
    const nl = d.querySelector('#newLink'); if (nl) nl.onclick = () => { S.linkRevoked = false; draw(); toast('New link created'); };
  };
  draw(); d.querySelector('#shClose').focus();
}

/* ---------- Modal ---------- */
function confirmModal(title, body, okLabel, onOk, keepDrawer) {
  const s = document.createElement('div'); s.className = 'scrim modal-scrim';
  const m = document.createElement('div'); m.className = 'modal'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true');
  m.innerHTML = `<h2>${title}</h2><p class="muted">${body}</p><div class="row" style="justify-content:flex-end"><button class="btn btn-secondary" type="button" data-x>Back</button><button class="btn btn-danger" type="button" data-ok>${okLabel}</button></div>`;
  document.body.append(s, m); const close = () => { Shell.dismiss(s); Shell.dismiss(m); };
  m.querySelector('[data-x]').onclick = close; s.onclick = close; m.querySelector('[data-ok]').onclick = () => { close(); onOk(); }; m.querySelector('[data-x]').focus();
}
function openUnlock() {
  const s = document.createElement('div'); s.className = 'scrim modal-scrim';
  const m = document.createElement('div'); m.className = 'modal'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true'); m.setAttribute('aria-labelledby', 'ulT');
  m.innerHTML = `<h2 id="ulT">Unlock costs for trip ${T.id}?</h2><p class="muted">The trip's P&amp;L will change in reports already viewed. This action is recorded in the audit log.</p>
    <label class="field"><span>Reason for unlocking (required)</span><textarea class="input" id="ulReason" rows="3" placeholder="e.g. lift-on/lift-off invoice entered with the wrong amount"></textarea></label>
    <div class="row" style="justify-content:flex-end"><button class="btn btn-secondary" type="button" data-x>Back</button><button class="btn btn-danger" type="button" id="ulOk" disabled>Unlock</button></div>`;
  document.body.append(s, m); const close = () => { Shell.dismiss(s); Shell.dismiss(m); };
  m.querySelector('[data-x]').onclick = close; s.onclick = close;
  const r = m.querySelector('#ulReason'), okb = m.querySelector('#ulOk'); r.oninput = () => okb.disabled = !r.value.trim(); r.focus();
  okb.onclick = () => { close(); S.unlocked = true; T.history.unshift(['16/11 09:12', 'Phạm Thu Hà (Chief accountant)', 'Unlocked costs: ' + r.value.trim(), 'cost', 3]); render(); toast('Costs unlocked. The reason has been recorded in the trip history.'); };
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeOverlays(); });

/* ---------- Prototype states ---------- */
Shell.states([
  ['default', 'Default'], ['running', 'En route'], ['done', 'Completed'], ['journey', 'Route'], ['journey-nogsht', 'No GPS tracker'],
  ['pl-gross', 'P&L: gross profit'], ['pl-alloc', 'P&L: after allocation'], ['multi', 'Multiple orders combined'], ['unlocked', 'Unlocked'], ['docs', 'Documents'],
  ['share', 'Share link'], ['loading', 'Loading'], ['empty', 'Empty (documents)'], ['error', 'GPS tracker error'], ['noperm', 'No permission']
], s => {
  closeOverlays();
  const map = {
    default: {}, running: { status: 'running' }, done: { status: 'done' }, journey: { tab: 'journey' }, 'journey-nogsht': { tab: 'journey', gsht: false },
    'pl-gross': { tab: 'pl' }, 'pl-alloc': { tab: 'pl', mode: 'alloc' }, multi: { trip: 'CH-0471', status: 'done', tab: 'pl', docSel: 'e2' }, unlocked: { tab: 'pl', unlocked: true },
    docs: { tab: 'docs', docSel: 'd4' }, share: {}, loading: { loading: true }, empty: { tab: 'docs', status: 'accepted', noDocs: true }, error: { tab: 'journey', gshtError: true }, noperm: { noperm: true }
  };
  reset(map[s]);
  if (s === 'running') { /* giữ tab Tổng quan */ }
  render();
  if (s === 'share') openShare();
});
try { const t = new URL(location.href).searchParams.get('tab'); if (t && !location.hash && ['overview', 'journey', 'pl', 'docs'].includes(t)) setTab(t); } catch (e) {}
</script>
</body>
